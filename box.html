<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App - Linklabo AI Tool</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    const icon = lucide.icons[name];
                    if (icon) {
                        lucide.createIcons({
                            icons: { [name]: icon },
                            nameAttr: 'data-lucide',
                            attrs: { 'stroke-width': 2, width: size, height: size, class: className }
                        });
                    }
                }
            }, [name, size, className]);
            return <i ref={ref} data-lucide={name.toLowerCase()} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        const generateId = () => Math.random().toString(36).substring(2, 9);

        const Lucide = {
            UploadCloud: (props) => <Icon name="UploadCloud" {...props} />,
            ImagePlus: (props) => <Icon name="ImagePlus" {...props} />,
            Save: (props) => <Icon name="Save" {...props} />,
            RefreshCw: (props) => <Icon name="RefreshCw" {...props} />,
            Loader2: (props) => <Icon name="Loader2" {...props} />,
            Sparkles: (props) => <Icon name="Sparkles" {...props} />,
            X: (props) => <Icon name="X" {...props} />,
            MessageSquare: (props) => <Icon name="MessageSquare" {...props} />,
            Pencil: (props) => <Icon name="Pencil" {...props} />,
            Upload: (props) => <Icon name="Upload" {...props} />,
            Download: (props) => <Icon name="Download" {...props} />,
            Trash2: (props) => <Icon name="Trash2" {...props} />,
            Edit: (props) => <Icon name="Edit" {...props} />,
            RefreshCw: (props) => <Icon name="RefreshCw" {...props} />,
            Search: (props) => <Icon name="Search" {...props} />,
        };

                const { UploadCloud, ImagePlus, Save, RefreshCw, Loader2, Sparkles, X, MessageSquare, Pencil, Upload, Download, Trash2, Edit, Search } = Lucide;

        // Main code
        
const apiKey = ""; // Gemini API Key will be injected

function App() {
  const [mode, setMode] = useState('generate'); // 'generate' or 'edit'
  const [prompt, setPrompt] = useState('');
  const [comment, setComment] = useState('');
  const [referenceImage, setReferenceImage] = useState(null);
  const [previews, setPreviews] = useState([]);
  const [savedImages, setSavedImages] = useState([]);
  const [isLoading, setIsLoading] = useState(false);
  const [error, setError] = useState(null);

  const fileInputRef = useRef(null);

  // --- API Functions ---
  const systemPrompt = "マジックペン風の手描きイラスト。背景は真っ白なキャンバス。黒い線画のみ。花やハート、星などの装飾を少し散りばめる。子ども向けのかわいらしく親しみやすいテイスト。箱の印刷に使いやすいシンプルな構図。画像内に文字やテキストは絶対に含めないこと。";

  const generateSingleImage = async (fullPrompt) => {
    const payload = {
      instances: { prompt: fullPrompt },
      parameters: { sampleCount: 1 }
    };
    const response = await fetch(`/api/ai`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    
    if (!response.ok) throw new Error('画像の生成に失敗しました');
    const data = await response.json();
    return `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
  };

  const editSingleImage = async (base64Img, editPrompt) => {
    const combinedPrompt = `元の画像の構図や雰囲気を維持しつつ、以下の指示に従って部分的に変更してください。指示: ${editPrompt}。 スタイル制約: ${systemPrompt}`;
    
    // Remove data:image/png;base64, prefix for API
    const base64Data = base64Img.split(',')[1];

    const payload = {
      contents: [
        {
          parts: [
            { text: combinedPrompt },
            { inlineData: { mimeType: "image/png", data: base64Data } }
          ]
        }
      ],
      generationConfig: { responseModalities: ['IMAGE'] }
    };

    const response = await fetch(`/api/ai`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) throw new Error('画像の編集に失敗しました');
    const data = await response.json();
    
    const outputBase64 = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
    if (!outputBase64) throw new Error('画像データが取得できませんでした');
    return `data:image/png;base64,${outputBase64}`;
  };

  // --- Handlers ---
  const handleExecute = async () => {
    if (!prompt.trim() && mode === 'generate') return;
    if (mode === 'edit' && !referenceImage) {
        setError('編集する元画像を選択してください');
        return;
    }

    setIsLoading(true);
    setError(null);
    setPreviews([]);

    try {
      if (mode === 'generate') {
        const fullPrompt = `${prompt}。 ${systemPrompt}`;
        // Generate 3 variations concurrently
        const promises = [
          generateSingleImage(fullPrompt),
          generateSingleImage(fullPrompt),
          generateSingleImage(fullPrompt)
        ];
        const results = await Promise.all(promises);
        setPreviews(results.map(url => ({ id: generateId(), url })));
      } else {
        // Edit mode: Generate 3 variations based on reference image
        const promises = [
          editSingleImage(referenceImage, prompt || "少しだけバリエーションを変えて"),
          editSingleImage(referenceImage, prompt || "少しだけバリエーションを変えて"),
          editSingleImage(referenceImage, prompt || "少しだけバリエーションを変えて")
        ];
        const results = await Promise.all(promises);
        setPreviews(results.map(url => ({ id: generateId(), url })));
      }
    } catch (err) {
      setError(err.message || 'エラーが発生しました');
    } finally {
      setIsLoading(false);
    }
  };

  const handleSave = (imgUrl) => {
    setSavedImages(prev => [{
      id: generateId(),
      url: imgUrl,
      comment: comment || 'コメントなし',
      date: new Date().toLocaleString()
    }, ...prev]);
    setComment(''); // Reset comment
  };

  const handleReEdit = (imgUrl) => {
    setReferenceImage(imgUrl);
    setMode('edit');
    setPrompt('');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // --- Drag and Drop Handlers ---
  const handleDragOver = (e) => {
    e.preventDefault();
    e.stopPropagation();
  };

  const handleDrop = (e) => {
    e.preventDefault();
    e.stopPropagation();
    
    const files = e.dataTransfer.files;
    if (files && files[0] && files[0].type.startsWith('image/')) {
        handleFileSelection(files[0]);
    }
  };

  const handleFileInput = (e) => {
    if (e.target.files && e.target.files[0]) {
        handleFileSelection(e.target.files[0]);
    }
  };

  const handleFileSelection = (file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
          setReferenceImage(e.target.result);
          setMode('edit');
      };
      reader.readAsDataURL(file);
  };

  return (
    <div className="flex flex-col md:flex-row min-h-screen bg-slate-50 font-sans text-slate-800">
      
      {/* 左ペイン：操作パネル */}
      <div className="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 p-6 flex flex-col shadow-sm z-10">
        <h1 className="text-2xl font-bold mb-6 flex items-center text-indigo-600">
          <Sparkles className="mr-2" size={24} />
          ハコエカキ
        </h1>

        {/* モード切替タブ */}
        <div className="flex p-1 bg-slate-100 rounded-xl mb-6">
          <button
            onClick={() => setMode('generate')}
            className={`flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-colors flex justify-center items-center ${mode === 'generate' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
          >
            <ImagePlus size={16} className="mr-2" />
            新しく作る
          </button>
          <button
            onClick={() => setMode('edit')}
            className={`flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-colors flex justify-center items-center ${mode === 'edit' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
          >
            <Pencil size={16} className="mr-2" />
            手直しする
          </button>
        </div>

        {/* 編集モード時の参考画像エリア */}
        {mode === 'edit' && (
          <div className="mb-6">
            <label className="block text-sm font-medium text-slate-700 mb-2">元にする画像</label>
            <div 
              onDragOver={handleDragOver}
              onDrop={handleDrop}
              className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition-colors ${referenceImage ? 'border-indigo-300 bg-indigo-50' : 'border-slate-300 hover:border-indigo-400 bg-slate-50'}`}
              onClick={() => fileInputRef.current?.click()}
            >
              <input type="file" ref={fileInputRef} onChange={handleFileInput} accept="image/*" className="hidden" />
              {referenceImage ? (
                <div className="relative inline-block w-full">
                  <img src={referenceImage} alt="Reference" className="w-full h-auto max-h-48 object-contain rounded-lg bg-white border" />
                  <button 
                    onClick={(e) => { e.stopPropagation(); setReferenceImage(null); }}
                    className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:bg-red-600"
                  >
                    <X size={14} />
                  </button>
                </div>
              ) : (
                <div className="py-6 flex flex-col items-center text-slate-500">
                  <UploadCloud size={32} className="mb-2 text-slate-400" />
                  <p className="text-sm font-medium">クリックかドラッグで<br/>画像を追加</p>
                </div>
              )}
            </div>
          </div>
        )}

        {/* プロンプト入力 */}
        <div className="mb-6 flex-grow">
          <label className="block text-sm font-medium text-slate-700 mb-2">
            {mode === 'generate' ? 'どんな絵を描く？' : 'どこを直す？ (例: リボンをつけて)'}
          </label>
          <textarea
            value={prompt}
            onChange={(e) => setPrompt(e.target.value)}
            placeholder={mode === 'generate' ? "例：クマが風船を持っているところ" : "例：少しだけ雰囲気を変えて"}
            className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow resize-none h-32 text-sm"
          />
          <p className="text-xs text-slate-500 mt-2">※白黒のマジックペン風で描かれます。</p>
        </div>

        {/* コメント入力 */}
        <div className="mb-6">
          <label className="block text-sm font-medium text-slate-700 mb-2 flex items-center">
            <MessageSquare size={14} className="mr-1" />
            メモ・コメント (保存用)
          </label>
          <input
            type="text"
            value={comment}
            onChange={(e) => setComment(e.target.value)}
            placeholder="箱のフタ用、など"
            className="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm"
          />
        </div>

        {/* 実行ボタン */}
        <button
          onClick={handleExecute}
          disabled={isLoading || (mode === 'generate' && !prompt.trim()) || (mode === 'edit' && !referenceImage)}
          className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-md hover:bg-indigo-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors flex justify-center items-center"
        >
          {isLoading ? (
            <><Loader2 className="animate-spin mr-2" size={20} /> 描いています...</>
          ) : (
            <>{mode === 'generate' ? '魔法のペンで描く！' : '手直しする！'}</>
          )}
        </button>

        {error && (
          <div className="mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm">
            {error}
          </div>
        )}
      </div>

      {/* 右ペイン：プレビューと保存済み */}
      <div className="flex-1 p-6 md:p-8 overflow-y-auto flex flex-col">
        
        {/* プレビューエリア */}
        <div className="mb-10">
          <h2 className="text-xl font-bold mb-4 flex items-center border-b pb-2">
            プレビュー (3案)
          </h2>
          
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {isLoading ? (
              // Loading placeholders
              [1, 2, 3].map(i => (
                <div key={i} className="bg-slate-200 rounded-2xl animate-pulse aspect-square flex items-center justify-center border-2 border-slate-100 shadow-sm">
                  <Sparkles className="text-slate-300" size={48} />
                </div>
              ))
            ) : previews.length > 0 ? (
              // Previews
              previews.map((preview) => (
                <div key={preview.id} className="bg-white rounded-2xl p-3 shadow-md border border-slate-200 flex flex-col group hover:shadow-lg transition-shadow">
                  <div className="aspect-square bg-slate-50 rounded-xl overflow-hidden mb-3 border border-slate-100 relative">
                    <img src={preview.url} alt="Generated Preview" className="w-full h-full object-cover" />
                  </div>
                  <div className="flex gap-2 mt-auto">
                    <button 
                      onClick={() => handleReEdit(preview.url)}
                      className="flex-1 py-2 bg-indigo-50 text-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-100 transition-colors flex items-center justify-center"
                    >
                      <RefreshCw size={14} className="mr-1" /> 手直し
                    </button>
                    <button 
                      onClick={() => handleSave(preview.url)}
                      className="flex-1 py-2 bg-emerald-500 text-white rounded-lg text-sm font-medium hover:bg-emerald-600 transition-colors flex items-center justify-center shadow-sm"
                    >
                      <Save size={14} className="mr-1" /> 保存
                    </button>
                  </div>
                </div>
              ))
            ) : (
              // Empty state
              <div className="col-span-full py-20 flex flex-col items-center justify-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300">
                <ImagePlus size={48} className="mb-4 opacity-50" />
                <p>左のパネルから絵の指示を出してね！</p>
              </div>
            )}
          </div>
        </div>

        {/* 保存済みエリア */}
        <div className="mt-auto">
          <h2 className="text-xl font-bold mb-4 flex items-center border-b pb-2">
            保存した絵
            <span className="ml-2 text-sm font-normal text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full">{savedImages.length}</span>
          </h2>
          
          {savedImages.length > 0 ? (
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
              {savedImages.map((img) => (
                <div key={img.id} className="bg-white rounded-xl p-2 shadow-sm border border-slate-200 relative group">
                  <img src={img.url} alt="Saved" className="w-full aspect-square object-cover rounded-lg border border-slate-100 mb-2" />
                  <p className="text-xs text-slate-600 truncate px-1" title={img.comment}>{img.comment}</p>
                  
                  {/* Hover Actions */}
                  <div className="absolute inset-0 bg-black bg-opacity-40 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[1px]">
                     <button 
                        onClick={() => handleReEdit(img.url)}
                        className="bg-white text-indigo-600 p-2 rounded-full hover:bg-indigo-50 shadow-md"
                        title="これを元に手直しする"
                      >
                        <Pencil size={18} />
                      </button>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="py-10 text-center text-slate-400 text-sm">
              まだ保存された絵はありません。
            </div>
          )}
        </div>

      </div>
    </div>
  );
}

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
