<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レーザー彫刻ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">レーザー彫刻ジェネレーター</h1>
            <p class="text-gray-600 mt-2">AI (Image-to-Image) とディザリングで画像を彫刻データに変換します</p>
        </header>

        <!-- ドラッグ＆ドロップエリア -->
        <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-xl p-10 text-center cursor-pointer transition-colors hover:bg-gray-100 flex flex-col items-center justify-center min-h-[200px]">
            <svg class="w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-lg text-gray-600 font-medium">画像ファイルをドラッグ＆ドロップ</p>
            <p class="text-sm text-gray-500 mt-1">またはクリックして選択</p>
            <input type="file" id="fileInput" class="hidden" accept="image/*">
        </div>

        <!-- ローディング表示 -->
        <div id="loading" class="hidden flex-col items-center justify-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p id="loadingText" class="text-gray-600">処理中...</p>
        </div>

        <!-- エラーメッセージ -->
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
            <span class="block sm:inline" id="errorText"></span>
            <button id="retryErrorBtn" class="ml-4 underline font-bold">再試行する</button>
        </div>

        <!-- 結果表示エリア -->
        <div id="results" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="flex flex-col items-center space-y-2">
                    <h2 class="text-lg font-semibold">1. 元画像</h2>
                    <img id="origImg" class="max-w-full h-auto rounded-lg border shadow-sm">
                </div>
                
                <div class="flex flex-col items-center space-y-2">
                    <h2 class="text-lg font-semibold">2. ディザリング後</h2>
                    <canvas id="ditherCanvas"></canvas>
                    <button id="downloadDitherBtn" class="mt-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors w-full max-w-[200px] shadow-sm">
                        ↓ ダウンロード
                    </button>
                </div>

                <div class="flex flex-col items-center space-y-2">
                    <h2 class="text-lg font-semibold">3. 最終出力 (AI変換)</h2>
                    <img id="aiImg" class="max-w-full h-auto rounded-lg border shadow-sm">
                    
                    <div class="w-full mt-2">
                        <label for="aiPrompt" class="block text-sm font-medium text-gray-700">AIへの追加指示 (任意)</label>
                        <textarea id="aiPrompt" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" placeholder="例: もっと線を太くして、背景を完全に白にして"></textarea>
                    </div>

                    <div class="flex flex-col gap-2 w-full max-w-[200px] mt-2">
                        <button id="downloadAiBtn" class="px-4 py-2 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-700 transition-colors shadow-sm">
                            ↓ ダウンロード
                        </button>
                        <!-- リトライボタン：現在の出力画像に対して変更を加える -->
                        <button id="retryAiBtn" class="px-4 py-2 bg-gray-800 text-white text-sm font-medium rounded-lg hover:bg-black transition-colors shadow-sm flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            現在の画像を変更
                        </button>
                    </div>
                </div>
            </div>
            <div class="text-center">
                <button id="resetBtn" class="text-sm text-gray-500 hover:text-gray-800 underline">別の画像をアップロードする</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const results = document.getElementById('results');
        const origImg = document.getElementById('origImg');
        const aiImg = document.getElementById('aiImg');
        const ditherCanvas = document.getElementById('ditherCanvas');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const retryErrorBtn = document.getElementById('retryErrorBtn');
        const downloadDitherBtn = document.getElementById('downloadDitherBtn');
        const downloadAiBtn = document.getElementById('downloadAiBtn');
        const retryAiBtn = document.getElementById('retryAiBtn');
        const resetBtn = document.getElementById('resetBtn');
        const aiPrompt = document.getElementById('aiPrompt');

        let currentFile = null;

        // ダウンロード機能の処理
        downloadDitherBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `dithered_${Date.now()}.png`;
            link.href = ditherCanvas.toDataURL('image/png');
            link.click();
        });

        downloadAiBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `ai_engraving_${Date.now()}.png`;
            link.href = aiImg.src;
            link.click();
        });

        // --- リトライ・リセット機能の処理 ---
        
        // 「現在の画像を変更」ボタンが押された時の処理
        // 直前の出力画像をベースに、コメントの内容を反映させて再生成します。
        retryAiBtn.addEventListener('click', () => runAiProcess(true));

        // APIエラーなどが発生した際、同じファイルで最初からやり直す処理
        retryErrorBtn.addEventListener('click', () => currentFile ? handleFiles([currentFile]) : location.reload());

        // アプリケーションを初期状態に戻し、新しい画像をアップロードできるようにする
        resetBtn.addEventListener('click', () => {
            results.classList.add('hidden');
            dropzone.classList.remove('hidden');
            currentFile = null;
        });

        // ドラッグ＆ドロップイベントの設定
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => dropzone.addEventListener(e, preventDefaults, false));
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        ['dragenter', 'dragover'].forEach(e => dropzone.addEventListener(e, () => dropzone.classList.add('drag-active'), false));
        ['dragleave', 'drop'].forEach(e => dropzone.addEventListener(e, () => dropzone.classList.remove('drag-active'), false));

        dropzone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files), false);
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        /**
         * 画像ファイルの読み込みとメイン処理の開始
         */
        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            if (!file.type.startsWith('image/')) {
                showError("画像ファイルを選択してください。");
                return;
            }
            currentFile = file;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Str = reader.result;
                origImg.src = base64Str;
                hideError();
                dropzone.classList.add('hidden');
                results.classList.add('hidden');
                loading.classList.remove('hidden');

                try {
                    // Step 1: クライアントサイドでのディザリング処理
                    loadingText.innerText = "ディザリング処理中...";
                    const img = new Image();
                    img.src = base64Str;
                    await new Promise(r => img.onload = r);

                    applyDithering(img, ditherCanvas);

                    // Step 2: ディザリング後の画像をAIに送るメインプロセス
                    await runAiProcess(false);

                } catch (err) {
                    loading.classList.add('hidden');
                    showError(err.message);
                }
            };
        }

        /**
         * AI処理を実行する関数
         * リトライ時には現在の出力画像をベースにします。
         */
        async function runAiProcess(isRetry = false) {
            loading.classList.remove('hidden');
            results.classList.add('hidden');
            loadingText.innerText = isRetry ? "AIで画像を変更中..." : "AIで画像を最適化中...";
            
            try {
                // 初回はディザリング画像、リトライ時は現在の出力画像をベースにする
                const sourceBase64 = (isRetry && aiImg.src) ? aiImg.src : ditherCanvas.toDataURL('image/png');
                
                // AI APIを呼び出し（Image-to-Image）
                const aiProcessedBase64 = await processWithAI(sourceBase64, isRetry);
                aiImg.src = aiProcessedBase64;
                
                loading.classList.add('hidden');
                results.classList.remove('hidden');
            } catch (err) {
                loading.classList.add('hidden');
                showError(err.message);
                if (isRetry) results.classList.remove('hidden'); // リトライエラー時は結果画面に戻す
            }
        }

        /**
         * Gemini API を使用した Image-to-Image 変換
         */
        async function processWithAI(base64Image, isRetry) {
            const b64Data = base64Image.split(',')[1];
            const mimeType = base64Image.split(';')[0].split(':')[1];

            const userText = aiPrompt.value.trim();
            const baseStylePrompt = "Maintain a clean, high-contrast woodcut or laser engraving style illustration. Ensure white areas and background remain purely white without any artifacts, and black details are sharp for engraving.";
            
            let prompt = "";
            if (!isRetry) {
                // 初回生成時のシステムプロンプト
                prompt = "Enhance this dithered monochrome image into a clean, high-contrast woodcut or laser engraving style illustration. Ensure that white areas and background remain purely white without any artifacts, and black details are sharp and clear for engraving.";
            } else {
                // リトライ時のプロンプト（ユーザーの指示を適用）
                if (userText) {
                    prompt = `Modify the image according to this instruction: "${userText}". ${baseStylePrompt}`;
                } else {
                    prompt = `Generate a different variation of this image. ${baseStylePrompt}`;
                }
            }

            const payload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: mimeType, data: b64Data } }
                    ]
                }],
                generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
            };

            const url = `/api/ai`;
            const delays = [1000, 2000, 4000, 8000, 16000];
            let lastError;

            // 指数バックオフによるリトライ処理（APIエラー対策）
            for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    const data = await response.json();

                    const imgPart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                    if (imgPart) {
                        return `data:${imgPart.inlineData.mimeType};base64,${imgPart.inlineData.data}`;
                    } else {
                        throw new Error("AIが画像を生成できませんでした。別の結果を試してください。");
                    }
                } catch (error) {
                    lastError = error;
                    if (attempt < delays.length) await new Promise(r => setTimeout(r, delays[attempt]));
                }
            }
            throw new Error("通信エラーが発生しました: " + lastError.message);
        }

        /**
         * フロイド-スタインバーグ法によるディザリング
         */
        function applyDithering(img, canvas) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const width = canvas.width;
            const height = canvas.height;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    // 輝度計算
                    const gray = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
                    // 2値化（白か黒か）
                    const newVal = gray < 128 ? 0 : 255;
                    
                    data[idx] = data[idx+1] = data[idx+2] = newVal;
                    const err = gray - newVal;

                    // 誤差拡散（周囲のピクセルに誤差を配分して階調を表現）
                    if (x + 1 < width) addError(data, idx + 4, err * 7 / 16);
                    if (y + 1 < height) {
                        if (x - 1 >= 0) addError(data, idx + width * 4 - 4, err * 3 / 16);
                        addError(data, idx + width * 4, err * 5 / 16);
                        if (x + 1 < width) addError(data, idx + width * 4 + 4, err * 1 / 16);
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function addError(data, idx, err) {
            data[idx] = Math.min(255, Math.max(0, data[idx] + err));
            data[idx+1] = Math.min(255, Math.max(0, data[idx+1] + err));
            data[idx+2] = Math.min(255, Math.max(0, data[idx+2] + err));
        }

        function showError(msg) {
            errorMessage.classList.remove('hidden');
            errorText.innerText = msg;
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
