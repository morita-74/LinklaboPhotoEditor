                const { Upload, Download, Wand2, Image, Sparkles, RefreshCw, X, Palette, Zap, AlertTriangle, CheckCircle, Info, XCircle, Settings, Printer, BarChart, Layers, PaintBucket, Eraser, Maximize, ZoomIn, ZoomOut, Scan, Flame, ChevronRight, ChevronLeft, Languages, Copy, Check, Type, Volume2, Mic, Send, Trash2, Plus, Minus, HelpCircle, ShieldCheck, Lock, Eye, History, Share2, ShoppingCart, Heart, Star, User, Mail, Phone, MapPin, Calendar, Clock, Tag, Search, Filter, SortAsc, SortDesc, MoreHorizontal, MoreVertical, Grid, List, ExternalLink, Ghost, Scissors, Briefcase, Coins, MessageSquare, Edit3, FileText, EyeOff, Moon, Sun, Menu, Smartphone, Instagram, Facebook, Twitter, Chrome, CreditCard, PlusCircle, MinusCircle, Layout, Box, Brush, Gem, Coffee, Code, Music, Video, Play, Pause, Link } = Lucide;

        // Replace direct Lucide imports in the original code
        // 
const KidsArtScanner = () => {
  const [step, setStep] = useState('upload'); // upload, edit, preview
  const [originalImage, setOriginalImage] = useState(null);
  const [processedImage, setProcessedImage] = useState(null); // Preview image data (DataURL)
  const [previewOriginalImageData, setPreviewOriginalImageData] = useState(null); // Raw ImageData for filter
  const [threshold, setThreshold] = useState(128);
  const [removeShadows, setRemoveShadows] = useState(true);
  const [lineColor, setLineColor] = useState('#000000');
  const [tool, setTool] = useState('move'); // move, eraser, crop
  const [eraserSize, setEraserSize] = useState(20);
  const [history, setHistory] = useState([]);
  const [isDragOver, setIsDragOver] = useState(false);
  const [noiseLevel, setNoiseLevel] = useState(0); // Noise reduction level (0-5)
  const [cropSelection, setCropSelection] = useState(null); // {x, y, width, height}
  
  // Edit Canvas Refs & States
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const [isDragging, setIsDragging] = useState(false);
  const [lastPosition, setLastPosition] = useState({ x: 0, y: 0 });
  const [cropStart, setCropStart] = useState(null);

  // Preview Canvas Refs & States
  const previewCanvasRef = useRef(null);
  const previewContainerRef = useRef(null);
  const [previewScale, setPreviewScale] = useState(1);
  const [previewOffset, setPreviewOffset] = useState({ x: 0, y: 0 });
  const [previewTool, setPreviewTool] = useState('move'); // 'move', 'eraser'
  const [previewEraserSize, setPreviewEraserSize] = useState(10);
  const [previewIsDragging, setPreviewIsDragging] = useState(false);
  const [previewLastPosition, setPreviewLastPosition] = useState({ x: 0, y: 0 });


  // Restore canvas content when returning to edit mode
  useEffect(() => {
    if (step === 'edit' && canvasRef.current && history.length > 0) {
      const lastState = history[history.length - 1];
      const img = new Image();
      img.onload = () => {
        const ctx = canvasRef.current.getContext('2d');
        ctx.clearRect(0, 0, canvasSize.width, canvasSize.height);
        ctx.drawImage(img, 0, 0);
      };
      img.src = lastState;
    }
  }, [step, canvasSize.width, canvasSize.height]);

  // Preview Canvas Initialization & Sync
  useEffect(() => {
    if (step === 'preview' && processedImage && previewCanvasRef.current) {
        const canvas = previewCanvasRef.current;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
            // Update canvas size to match image
            if (canvas.width !== img.width || canvas.height !== img.height) {
                canvas.width = img.width;
                canvas.height = img.height;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            // Initial fit to screen logic
            if (previewContainerRef.current && previewScale === 1 && previewOffset.x === 0 && previewOffset.y === 0) {
                 const containerW = previewContainerRef.current.clientWidth;
                 const containerH = previewContainerRef.current.clientHeight;
                 const ratio = Math.min(containerW / img.width, containerH / img.height) * 0.9;
                 const validRatio = (ratio > 0 && ratio < Infinity) ? ratio : 0.5;
                 
                 setPreviewScale(validRatio);
                 setPreviewOffset({
                     x: (containerW - img.width * validRatio) / 2,
                     y: (containerH - img.height * validRatio) / 2
                 });
            }
        };
        img.src = processedImage;
    }
  }, [step, processedImage]);

  // Enhanced saveHistory function
  const saveHistory = (reset = false) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dataUrl = canvas.toDataURL();
    
    setHistory(prev => {
        if (reset) return [dataUrl];
        if (prev.length > 0 && prev[prev.length - 1] === dataUrl) {
            return prev;
        }
        const newHistory = [...prev, dataUrl];
        if (newHistory.length > 10) return newHistory.slice(newHistory.length - 10);
        return newHistory;
    });
  };

  const processFile = (file) => {
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDimension = 1200;
          let width = img.width;
          let height = img.height;

          if (width > maxDimension || height > maxDimension) {
            const ratio = Math.min(maxDimension / width, maxDimension / height);
            width *= ratio;
            height *= ratio;
          }

          setCanvasSize({ width, height });
          setOriginalImage(img);
          setHistory([]); // Clear history initially
          setStep('edit');
          setRemoveShadows(true);
          setNoiseLevel(0);
          setCropSelection(null);
          setTool('move');
          
          setTimeout(() => {
            centerCanvas(width, height);
            applyThreshold(img, width, height, 128, '#000000', true);
            saveHistory(true); // Initialize history with the first state
          }, 100);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  };

  const handleImageUpload = (event) => {
    const file = event.target.files[0];
    processFile(file);
  };

  const handleDragOver = (e) => {
    e.preventDefault();
    setIsDragOver(true);
  };

  const handleDragLeave = (e) => {
    e.preventDefault();
    setIsDragOver(false);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragOver(false);
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      processFile(file);
    }
  };

  const centerCanvas = (imgWidth, imgHeight) => {
    if (containerRef.current) {
      const containerW = containerRef.current.clientWidth;
      const containerH = containerRef.current.clientHeight;
      const initialScale = Math.min(containerW / imgWidth, containerH / imgHeight) * 0.9;
      setScale(initialScale);
      setOffset({
        x: (containerW - imgWidth * initialScale) / 2,
        y: (containerH - imgHeight * initialScale) / 2
      });
    }
  };

  const applyThreshold = (img, width, height, thresh, color, shouldRemoveShadows) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(img, 0, 0, width, height);
    
    const srcImageData = tempCtx.getImageData(0, 0, width, height);
    const srcData = srcImageData.data;

    let bgData = null;
    if (shouldRemoveShadows) {
        const blurCanvas = document.createElement('canvas');
        const blurFactor = 30; 
        blurCanvas.width = Math.max(1, width / blurFactor);
        blurCanvas.height = Math.max(1, height / blurFactor);
        const blurCtx = blurCanvas.getContext('2d');
        blurCtx.imageSmoothingEnabled = true;
        blurCtx.imageSmoothingQuality = 'medium';
        blurCtx.drawImage(img, 0, 0, blurCanvas.width, blurCanvas.height);

        const upCanvas = document.createElement('canvas');
        upCanvas.width = width;
        upCanvas.height = height;
        const upCtx = upCanvas.getContext('2d');
        upCtx.imageSmoothingEnabled = true;
        upCtx.imageSmoothingQuality = 'medium';
        upCtx.drawImage(blurCanvas, 0, 0, width, height);
        
        bgData = upCtx.getImageData(0, 0, width, height).data;
    }

    const outputImageData = ctx.createImageData(width, height);
    const data = outputImageData.data;

    const rLine = parseInt(color.slice(1, 3), 16);
    const gLine = parseInt(color.slice(3, 5), 16);
    const bLine = parseInt(color.slice(5, 7), 16);

    for (let i = 0; i < srcData.length; i += 4) {
      let brightness;

      if (shouldRemoveShadows && bgData) {
        const srcL = 0.299 * srcData[i] + 0.587 * srcData[i + 1] + 0.114 * srcData[i + 2];
        const bgL = 0.299 * bgData[i] + 0.587 * bgData[i + 1] + 0.114 * bgData[i + 2];
        const div = bgL < 1 ? 1 : bgL;
        brightness = (srcL / div) * 255;
      } else {
        brightness = 0.299 * srcData[i] + 0.587 * srcData[i + 1] + 0.114 * srcData[i + 2];
      }
      
      if (brightness < thresh) {
        data[i] = rLine;
        data[i + 1] = gLine;
        data[i + 2] = bLine;
        const alphaFactor = 1 - (brightness / thresh); 
        data[i + 3] = 255 * Math.min(1, alphaFactor + 0.5); 
      } else {
        data[i + 3] = 0; 
      }
    }

    ctx.putImageData(outputImageData, 0, 0);
  };

  const handleUndo = () => {
    if (history.length <= 1) return;
    const newHistory = [...history];
    newHistory.pop(); // Remove current state
    const prevState = newHistory[newHistory.length - 1]; // Get previous state
    setHistory(newHistory);
    
    const img = new Image();
    img.onload = () => {
        const ctx = canvasRef.current.getContext('2d');
        ctx.clearRect(0, 0, canvasSize.width, canvasSize.height);
        ctx.drawImage(img, 0, 0);
    };
    img.src = prevState;
  };

  const handleThresholdChange = (e) => {
    const val = parseInt(e.target.value);
    setThreshold(val);
    if (originalImage) {
      applyThreshold(originalImage, canvasSize.width, canvasSize.height, val, lineColor, removeShadows);
      saveHistory(true); 
    }
  };

  const handleShadowToggle = (e) => {
      const isChecked = e.target.checked;
      setRemoveShadows(isChecked);
      if (originalImage) {
          applyThreshold(originalImage, canvasSize.width, canvasSize.height, threshold, lineColor, isChecked);
          saveHistory(true);
      }
  };

  const handleColorChange = (color) => {
    setLineColor(color);
    if (originalImage) {
        replaceColorOnly(color);
        saveHistory(); 
    }
  };

  const replaceColorOnly = (color) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    
    const rLine = parseInt(color.slice(1, 3), 16);
    const gLine = parseInt(color.slice(3, 5), 16);
    const bLine = parseInt(color.slice(5, 7), 16);

    for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3] > 0) {
            data[i] = rLine;
            data[i+1] = gLine;
            data[i+2] = bLine;
        }
    }
    ctx.putImageData(imageData, 0, 0);
  };

  // --- Edit Canvas Interaction ---

  const getCanvasCoordinates = (e) => {
    const rect = containerRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const xInContainer = clientX - rect.left;
    const yInContainer = clientY - rect.top;

    return {
      x: (xInContainer - offset.x) / scale,
      y: (yInContainer - offset.y) / scale
    };
  };

  const handlePointerDown = (e) => {
    e.preventDefault();
    const coords = getCanvasCoordinates(e);
    setIsDragging(true);
    setLastPosition(coords);

    if (tool === 'eraser') {
       erase(coords.x, coords.y);
    } else if (tool === 'crop') {
        setCropStart(coords);
        setCropSelection({ x: coords.x, y: coords.y, width: 0, height: 0 });
    }
  };

  const handlePointerMove = (e) => {
    if (!isDragging) return;
    e.preventDefault();

    const coords = getCanvasCoordinates(e);

    if (tool === 'move') {
        const dx = (e.movementX || 0); 
        const dy = (e.movementY || 0);
        setOffset(prev => ({ x: prev.x + dx, y: prev.y + dy }));

    } else if (tool === 'eraser') {
        const dist = Math.sqrt(Math.pow(coords.x - lastPosition.x, 2) + Math.pow(coords.y - lastPosition.y, 2));
        const angle = Math.atan2(coords.y - lastPosition.y, coords.x - lastPosition.x);
        
        for (let i = 0; i < dist; i+=2) {
            const ix = lastPosition.x + Math.cos(angle) * i;
            const iy = lastPosition.y + Math.sin(angle) * i;
            erase(ix, iy);
        }
        erase(coords.x, coords.y);
        setLastPosition(coords);
    } else if (tool === 'crop' && cropStart) {
        const width = coords.x - cropStart.x;
        const height = coords.y - cropStart.y;
        setCropSelection({
            x: cropStart.x,
            y: cropStart.y,
            width,
            height
        });
    }
  };

  const handlePointerUp = () => {
    setIsDragging(false);
    if (tool === 'eraser') {
        saveHistory();
    }
    if (tool === 'crop') {
        setCropStart(null);
    }
  };

  const erase = (x, y) => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, eraserSize / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  };

  // --- Preview Canvas Interaction (Zoom/Pan/Erase) ---

  const getPreviewCanvasCoordinates = (e) => {
    const rect = previewContainerRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const xInContainer = clientX - rect.left;
    const yInContainer = clientY - rect.top;

    return {
      x: (xInContainer - previewOffset.x) / previewScale,
      y: (yInContainer - previewOffset.y) / previewScale
    };
  };

  const handlePreviewPointerDown = (e) => {
    if (e.target.tagName === 'CANVAS') {
        e.preventDefault();
    }
    
    setPreviewIsDragging(true);
    const coords = getPreviewCanvasCoordinates(e);
    setPreviewLastPosition(coords);

    if (previewTool === 'eraser') {
        erasePreview(coords.x, coords.y);
    }
  };

  const handlePreviewPointerMove = (e) => {
    if (!previewIsDragging) return;
    if (e.target.tagName === 'CANVAS') e.preventDefault();

    const coords = getPreviewCanvasCoordinates(e);

    if (previewTool === 'move') {
        const dx = (e.movementX || 0); 
        const dy = (e.movementY || 0);
        setPreviewOffset(prev => ({ x: prev.x + dx, y: prev.y + dy }));

    } else if (previewTool === 'eraser') {
        const dist = Math.sqrt(Math.pow(coords.x - previewLastPosition.x, 2) + Math.pow(coords.y - previewLastPosition.y, 2));
        const angle = Math.atan2(coords.y - previewLastPosition.y, coords.x - previewLastPosition.x);
        
        for (let i = 0; i < dist; i+=2) {
            const ix = previewLastPosition.x + Math.cos(angle) * i;
            const iy = previewLastPosition.y + Math.sin(angle) * i;
            erasePreview(ix, iy);
        }
        erasePreview(coords.x, coords.y);
        setPreviewLastPosition(coords);
    }
  };

  const handlePreviewPointerUp = () => {
    setPreviewIsDragging(false);
    if (previewTool === 'eraser' && previewCanvasRef.current) {
        setProcessedImage(previewCanvasRef.current.toDataURL());
    }
  };

  const erasePreview = (x, y) => {
    const canvas = previewCanvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, previewEraserSize / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  };

  const handleZoomIn = () => {
      setPreviewScale(prev => Math.min(prev * 1.2, 5));
  };

  const handleZoomOut = () => {
      setPreviewScale(prev => Math.max(prev / 1.2, 0.1));
  };


  // --- Crop Logic ---
  
  const performCrop = () => {
    if (!cropSelection || !originalImage) return;

    let { x, y, width, height } = cropSelection;
    if (width < 0) { x += width; width = Math.abs(width); }
    if (height < 0) { y += height; height = Math.abs(height); }

    if (width < 10 || height < 10) return;

    const scaleX = originalImage.width / canvasSize.width;
    const scaleY = originalImage.height / canvasSize.height;

    const sourceX = x * scaleX;
    const sourceY = y * scaleY;
    const sourceW = width * scaleX;
    const sourceH = height * scaleY;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    
    tempCtx.drawImage(originalImage, sourceX, sourceY, sourceW, sourceH, 0, 0, width, height);
    
    const newOriginalImage = new Image();
    newOriginalImage.onload = () => {
        setOriginalImage(newOriginalImage);
        setCanvasSize({ width, height });
        setCropSelection(null);
        setTool('move');
        
        setTimeout(() => {
            centerCanvas(width, height);
            applyThreshold(newOriginalImage, width, height, threshold, lineColor, removeShadows);
            saveHistory(true); 
        }, 50);
    };
    newOriginalImage.src = tempCanvas.toDataURL();
  };

  const cancelCrop = () => {
    setCropSelection(null);
    setTool('move');
  };

  // --- Noise Reduction Logic ---

  const applyNoiseFilter = useCallback((level) => {
    if (!previewOriginalImageData) return;

    const canvas = document.createElement('canvas');
    canvas.width = canvasSize.width;
    canvas.height = canvasSize.height;
    const ctx = canvas.getContext('2d');

    if (level === 0) {
        ctx.putImageData(previewOriginalImageData, 0, 0);
        setProcessedImage(canvas.toDataURL());
        return;
    }

    const width = canvasSize.width;
    const height = canvasSize.height;
    const inputData = previewOriginalImageData.data;
    const outputData = new Uint8ClampedArray(inputData);

    const neighborThreshold = level; 

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const idx = (y * width + x) * 4;
            if (inputData[idx + 3] === 0) continue; 

            let neighbors = 0;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        const nIdx = (ny * width + nx) * 4;
                        if (inputData[nIdx + 3] > 0) neighbors++;
                    }
                }
            }
            if (neighbors < neighborThreshold) {
                outputData[idx + 3] = 0; 
            }
        }
    }

    const newImageData = new ImageData(outputData, width, height);
    ctx.putImageData(newImageData, 0, 0);
    setProcessedImage(canvas.toDataURL());

  }, [previewOriginalImageData, canvasSize]);

  const handleNoiseLevelChange = (e) => {
    const val = parseInt(e.target.value);
    setNoiseLevel(val);
    applyNoiseFilter(val);
  };

  const handleToPreview = () => {

            const newHistory = [...prev, dataUrl];
            if (newHistory.length > 5) return newHistory.slice(newHistory.length - 5);
            return newHistory;
        });
        setStep('preview');
    }
  };

  return (
    <div className="w-full h-screen font-sans bg-gray-50 overflow-hidden select-none">
      {step === 'upload' && renderUpload()}
      {step === 'edit' && renderEdit()}

    </div>
  );
};

        const Grid = Lucide.Grid;
        const List = Lucide.List;
        const ExternalLink = Lucide.ExternalLink;
        const Ghost = Lucide.Ghost;
        const Scissors = Lucide.Scissors;
        const Briefcase = Lucide.Briefcase;
        const Coins = Lucide.Coins;
        const MessageSquare = Lucide.MessageSquare;
        const Edit3 = Lucide.Edit3;
        const FileText = Lucide.FileText;
        const EyeOff = Lucide.EyeOff;
        const Moon = Lucide.Moon;
        const Sun = Lucide.Sun;
        const Menu = Lucide.Menu;
        const Smartphone = Lucide.Smartphone;
        const Instagram = Lucide.Instagram;
        const Facebook = Lucide.Facebook;
        const Twitter = Lucide.Twitter;
        const Chrome = Lucide.Chrome;
        const CreditCard = Lucide.CreditCard;
        const PlusCircle = Lucide.PlusCircle;
        const MinusCircle = Lucide.MinusCircle;
        const Layout = Lucide.Layout;
        const Box = Lucide.Box;
        const Brush = Lucide.Brush;
        const Gem = Lucide.Gem;
        const Coffee = Lucide.Coffee;
        const Code = Lucide.Code;
        const Music = Lucide.Music;
        const Video = Lucide.Video;
        const Play = Lucide.Play;
        const Pause = Lucide.Pause;
        const Link = Lucide.Link;

        
const KidsArtScanner = () => {
  const [step, setStep] = useState('upload'); // upload, edit, preview
  const [originalImage, setOriginalImage] = useState(null);
  const [processedImage, setProcessedImage] = useState(null); // Preview image data (DataURL)
  const [previewOriginalImageData, setPreviewOriginalImageData] = useState(null); // Raw ImageData for filter
  const [threshold, setThreshold] = useState(128);
  const [removeShadows, setRemoveShadows] = useState(true);
  const [lineColor, setLineColor] = useState('#000000');
  const [tool, setTool] = useState('move'); // move, eraser, crop
  const [eraserSize, setEraserSize] = useState(20);
  const [history, setHistory] = useState([]);
  const [isDragOver, setIsDragOver] = useState(false);
  const [noiseLevel, setNoiseLevel] = useState(0); // Noise reduction level (0-5)
  const [cropSelection, setCropSelection] = useState(null); // {x, y, width, height}
  
  // Edit Canvas Refs & States
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const [isDragging, setIsDragging] = useState(false);
  const [lastPosition, setLastPosition] = useState({ x: 0, y: 0 });
  const [cropStart, setCropStart] = useState(null);

  // Preview Canvas Refs & States
  const previewCanvasRef = useRef(null);
  const previewContainerRef = useRef(null);
  const [previewScale, setPreviewScale] = useState(1);
  const [previewOffset, setPreviewOffset] = useState({ x: 0, y: 0 });
  const [previewTool, setPreviewTool] = useState('move'); // 'move', 'eraser'
  const [previewEraserSize, setPreviewEraserSize] = useState(10);
  const [previewIsDragging, setPreviewIsDragging] = useState(false);
  const [previewLastPosition, setPreviewLastPosition] = useState({ x: 0, y: 0 });


  // Restore canvas content when returning to edit mode
  useEffect(() => {
    if (step === 'edit' && canvasRef.current && history.length > 0) {
      const lastState = history[history.length - 1];
      const img = new Image();
      img.onload = () => {
        const ctx = canvasRef.current.getContext('2d');
        ctx.clearRect(0, 0, canvasSize.width, canvasSize.height);
        ctx.drawImage(img, 0, 0);
      };
      img.src = lastState;
    }
  }, [step, canvasSize.width, canvasSize.height]);

  // Preview Canvas Initialization & Sync
  useEffect(() => {
    if (step === 'preview' && processedImage && previewCanvasRef.current) {
        const canvas = previewCanvasRef.current;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
            // Update canvas size to match image
            if (canvas.width !== img.width || canvas.height !== img.height) {
                canvas.width = img.width;
                canvas.height = img.height;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            // Initial fit to screen logic
            if (previewContainerRef.current && previewScale === 1 && previewOffset.x === 0 && previewOffset.y === 0) {
                 const containerW = previewContainerRef.current.clientWidth;
                 const containerH = previewContainerRef.current.clientHeight;
                 const ratio = Math.min(containerW / img.width, containerH / img.height) * 0.9;
                 const validRatio = (ratio > 0 && ratio < Infinity) ? ratio : 0.5;
                 
                 setPreviewScale(validRatio);
                 setPreviewOffset({
                     x: (containerW - img.width * validRatio) / 2,
                     y: (containerH - img.height * validRatio) / 2
                 });
            }
        };
        img.src = processedImage;
    }
  }, [step, processedImage]);

  // Enhanced saveHistory function
  const saveHistory = (reset = false) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dataUrl = canvas.toDataURL();
    
    setHistory(prev => {
        if (reset) return [dataUrl];
        if (prev.length > 0 && prev[prev.length - 1] === dataUrl) {
            return prev;
        }
        const newHistory = [...prev, dataUrl];
        if (newHistory.length > 10) return newHistory.slice(newHistory.length - 10);
        return newHistory;
    });
  };

  const processFile = (file) => {
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDimension = 1200;
          let width = img.width;
          let height = img.height;

          if (width > maxDimension || height > maxDimension) {
            const ratio = Math.min(maxDimension / width, maxDimension / height);
            width *= ratio;
            height *= ratio;
          }

          setCanvasSize({ width, height });
          setOriginalImage(img);
          setHistory([]); // Clear history initially
          setStep('edit');
          setRemoveShadows(true);
          setNoiseLevel(0);
          setCropSelection(null);
          setTool('move');
          
          setTimeout(() => {
            centerCanvas(width, height);
            applyThreshold(img, width, height, 128, '#000000', true);
            saveHistory(true); // Initialize history with the first state
          }, 100);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  };

  const handleImageUpload = (event) => {
    const file = event.target.files[0];
    processFile(file);
  };

  const handleDragOver = (e) => {
    e.preventDefault();
    setIsDragOver(true);
  };

  const handleDragLeave = (e) => {
    e.preventDefault();
    setIsDragOver(false);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragOver(false);
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      processFile(file);
    }
  };

  const centerCanvas = (imgWidth, imgHeight) => {
    if (containerRef.current) {
      const containerW = containerRef.current.clientWidth;
      const containerH = containerRef.current.clientHeight;
      const initialScale = Math.min(containerW / imgWidth, containerH / imgHeight) * 0.9;
      setScale(initialScale);
      setOffset({
        x: (containerW - imgWidth * initialScale) / 2,
        y: (containerH - imgHeight * initialScale) / 2
      });
    }
  };

  const applyThreshold = (img, width, height, thresh, color, shouldRemoveShadows) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(img, 0, 0, width, height);
    
    const srcImageData = tempCtx.getImageData(0, 0, width, height);
    const srcData = srcImageData.data;

    let bgData = null;
    if (shouldRemoveShadows) {
        const blurCanvas = document.createElement('canvas');
        const blurFactor = 30; 
        blurCanvas.width = Math.max(1, width / blurFactor);
        blurCanvas.height = Math.max(1, height / blurFactor);
        const blurCtx = blurCanvas.getContext('2d');
        blurCtx.imageSmoothingEnabled = true;
        blurCtx.imageSmoothingQuality = 'medium';
        blurCtx.drawImage(img, 0, 0, blurCanvas.width, blurCanvas.height);

        const upCanvas = document.createElement('canvas');
        upCanvas.width = width;
        upCanvas.height = height;
        const upCtx = upCanvas.getContext('2d');
        upCtx.imageSmoothingEnabled = true;
        upCtx.imageSmoothingQuality = 'medium';
        upCtx.drawImage(blurCanvas, 0, 0, width, height);
        
        bgData = upCtx.getImageData(0, 0, width, height).data;
    }

    const outputImageData = ctx.createImageData(width, height);
    const data = outputImageData.data;

    const rLine = parseInt(color.slice(1, 3), 16);
    const gLine = parseInt(color.slice(3, 5), 16);
    const bLine = parseInt(color.slice(5, 7), 16);

    for (let i = 0; i < srcData.length; i += 4) {
      let brightness;

      if (shouldRemoveShadows && bgData) {
        const srcL = 0.299 * srcData[i] + 0.587 * srcData[i + 1] + 0.114 * srcData[i + 2];
        const bgL = 0.299 * bgData[i] + 0.587 * bgData[i + 1] + 0.114 * bgData[i + 2];
        const div = bgL < 1 ? 1 : bgL;
        brightness = (srcL / div) * 255;
      } else {
        brightness = 0.299 * srcData[i] + 0.587 * srcData[i + 1] + 0.114 * srcData[i + 2];
      }
      
      if (brightness < thresh) {
        data[i] = rLine;
        data[i + 1] = gLine;
        data[i + 2] = bLine;
        const alphaFactor = 1 - (brightness / thresh); 
        data[i + 3] = 255 * Math.min(1, alphaFactor + 0.5); 
      } else {
        data[i + 3] = 0; 
      }
    }

    ctx.putImageData(outputImageData, 0, 0);
  };

  const handleUndo = () => {
    if (history.length <= 1) return;
    const newHistory = [...history];
    newHistory.pop(); // Remove current state
    const prevState = newHistory[newHistory.length - 1]; // Get previous state
    setHistory(newHistory);
    
    const img = new Image();
    img.onload = () => {
        const ctx = canvasRef.current.getContext('2d');
        ctx.clearRect(0, 0, canvasSize.width, canvasSize.height);
        ctx.drawImage(img, 0, 0);
    };
    img.src = prevState;
  };

  const handleThresholdChange = (e) => {
    const val = parseInt(e.target.value);
    setThreshold(val);
    if (originalImage) {
      applyThreshold(originalImage, canvasSize.width, canvasSize.height, val, lineColor, removeShadows);
      saveHistory(true); 
    }
  };

  const handleShadowToggle = (e) => {
      const isChecked = e.target.checked;
      setRemoveShadows(isChecked);
      if (originalImage) {
          applyThreshold(originalImage, canvasSize.width, canvasSize.height, threshold, lineColor, isChecked);
          saveHistory(true);
      }
  };

  const handleColorChange = (color) => {
    setLineColor(color);
    if (originalImage) {
        replaceColorOnly(color);
        saveHistory(); 
    }
  };

  const replaceColorOnly = (color) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    
    const rLine = parseInt(color.slice(1, 3), 16);
    const gLine = parseInt(color.slice(3, 5), 16);
    const bLine = parseInt(color.slice(5, 7), 16);

    for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3] > 0) {
            data[i] = rLine;
            data[i+1] = gLine;
            data[i+2] = bLine;
        }
    }
    ctx.putImageData(imageData, 0, 0);
  };

  // --- Edit Canvas Interaction ---

  const getCanvasCoordinates = (e) => {
    const rect = containerRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const xInContainer = clientX - rect.left;
    const yInContainer = clientY - rect.top;

    return {
      x: (xInContainer - offset.x) / scale,
      y: (yInContainer - offset.y) / scale
    };
  };

  const handlePointerDown = (e) => {
    e.preventDefault();
    const coords = getCanvasCoordinates(e);
    setIsDragging(true);
    setLastPosition(coords);

    if (tool === 'eraser') {
       erase(coords.x, coords.y);
    } else if (tool === 'crop') {
        setCropStart(coords);
        setCropSelection({ x: coords.x, y: coords.y, width: 0, height: 0 });
    }
  };

  const handlePointerMove = (e) => {
    if (!isDragging) return;
    e.preventDefault();

    const coords = getCanvasCoordinates(e);

    if (tool === 'move') {
        const dx = (e.movementX || 0); 
        const dy = (e.movementY || 0);
        setOffset(prev => ({ x: prev.x + dx, y: prev.y + dy }));

    } else if (tool === 'eraser') {
        const dist = Math.sqrt(Math.pow(coords.x - lastPosition.x, 2) + Math.pow(coords.y - lastPosition.y, 2));
        const angle = Math.atan2(coords.y - lastPosition.y, coords.x - lastPosition.x);
        
        for (let i = 0; i < dist; i+=2) {
            const ix = lastPosition.x + Math.cos(angle) * i;
            const iy = lastPosition.y + Math.sin(angle) * i;
            erase(ix, iy);
        }
        erase(coords.x, coords.y);
        setLastPosition(coords);
    } else if (tool === 'crop' && cropStart) {
        const width = coords.x - cropStart.x;
        const height = coords.y - cropStart.y;
        setCropSelection({
            x: cropStart.x,
            y: cropStart.y,
            width,
            height
        });
    }
  };

  const handlePointerUp = () => {
    setIsDragging(false);
    if (tool === 'eraser') {
        saveHistory();
    }
    if (tool === 'crop') {
        setCropStart(null);
    }
  };

  const erase = (x, y) => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, eraserSize / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  };

  // --- Preview Canvas Interaction (Zoom/Pan/Erase) ---

  const getPreviewCanvasCoordinates = (e) => {
    const rect = previewContainerRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const xInContainer = clientX - rect.left;
    const yInContainer = clientY - rect.top;

    return {
      x: (xInContainer - previewOffset.x) / previewScale,
      y: (yInContainer - previewOffset.y) / previewScale
    };
  };

  const handlePreviewPointerDown = (e) => {
    if (e.target.tagName === 'CANVAS') {
        e.preventDefault();
    }
    
    setPreviewIsDragging(true);
    const coords = getPreviewCanvasCoordinates(e);
    setPreviewLastPosition(coords);

    if (previewTool === 'eraser') {
        erasePreview(coords.x, coords.y);
    }
  };

  const handlePreviewPointerMove = (e) => {
    if (!previewIsDragging) return;
    if (e.target.tagName === 'CANVAS') e.preventDefault();

    const coords = getPreviewCanvasCoordinates(e);

    if (previewTool === 'move') {
        const dx = (e.movementX || 0); 
        const dy = (e.movementY || 0);
        setPreviewOffset(prev => ({ x: prev.x + dx, y: prev.y + dy }));

    } else if (previewTool === 'eraser') {
        const dist = Math.sqrt(Math.pow(coords.x - previewLastPosition.x, 2) + Math.pow(coords.y - previewLastPosition.y, 2));
        const angle = Math.atan2(coords.y - previewLastPosition.y, coords.x - previewLastPosition.x);
        
        for (let i = 0; i < dist; i+=2) {
            const ix = previewLastPosition.x + Math.cos(angle) * i;
            const iy = previewLastPosition.y + Math.sin(angle) * i;
            erasePreview(ix, iy);
        }
        erasePreview(coords.x, coords.y);
        setPreviewLastPosition(coords);
    }
  };

  const handlePreviewPointerUp = () => {
    setPreviewIsDragging(false);
    if (previewTool === 'eraser' && previewCanvasRef.current) {
        setProcessedImage(previewCanvasRef.current.toDataURL());
    }
  };

  const erasePreview = (x, y) => {
    const canvas = previewCanvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, previewEraserSize / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  };

  const handleZoomIn = () => {
      setPreviewScale(prev => Math.min(prev * 1.2, 5));
  };

  const handleZoomOut = () => {
      setPreviewScale(prev => Math.max(prev / 1.2, 0.1));
  };


  // --- Crop Logic ---
  
  const performCrop = () => {
    if (!cropSelection || !originalImage) return;

    let { x, y, width, height } = cropSelection;
    if (width < 0) { x += width; width = Math.abs(width); }
    if (height < 0) { y += height; height = Math.abs(height); }

    if (width < 10 || height < 10) return;

    const scaleX = originalImage.width / canvasSize.width;
    const scaleY = originalImage.height / canvasSize.height;

    const sourceX = x * scaleX;
    const sourceY = y * scaleY;
    const sourceW = width * scaleX;
    const sourceH = height * scaleY;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    
    tempCtx.drawImage(originalImage, sourceX, sourceY, sourceW, sourceH, 0, 0, width, height);
    
    const newOriginalImage = new Image();
    newOriginalImage.onload = () => {
        setOriginalImage(newOriginalImage);
        setCanvasSize({ width, height });
        setCropSelection(null);
        setTool('move');
        
        setTimeout(() => {
            centerCanvas(width, height);
            applyThreshold(newOriginalImage, width, height, threshold, lineColor, removeShadows);
            saveHistory(true); 
        }, 50);
    };
    newOriginalImage.src = tempCanvas.toDataURL();
  };

  const cancelCrop = () => {
    setCropSelection(null);
    setTool('move');
  };

  // --- Noise Reduction Logic ---

  const applyNoiseFilter = useCallback((level) => {
    if (!previewOriginalImageData) return;

    const canvas = document.createElement('canvas');
    canvas.width = canvasSize.width;
    canvas.height = canvasSize.height;
    const ctx = canvas.getContext('2d');

    if (level === 0) {
        ctx.putImageData(previewOriginalImageData, 0, 0);
        setProcessedImage(canvas.toDataURL());
        return;
    }

    const width = canvasSize.width;
    const height = canvasSize.height;
    const inputData = previewOriginalImageData.data;
    const outputData = new Uint8ClampedArray(inputData);

    const neighborThreshold = level; 

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const idx = (y * width + x) * 4;
            if (inputData[idx + 3] === 0) continue; 

            let neighbors = 0;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        const nIdx = (ny * width + nx) * 4;
                        if (inputData[nIdx + 3] > 0) neighbors++;
                    }
                }
            }
            if (neighbors < neighborThreshold) {
                outputData[idx + 3] = 0; 
            }
        }
    }

    const newImageData = new ImageData(outputData, width, height);
    ctx.putImageData(newImageData, 0, 0);
    setProcessedImage(canvas.toDataURL());

  }, [previewOriginalImageData, canvasSize]);

  const handleNoiseLevelChange = (e) => {
    const val = parseInt(e.target.value);
    setNoiseLevel(val);
    applyNoiseFilter(val);
  };

  const handleToPreview = () => {
    if (canvasRef.current) {
        const ctx = canvasRef.current.getContext('2d');
        const rawData = ctx.getImageData(0, 0, canvasSize.width, canvasSize.height);
        setPreviewOriginalImageData(rawData);
        const dataUrl = canvasRef.current.toDataURL();
        setProcessedImage(dataUrl);
        
        setNoiseLevel(0);
        setPreviewScale(1);
        setPreviewOffset({x:0, y:0});
        setPreviewTool('move');

        setHistory(prev => {
            if (prev.length > 0 && prev[prev.length - 1] === dataUrl) return prev;
            const newHistory = [...prev, dataUrl];
            if (newHistory.length > 5) return newHistory.slice(newHistory.length - 5);
            return newHistory;
        });
        setStep('preview');
    }
  };

  const handleSave = () => {
    if (processedImage) {
        const link = document.createElement('a');
        link.download = 'kids-art-scan.png';
        link.href = processedImage;
        link.click();
    }
  };

  // --- Render Steps ---

  const renderUpload = () => (
    <div className="flex flex-col items-center justify-center h-full p-8 text-center bg-blue-50">
      <div 
        className={`bg-white p-10 rounded-3xl shadow-xl border-4 transition-colors duration-300 max-w-md w-full flex flex-col items-center ${isDragOver ? 'border-blue-500 bg-blue-50' : 'border-blue-200'}`}
        onDragOver={handleDragOver}
        onDragLeave={handleDragLeave}
        onDrop={handleDrop}
      >
        <div className="mb-6 bg-yellow-100 p-4 rounded-full inline-block pointer-events-none">
          <ImageIcon size={64} className="text-yellow-600" />
        </div>
        <h2 className="text-2xl font-bold text-gray-800 mb-4 pointer-events-none">お絵かきをスキャンしよう！</h2>
        <p className="text-gray-600 mb-8 pointer-events-none">
          紙に描いた絵を写真に撮ってね。<br/>
          ここに画像をドロップするか、<br/>
          下のボタンを押して選んでね。
        </p>
        
        <label className="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center gap-2">
          <Upload size={24} />
          <span>写真を選ぶ・撮る</span>
          <input 
            type="file" 
            accept="image/*" 
            onChange={handleImageUpload} 
            className="hidden" 
          />
        </label>
      </div>
    </div>
  );

  const renderEdit = () => (
    <div className="flex h-full bg-gray-100 overflow-hidden">
        {/* Left: Canvas Area */}
        <div 
            className="flex-1 relative bg-gray-300 touch-none overflow-hidden"
            ref={containerRef}
            style={{
                backgroundImage: 'linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%)',
                backgroundSize: '20px 20px',
                backgroundPosition: '0 0, 0 10px, 10px -10px, -10px 0px'
            }}
            onMouseDown={handlePointerDown}
            onMouseMove={handlePointerMove}
            onMouseUp={handlePointerUp}
            onMouseLeave={handlePointerUp}
            onTouchStart={handlePointerDown}
            onTouchMove={handlePointerMove}
            onTouchEnd={handlePointerUp}
        >
            <canvas 
                ref={canvasRef}
                width={canvasSize.width}
                height={canvasSize.height}
                className="absolute origin-top-left shadow-2xl"
                style={{
                    transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`,
                    cursor: tool === 'eraser' ? 'crosshair' : (tool === 'crop' ? 'crosshair' : 'move')
                }}
            />
            
            {/* Crop Overlay */}
            {cropSelection && (
                <>
                     <div 
                        className="absolute bg-black/50 pointer-events-none"
                        style={{ left: 0, top: 0, width: '100%', height: Math.min(cropSelection.y, cropSelection.y + cropSelection.height) * scale + offset.y }}
                    />
                    <div 
                        className="absolute bg-black/50 pointer-events-none"
                        style={{ left: 0, top: Math.max(cropSelection.y, cropSelection.y + cropSelection.height) * scale + offset.y, width: '100%', bottom: 0 }}
                    />
                    <div 
                        className="absolute bg-black/50 pointer-events-none"
                        style={{ left: 0, top: Math.min(cropSelection.y, cropSelection.y + cropSelection.height) * scale + offset.y, width: Math.min(cropSelection.x, cropSelection.x + cropSelection.width) * scale + offset.x, height: Math.abs(cropSelection.height) * scale }}
                    />
                    <div 
                        className="absolute bg-black/50 pointer-events-none"
                        style={{ right: 0, top: Math.min(cropSelection.y, cropSelection.y + cropSelection.height) * scale + offset.y, left: Math.max(cropSelection.x, cropSelection.x + cropSelection.width) * scale + offset.x, height: Math.abs(cropSelection.height) * scale }}
                    />
                    <div 
                        className="absolute border-2 border-yellow-400 bg-transparent pointer-events-none shadow-[0_0_0_1px_rgba(255,255,255,0.5)]"
                        style={{
                            left: Math.min(cropSelection.x, cropSelection.x + cropSelection.width) * scale + offset.x,
                            top: Math.min(cropSelection.y, cropSelection.y + cropSelection.height) * scale + offset.y,
                            width: Math.abs(cropSelection.width) * scale,
                            height: Math.abs(cropSelection.height) * scale,
                        }}
                    />
                </>
            )}
            
            <div className="absolute bottom-4 right-4 pointer-events-none z-0">
                <div className="bg-black/50 text-white text-xs px-3 py-1 rounded-full backdrop-blur-sm">
                    {tool === 'move' ? 'ドラッグして移動' : (tool === 'crop' ? 'ドラッグして範囲を選択' : 'なぞって消す')}
                </div>
            </div>
        </div>

        {/* Right: Sidebar Controls */}
        <div className="w-80 bg-white border-l border-gray-200 flex flex-col shadow-xl z-20">
            {/* Header / Navigation */}
            <div className="p-4 border-b border-gray-100 flex items-center justify-between">
                <button onClick={() => setStep('upload')} className="text-gray-500 hover:text-gray-800 flex items-center gap-1 text-sm font-bold">
                    <ArrowLeft size={18} />
                    戻る
                </button>
                <div className="flex gap-2">
                    <button
                        onClick={handleUndo}
                        disabled={history.length <= 1}
                        className={`p-2 rounded-full transition ${history.length <= 1 ? 'text-gray-300' : 'text-gray-600 hover:bg-gray-100'}`}
                        title="元に戻す"
                    >
                        <Undo size={20} />
                    </button>
                    <button
                        onClick={handleToPreview}
                        className="bg-green-500 text-white px-4 py-2 rounded-full font-bold shadow hover:bg-green-600 transition flex items-center gap-1 text-sm"
                    >
                        <Check size={16} />
                        完了
                    </button>
                </div>
            </div>

            {/* Scrollable Content Area */}
            <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
                
                {/* Tools Grid */}
                <div>
                    <h3 className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">ツール</h3>
                    <div className="grid grid-cols-3 gap-2">
                        <button 
                            onClick={() => { setTool('move'); setCropSelection(null); }}
                            className={`p-3 rounded-xl flex flex-col items-center gap-1 transition border ${tool === 'move' ? 'border-blue-200 bg-blue-50 text-blue-600' : 'border-gray-100 bg-gray-50 text-gray-400 hover:bg-gray-100'}`}
                        >
                            <MousePointer2 size={24} />
                            <span className="text-[10px] font-bold">移動</span>
                        </button>
                        <button 
                            onClick={() => { setTool('crop'); setCropSelection(null); }}
                            className={`p-3 rounded-xl flex flex-col items-center gap-1 transition border ${tool === 'crop' ? 'border-yellow-200 bg-yellow-50 text-yellow-600' : 'border-gray-100 bg-gray-50 text-gray-400 hover:bg-gray-100'}`}
                        >
                            <Crop size={24} />
                            <span className="text-[10px] font-bold">切り抜き</span>
                        </button>
                        <button 
                            onClick={() => { setTool('eraser'); setCropSelection(null); }}
                            className={`p-3 rounded-xl flex flex-col items-center gap-1 transition border ${tool === 'eraser' ? 'border-pink-200 bg-pink-50 text-pink-600' : 'border-gray-100 bg-gray-50 text-gray-400 hover:bg-gray-100'}`}
                        >
                            <Eraser size={24} />
                            <span className="text-[10px] font-bold">消しゴム</span>
                        </button>
                    </div>
                </div>

                {/* Contextual Settings */}
                <div className="flex-1">
                    <h3 className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">設定</h3>
                    
                    {tool === 'move' && (
                        <div className="flex flex-col gap-4">
                            {/* Shadow Removal */}
                            <div className="bg-orange-50 p-3 rounded-xl border border-orange-100">
                                <div className="flex items-center justify-between mb-2">
                                    <div className="flex items-center gap-2 text-orange-700">
                                        <Sun size={18} />
                                        <span className="text-sm font-bold">影を自動補正</span>
                                    </div>
                                    <label className="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" checked={removeShadows} onChange={handleShadowToggle} className="sr-only peer" />
                                        <div className="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-orange-500"></div>
                                    </label>
                                </div>
                                <p className="text-[10px] text-orange-600/70">写真の影やムラを自動で取り除きます。</p>
                            </div>

                            {/* Threshold */}
                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                <div className="flex items-center gap-2 mb-2 text-gray-600">
                                    <Sliders size={18} />
                                    <span className="text-sm font-bold">線の濃さ</span>
                                </div>
                                <input 
                                    type="range" min="0" max="255" value={threshold} onChange={handleThresholdChange}
                                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                />
                            </div>

                            {/* Color */}
                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 flex items-center justify-between">
                                <div className="flex items-center gap-2 text-gray-600">
                                    <Palette size={18} />
                                    <span className="text-sm font-bold">線の色</span>
                                </div>
                                <div className="relative w-8 h-8 rounded-full border-2 border-white shadow-sm cursor-pointer overflow-hidden ring-1 ring-gray-200" style={{backgroundColor: lineColor}}>
                                    <input type="color" value={lineColor} onChange={(e) => handleColorChange(e.target.value)} className="opacity-0 w-full h-full cursor-pointer" />
                                </div>
                            </div>
                        </div>
                    )}

                    {tool === 'eraser' && (
                        <div className="bg-pink-50 p-4 rounded-xl border border-pink-100">
                            <div className="flex items-center justify-between mb-4">
                                <span className="text-sm font-bold text-pink-700">消しゴムサイズ</span>
                                <div className="w-8 h-8 rounded-full border border-pink-200 bg-white flex items-center justify-center">
                                    <div className="bg-gray-800 rounded-full" style={{width: Math.min(24, eraserSize/3), height: Math.min(24, eraserSize/3)}}></div>
                                </div>
                            </div>
                            <input 
                                type="range" min="5" max="100" value={eraserSize} onChange={(e) => setEraserSize(e.target.value)}
                                className="w-full h-2 bg-pink-200 rounded-lg appearance-none cursor-pointer accent-pink-500"
                            />
                        </div>
                    )}

                    {tool === 'crop' && (
                        <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-100 text-center">
                            {!cropSelection ? (
                                <p className="text-sm font-bold text-yellow-800">画面をドラッグして<br/>切り抜く範囲を決めてください</p>
                            ) : (
                                <div className="flex flex-col gap-2">
                                    <button onClick={performCrop} className="w-full py-2 rounded-lg bg-yellow-500 text-white font-bold hover:bg-yellow-600 shadow-sm">
                                        切り抜く
                                    </button>
                                    <button onClick={cancelCrop} className="w-full py-2 rounded-lg bg-white text-yellow-700 font-bold hover:bg-yellow-100">
                                        キャンセル
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            </div>
        </div>
    </div>
  );

  const renderPreview = () => (
    <div className="flex h-full bg-blue-50 overflow-hidden">
        {/* Left: Preview Canvas Area */}
        <div 
            className="flex-1 relative bg-gray-300 touch-none overflow-hidden"
            ref={previewContainerRef}
            style={{
                backgroundImage: 'linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%)',
                backgroundSize: '20px 20px',
                backgroundPosition: '0 0, 0 10px, 10px -10px, -10px 0px'
            }}
            onMouseDown={handlePreviewPointerDown}
            onMouseMove={handlePreviewPointerMove}
            onMouseUp={handlePreviewPointerUp}
            onMouseLeave={handlePreviewPointerUp}
            onTouchStart={handlePreviewPointerDown}
            onTouchMove={handlePreviewPointerMove}
            onTouchEnd={handlePreviewPointerUp}
        >
            <canvas 
                ref={previewCanvasRef}
                className="absolute origin-top-left shadow-2xl"
                style={{
                    transform: `translate(${previewOffset.x}px, ${previewOffset.y}px) scale(${previewScale})`,
                    cursor: previewTool === 'eraser' ? 'crosshair' : 'move'
                }}
            />
            <div className="absolute bottom-4 right-4 pointer-events-none z-0">
                <div className="bg-black/50 text-white text-xs px-3 py-1 rounded-full backdrop-blur-sm">
                    {previewTool === 'move' ? '仕上げ：ドラッグして確認' : '仕上げ：なぞって消す'}
                </div>
            </div>

            {/* Zoom Controls Overlay */}
            <div className="absolute top-4 right-4 flex flex-col gap-2 z-20">
                <button onClick={handleZoomIn} className="bg-white/90 backdrop-blur p-2 rounded-full shadow-lg text-gray-600 hover:text-blue-500 border border-gray-100">
                    <ZoomIn size={24} />
                </button>
                <button onClick={handleZoomOut} className="bg-white/90 backdrop-blur p-2 rounded-full shadow-lg text-gray-600 hover:text-blue-500 border border-gray-100">
                    <ZoomOut size={24} />
                </button>
            </div>
        </div>

        {/* Right: Sidebar Controls */}
        <div className="w-80 bg-white border-l border-gray-200 flex flex-col shadow-xl z-20">
             
             {/* Header */}
             <div className="p-4 border-b border-gray-100">
                 <button onClick={() => setStep('edit')} className="text-gray-500 hover:text-gray-800 flex items-center gap-1 text-sm font-bold">
                    <ArrowLeft size={18} />
                    編集に戻る
                </button>
             </div>

             <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
                <div>
                    <h3 className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">仕上げツール</h3>
                     <div className="flex bg-gray-100 p-1 rounded-xl">
                        <button 
                            onClick={() => setPreviewTool('move')}
                            className={`flex-1 p-2 rounded-lg transition flex items-center justify-center gap-2 ${previewTool === 'move' ? 'bg-white shadow text-blue-600 font-bold' : 'text-gray-500'}`}
                        >
                            <Move size={18} />
                            <span className="text-xs">移動</span>
                        </button>
                        <button 
                            onClick={() => setPreviewTool('eraser')}
                            className={`flex-1 p-2 rounded-lg transition flex items-center justify-center gap-2 ${previewTool === 'eraser' ? 'bg-white shadow text-pink-600 font-bold' : 'text-gray-500'}`}
                        >
                            <Eraser size={18} />
                            <span className="text-xs">消しゴム</span>
                        </button>
                     </div>
                </div>

                {/* Dynamic Settings */}
                <div className="flex-1">
                     <h3 className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">調整</h3>
                     
                     {previewTool === 'move' ? (
                         <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                            <div className="flex items-center gap-2 text-yellow-700 mb-2">
                                <Sparkles size={18} />
                                <span className="text-sm font-bold">ノイズ除去</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <input 
                                    type="range" min="0" max="5" step="1" value={noiseLevel} onChange={handleNoiseLevelChange}
                                    className="flex-1 h-2 bg-yellow-200 rounded-lg appearance-none cursor-pointer accent-yellow-500"
                                />
                                <span className="text-sm font-bold text-yellow-700 w-4 text-center">{noiseLevel}</span>
                            </div>
                            <p className="text-[10px] text-yellow-600/70 mt-2">細かいゴミを自動で消去します。</p>
                        </div>
                     ) : (
                        <div className="bg-pink-50 p-4 rounded-xl border border-pink-100">
                            <div className="flex items-center justify-between mb-4">
                                <span className="text-sm font-bold text-pink-700">消しゴムサイズ</span>
                            </div>
                            <input 
                                type="range" min="5" max="50" value={previewEraserSize} onChange={(e) => setPreviewEraserSize(e.target.value)}
                                className="w-full h-2 bg-pink-200 rounded-lg appearance-none cursor-pointer accent-pink-500"
                            />
                        </div>
                     )}
                </div>
             </div>

            {/* Footer Action */}
            <div className="p-4 border-t border-gray-100 bg-gray-50">
                <button 
                    onClick={handleSave}
                    className="w-full py-3 rounded-xl bg-blue-500 text-white font-bold hover:bg-blue-600 shadow-lg transition flex items-center justify-center gap-2"
                >
                    <Download size={20} />
                    画像を保存
                </button>
            </div>
        </div>
    </div>
  );

  return (
    <div className="w-full h-screen font-sans bg-gray-50 overflow-hidden select-none">
      {step === 'upload' && renderUpload()}
      {step === 'edit' && renderEdit()}
      {step === 'preview' && renderPreview()}
    </div>
  );
};

export default KidsArtScanner;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
