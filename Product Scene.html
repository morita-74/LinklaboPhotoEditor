<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI商品シーン生成</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            overscroll-behavior: none;
        }
        .canvas-bg {
            background-image:
                linear-gradient(45deg, #1e293b 25%, transparent 25%),
                linear-gradient(-45deg, #1e293b 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1e293b 75%),
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .situation-btn {
            transition: all 0.15s ease;
        }
        .situation-btn.selected {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-color: transparent;
            color: white;
        }
        .gemini-loader {
            width: 48px;
            height: 48px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
        }
        .gemini-loader::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: #0f172a;
            border-radius: 50%;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-gradient:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .history-thumb {
            transition: all 0.15s ease;
        }
        .history-thumb.active {
            outline: 2px solid #8b5cf6;
            outline-offset: 2px;
        }
        textarea::placeholder { color: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-6xl flex flex-col gap-4 py-2">

        <!-- Header -->
        <div class="bg-slate-800/80 backdrop-blur p-4 rounded-2xl border border-slate-700 flex flex-wrap items-center justify-between gap-4 shadow-xl z-10">
            <div class="flex items-center gap-3">
                <div class="p-2 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600">
                    <i data-lucide="camera" class="text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight">AI商品シーン生成</h1>
                    <p class="text-xs text-blue-400">商品を実際に使っている自然な写真を生成します</p>
                </div>
            </div>
            <span class="text-xs text-slate-500">Powered by Gemini</span>
        </div>

        <!-- Main -->
        <div class="grid grid-cols-1 lg:grid-cols-[1fr_400px] gap-4 items-start">

            <!-- Left: Image / Result -->
            <div class="flex flex-col gap-4">
                <div class="relative rounded-2xl overflow-hidden border-2 border-slate-700 canvas-bg flex items-center justify-center shadow-inner group aspect-square lg:aspect-[4/3]" id="imageContainer">

                    <!-- Upload Placeholder -->
                    <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 z-20 cursor-pointer hover:bg-slate-900/80 transition" onclick="document.getElementById('fileInput').click()">
                        <div class="bg-slate-800 p-8 rounded-full mb-6 group-hover:scale-105 transition duration-300 border border-slate-700">
                            <i data-lucide="image-plus" class="text-blue-500 w-16 h-16"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-white">商品画像をアップロード</h2>
                        <p class="text-slate-400 mt-2">ドラッグ＆ドロップ または クリック</p>
                    </div>

                    <img id="displayImage" class="hidden max-w-full max-h-full object-contain">

                    <!-- Loading Overlay -->
                    <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/85 backdrop-blur-md z-30 flex flex-col items-center justify-center hidden">
                        <div class="gemini-loader mb-6"></div>
                        <h3 class="text-xl font-bold text-white mb-2">AIが撮影シーンを生成中...</h3>
                        <p class="text-slate-400 text-sm max-w-xs text-center">商品を保持したまま、自然な使用シーンを組み立てています</p>
                    </div>

                    <!-- View Toggle -->
                    <div class="absolute top-4 left-4 z-20 hidden" id="viewToggle">
                        <div class="flex bg-slate-900/80 backdrop-blur rounded-lg p-1 border border-slate-700 text-xs">
                            <button onclick="setView('original')" id="btnViewOriginal" class="px-3 py-1.5 rounded-md font-semibold transition">元画像</button>
                            <button onclick="setView('result')" id="btnViewResult" class="px-3 py-1.5 rounded-md font-semibold transition">生成結果</button>
                        </div>
                    </div>

                    <!-- Change Image -->
                    <button onclick="document.getElementById('fileInput').click()" id="btnChangeImage" class="absolute top-4 right-4 z-20 hidden p-2 bg-slate-900/80 hover:bg-slate-700 text-white rounded-lg border border-slate-700 shadow-lg transition" title="画像を変更">
                        <i data-lucide="image-plus" size="18"></i>
                    </button>

                    <!-- Download -->
                    <button onclick="downloadResult()" id="btnDownload" class="absolute bottom-4 right-4 z-20 hidden btn-gradient text-white px-4 py-2 rounded-full font-bold flex items-center gap-2 shadow-lg text-sm">
                        <i data-lucide="download" size="16"></i>
                        ダウンロード
                    </button>
                </div>

                <!-- History -->
                <div id="historyBar" class="hidden flex-wrap gap-2 px-1"></div>

                <!-- Status -->
                <div class="flex justify-between text-xs text-slate-500 px-2">
                    <span>商品の形・色・ロゴは保持したまま、背景と使用シーンだけを再構築します</span>
                    <span id="statusText">Ready</span>
                </div>
            </div>

            <!-- Right: Controls -->
            <div class="bg-slate-800/80 backdrop-blur p-5 rounded-2xl border border-slate-700 shadow-xl flex flex-col gap-5">
                <div>
                    <h3 class="font-bold text-sm mb-1 flex items-center gap-2">
                        <i data-lucide="sparkles" size="16" class="text-purple-400"></i>
                        シチュエーションを選択
                    </h3>
                    <p class="text-xs text-slate-500 mb-3">商品を実際に使っている場面を選んでください（複数選択不可）</p>
                    <div id="situationGrid" class="grid grid-cols-2 gap-2"></div>
                </div>

                <div>
                    <h3 class="font-bold text-sm mb-1 flex items-center gap-2">
                        <i data-lucide="pencil-line" size="16" class="text-purple-400"></i>
                        追加の指定（任意）
                    </h3>
                    <textarea id="customSituation" rows="3" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-sm text-white resize-none focus:outline-none focus:border-blue-500" placeholder="例：雨の日の駅のホームで、傘をさしながら使っているシーン"></textarea>
                    <p class="text-[11px] text-slate-500 mt-1">シチュエーションを選ばずに、ここだけで場面を指定することもできます</p>
                </div>

                <button onclick="generateScene()" id="generateBtn" class="btn-gradient text-white w-full py-3 rounded-full font-bold flex items-center justify-center gap-2" disabled>
                    <i data-lucide="wand-2" size="18"></i>
                    このシーンで生成する
                </button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" class="hidden">

    <script>
        // --- Configuration ---
        const API_URL = `/api/ai`;

        const SITUATIONS = [
            { id: 'kitchen', label: 'キッチン', icon: 'utensils', desc: '明るい自宅のキッチンで、実際に料理や準備をしながらこの商品を使っている自然な一コマ。窓からの柔らかい朝の光が差し込んでいる。' },
            { id: 'living', label: 'リビング', icon: 'sofa', desc: '居心地の良いリビングルームでくつろぎながら、この商品を自然に使用している様子。午後の柔らかい光。' },
            { id: 'outdoor', label: 'アウトドア', icon: 'trees', desc: '公園や自然の中で、アクティブにこの商品を使用しているシーン。明るい屋外の自然光。' },
            { id: 'office', label: 'オフィス', icon: 'briefcase', desc: 'モダンなオフィスのデスクで、仕事の合間にこの商品を使用している様子。窓からの自然光が差し込む室内。' },
            { id: 'cafe', label: 'カフェ', icon: 'coffee', desc: 'おしゃれなカフェのテーブルで、コーヒーを片手にこの商品を使っているリラックスした一コマ。温かみのある照明。' },
            { id: 'travel', label: '旅行先', icon: 'plane', desc: '旅行中の街中や観光地で、この商品を実際に使用している様子。自然な屋外の光。' },
            { id: 'gym', label: 'ジム/フィットネス', icon: 'dumbbell', desc: 'ジムやトレーニングスペースで、体を動かしながらこの商品を使用しているアクティブな一コマ。明るい室内照明。' },
            { id: 'entrance', label: '玄関/外出前', icon: 'door-open', desc: '自宅の玄関で、外出前の身支度としてこの商品を使用している様子。自然光の入る玄関。' },
            { id: 'bathroom', label: '洗面所', icon: 'droplets', desc: '明るい洗面台の前で、朝の身支度の一部としてこの商品を使用している様子。柔らかい自然光。' },
            { id: 'bedroom', label: '寝室', icon: 'moon', desc: '落ち着いた寝室で、リラックスした夜のひとときにこの商品を使用している様子。温かみのあるランプの光。' }
        ];

        // --- Init Icons ---
        lucide.createIcons();

        // --- Elements ---
        const imageContainer = document.getElementById('imageContainer');
        const placeholder = document.getElementById('placeholder');
        const displayImage = document.getElementById('displayImage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const statusText = document.getElementById('statusText');
        const viewToggle = document.getElementById('viewToggle');
        const btnViewOriginal = document.getElementById('btnViewOriginal');
        const btnViewResult = document.getElementById('btnViewResult');
        const btnChangeImage = document.getElementById('btnChangeImage');
        const btnDownload = document.getElementById('btnDownload');
        const historyBar = document.getElementById('historyBar');
        const situationGrid = document.getElementById('situationGrid');
        const customSituation = document.getElementById('customSituation');
        const generateBtn = document.getElementById('generateBtn');
        const fileInput = document.getElementById('fileInput');

        // --- State ---
        let originalImageDataUrl = null;
        let originalMimeType = 'image/png';
        let resultImageDataUrl = null;
        let currentView = 'original';
        let selectedSituationId = null;
        let history = []; // { situationLabel, dataUrl }

        function setStatus(msg) {
            statusText.textContent = msg;
        }

        // --- Build situation buttons ---
        SITUATIONS.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'situation-btn flex flex-col items-center gap-1 p-3 rounded-xl border border-slate-700 bg-slate-900/50 text-slate-300 hover:border-blue-500 text-xs font-semibold';
            btn.innerHTML = `<i data-lucide="${s.icon}" size="18"></i><span>${s.label}</span>`;
            btn.onclick = () => selectSituation(s.id);
            btn.id = `situation-${s.id}`;
            situationGrid.appendChild(btn);
        });
        lucide.createIcons();

        function selectSituation(id) {
            selectedSituationId = (selectedSituationId === id) ? null : id;
            document.querySelectorAll('.situation-btn').forEach(b => b.classList.remove('selected'));
            if (selectedSituationId) {
                document.getElementById(`situation-${selectedSituationId}`).classList.add('selected');
            }
            updateGenerateButtonState();
        }

        function updateGenerateButtonState() {
            const hasCustom = customSituation.value.trim().length > 0;
            generateBtn.disabled = !originalImageDataUrl || (!selectedSituationId && !hasCustom);
        }
        customSituation.addEventListener('input', updateGenerateButtonState);

        // --- Drag & Drop & File Loading ---
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) loadFile(e.target.files[0]);
        });

        function loadFile(file) {
            if (!file.type.startsWith('image/')) return alert('画像を選択してください');
            originalMimeType = file.type;
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImageDataUrl = e.target.result;
                resultImageDataUrl = null;
                history = [];
                renderHistory();
                setView('original');
                placeholder.style.display = 'none';
                displayImage.classList.remove('hidden');
                displayImage.src = originalImageDataUrl;
                btnChangeImage.classList.remove('hidden');
                viewToggle.classList.add('hidden');
                btnDownload.classList.add('hidden');
                setStatus('画像を読み込みました。シチュエーションを選んでください');
                updateGenerateButtonState();
            };
            reader.readAsDataURL(file);
        }

        function setView(view) {
            currentView = view;
            if (view === 'original') {
                displayImage.src = originalImageDataUrl;
                btnViewOriginal.classList.add('bg-slate-700', 'text-white');
                btnViewResult.classList.remove('bg-slate-700', 'text-white');
                btnDownload.classList.add('hidden');
            } else {
                if (!resultImageDataUrl) return;
                displayImage.src = resultImageDataUrl;
                btnViewResult.classList.add('bg-slate-700', 'text-white');
                btnViewOriginal.classList.remove('bg-slate-700', 'text-white');
                btnDownload.classList.remove('hidden');
            }
        }
        window.setView = setView;

        function renderHistory() {
            if (history.length === 0) {
                historyBar.classList.add('hidden');
                historyBar.innerHTML = '';
                return;
            }
            historyBar.classList.remove('hidden');
            historyBar.classList.add('flex');
            historyBar.innerHTML = '';
            history.forEach((h, idx) => {
                const wrap = document.createElement('button');
                wrap.className = 'history-thumb rounded-lg overflow-hidden border border-slate-700 w-16 h-16 flex-shrink-0' + (h.dataUrl === resultImageDataUrl ? ' active' : '');
                wrap.title = h.situationLabel;
                wrap.innerHTML = `<img src="${h.dataUrl}" class="w-full h-full object-cover">`;
                wrap.onclick = () => {
                    resultImageDataUrl = h.dataUrl;
                    setView('result');
                    renderHistory();
                };
                historyBar.appendChild(wrap);
            });
        }

        // --- Prompt Builder ---
        function buildPrompt(situationText) {
            return `You are an elite commercial product photographer and professional photo retoucher.

GOAL: Transform the attached product photo into one authentic, real-world lifestyle photograph that shows this exact product being actively used in the following situation: ${situationText}

MANDATORY RULES:
1. PRESERVE THE PRODUCT EXACTLY: Keep its shape, proportions, colors, materials, logos, printed text, and label design 100% identical to the source photo. Do not redesign, restyle, resize, or invent a different product.
2. NO FLAT PASTE-ON / NO STICKER LOOK: Never simply cut the product out and paste it flatly onto a new background. Fully reconstruct the entire scene around the product so it is naturally held by a hand, placed on a real surface, or integrated into the environment with correct perspective, scale, and physical contact (contact shadows, reflections, slight surface indentation where relevant).
3. MATCH LIGHT & SHADOW: Match the lighting direction, color temperature, and shadow softness between the product and the new environment so nothing looks composited.
4. LOOK LIKE A REAL PHOTOGRAPH, NOT AI ART: Render as if captured with a real camera - natural depth of field, subtle sensor/film grain, imperfect and candid framing, true-to-life textures. Avoid the typical "AI-generated" look: no waxy/plastic skin, no overly symmetrical or dreamlike composition, no floating or misaligned shadows, no extra or malformed fingers/limbs, no glossy uncanny surfaces.
5. SHOW GENUINE USE: The scene must read as a candid moment of the product actually being used in context, not a studio product shot and not an isolated object on a plain backdrop.
6. Keep the overall image realistic, well-composed, and suitable for real marketing use.

Output only the final photographic image, nothing else.`;
        }

        function resolveSituationText() {
            const custom = customSituation.value.trim();
            const preset = SITUATIONS.find(s => s.id === selectedSituationId);
            if (preset && custom) {
                return `${preset.desc} また、次の指定も反映してください：${custom}`;
            }
            if (preset) return preset.desc;
            return custom;
        }

        // --- Gemini API Call ---
        async function generateScene() {
            if (!originalImageDataUrl) return;
            const situationText = resolveSituationText();
            if (!situationText) return;

            loadingOverlay.classList.remove('hidden');
            generateBtn.disabled = true;
            setStatus('Gemini APIに送信中...');

            try {
                const base64Image = originalImageDataUrl.split(',')[1];
                const prompt = buildPrompt(situationText);

                const payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: originalMimeType || 'image/png', data: base64Image } }
                        ]
                    }],
                    generationConfig: {
                        responseModalities: ["TEXT", "IMAGE"]
                    }
                };

                const result = await fetchWithBackoff(API_URL, payload);

                if (!result.candidates || !result.candidates[0]) {
                    throw new Error("予期しないレスポンス形式です（候補がありません）。");
                }

                const candidate = result.candidates[0];
                if (candidate.finishReason && candidate.finishReason !== "STOP" && candidate.finishReason !== "MAX_TOKENS") {
                    throw new Error(`生成が停止されました。理由: ${candidate.finishReason}`);
                }
                if (!candidate.content || !candidate.content.parts) {
                    throw new Error("予期しないレスポンス形式です（パーツがありません）。");
                }

                const parts = candidate.content.parts;
                const imagePart = parts.find(p => p.inlineData);

                if (imagePart) {
                    resultImageDataUrl = `data:image/png;base64,${imagePart.inlineData.data}`;
                    const label = SITUATIONS.find(s => s.id === selectedSituationId)?.label || 'カスタム';
                    history.unshift({ situationLabel: label, dataUrl: resultImageDataUrl });
                    renderHistory();
                    viewToggle.classList.remove('hidden');
                    setView('result');
                    setStatus('生成が完了しました');
                } else {
                    const textPart = parts.find(p => p.text);
                    if (textPart) {
                        console.warn("AI Response Text:", textPart.text);
                        throw new Error("画像が生成されませんでした。AIの応答: " + textPart.text);
                    }
                    throw new Error("AIが画像を生成しませんでした。");
                }

            } catch (error) {
                console.error(error);
                alert("エラーが発生しました: " + error.message);
                setStatus('エラー');
            } finally {
                loadingOverlay.classList.add('hidden');
                updateGenerateButtonState();
            }
        }
        window.generateScene = generateScene;

        function downloadResult() {
            if (!resultImageDataUrl) return;
            const link = document.createElement('a');
            link.download = 'product-scene.png';
            link.href = resultImageDataUrl;
            link.click();
        }
        window.downloadResult = downloadResult;

        async function fetchWithBackoff(url, payload, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        console.error("API Error Response:", errText);
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }

                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                }
            }
        }
    </script>
</body>
</html>
