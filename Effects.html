<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSlide - Advanced Slideshow Creator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-base: #121212;
            --bg-panel: #1e1e1e;
            --bg-panel-light: #2a2a2a;
            --bg-hover: #333333;
            --accent: #00d4ff;
            --accent-hover: #00a8cc;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --danger: #ff4d4d;
            --border: #333333;
            --font-main: 'Geist', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --gradient-pro: linear-gradient(135deg, #FF00E4, #00d4ff);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 1024px;
        }

        /* Header */
        header {
            height: 50px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent);
            flex-shrink: 0;
            justify-content: space-between;
        }
        .pro-badge {
            background: var(--gradient-pro);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Main Layout */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Left Panel - Slides List */
        .left-panel {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upload-area {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-panel-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover, .upload-area.dragover {
            background-color: var(--bg-hover);
            color: var(--accent);
        }
        .upload-area i { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
        .upload-area p { font-size: 0.85rem; color: var(--text-muted); }
        #file-input { display: none; }

        .slide-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .slide-list::-webkit-scrollbar { width: 6px; }
        .slide-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .slide-item {
            background-color: var(--bg-panel-light);
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: grab;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            box-sizing: border-box;
        }
        .slide-item.active { border-color: var(--accent); }
        .slide-item-content {
            display: flex;
            align-items: center;
            width: 100%;
            padding-right: 15px;
        }
        .slide-item .drag-handle { color: var(--text-muted); margin-right: 10px; cursor: grab; }
        .slide-item img { width: 60px; height: 34px; object-fit: cover; border-radius: 2px; margin-right: 10px; background: #000; }
        .slide-item .info { flex: 1; font-size: 0.8rem; overflow: hidden; }
        .slide-item .info .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
        .slide-item .info .dur { color: var(--accent); font-family: var(--font-mono); font-size: 0.75rem;}
        .slide-item .delete-btn { color: var(--text-muted); cursor: pointer; padding: 5px; transition: color 0.2s; }
        .slide-item .delete-btn:hover { color: var(--danger); }
        
        .stack-badge {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent);
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 0.6rem;
            margin-left: 5px;
        }

        .resize-handle {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 12px;
            cursor: ns-resize;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 2px;
            opacity: 0.3;
            transition: opacity 0.2s, background 0.2s;
        }
        .slide-item:hover .resize-handle { opacity: 1; }
        .resize-handle:hover, .resize-handle.active { background: rgba(0, 212, 255, 0.1); }
        .resize-icon { width: 30px; height: 4px; background: var(--text-muted); border-radius: 2px; transition: background 0.2s; }
        .resize-handle:hover .resize-icon, .resize-handle.active .resize-icon { background: var(--accent); }

        .resize-handle-x {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 12px;
            cursor: ew-resize;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 2px;
            opacity: 0.3;
            transition: opacity 0.2s, background 0.2s;
            z-index: 2;
        }
        .slide-item:hover .resize-handle-x { opacity: 1; }
        .resize-handle-x:hover, .resize-handle-x.active { background: rgba(0, 212, 255, 0.1); }
        .resize-icon-x { width: 4px; height: 30px; background: var(--text-muted); border-radius: 2px; transition: background 0.2s; }
        .resize-handle-x:hover .resize-icon-x, .resize-handle-x.active .resize-icon-x { background: var(--accent); }

        /* Center Panel - Player */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            position: relative;
        }

        .player-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            background-color: #161616;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .preview-container {
            width: 100%;
            max-height: 100%;
            aspect-ratio: 9 / 16; /* Default */
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            transition: aspect-ratio 0.3s ease;
        }

        /* Aspect Ratios */
        .ratio-16-9 { aspect-ratio: 16 / 9; max-width: 1280px; }
        .ratio-1-1 { aspect-ratio: 1 / 1; max-width: 800px; }
        .ratio-9-16 { aspect-ratio: 9 / 16; max-height: 80vh; max-width: calc(80vh * 9 / 16); }

        /* Track Layers */
        .slide-track {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; 
            will-change: transform, opacity, filter, clip-path;
        }
        .slide-image-wrap {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-repeat: no-repeat;
            will-change: transform;
        }

        .controls {
            height: 60px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            gap: 15px;
        }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            top: -5px; left: 0; width: 100%; height: 5px;
            background: var(--bg-panel-light);
            cursor: pointer;
        }
        .progress-bar {
            height: 100%; background: var(--accent); width: 0%;
            transition: width 0.1s linear;
        }

        .control-btn {
            background: none; border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .control-btn:hover { background-color: var(--bg-hover); color: var(--accent); }
        .control-btn.play-btn { background-color: var(--accent); color: var(--bg-base); font-size: 1rem;}
        .control-btn.play-btn:hover { background-color: var(--accent-hover); color: var(--bg-base); transform: scale(1.05);}
        .control-btn.active { color: var(--accent); }

        .time-display {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
            min-width: 100px;
            text-align: center;
        }

        /* Right Panel - Settings */
        .right-panel {
            width: 320px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .tabs-header { padding: 0; display: flex; }
        .tab-btn {
            flex: 1; padding: 15px 0; text-align: center; cursor: pointer; color: var(--text-muted);
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab-btn:hover { color: var(--text-main); background: var(--bg-panel-light); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .tab-content {
            flex: 1; overflow-y: auto; padding: 15px; display: none;
        }
        .tab-content.active { display: block; }
        .tab-content::-webkit-scrollbar { width: 6px; }
        .tab-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        
        .range-wrapper { display: flex; align-items: center; gap: 10px; }
        input[type="range"] {
            flex: 1; accent-color: var(--accent); height: 4px;
            background: var(--bg-panel-light); border-radius: 2px; outline: none;
        }
        .val-display { font-family: var(--font-mono); font-size: 0.85rem; width: 45px; text-align: right; }

        .toggle-wrap { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel-light); padding: 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); transition: border-color 0.2s; }
        .toggle-wrap:hover { border-color: var(--accent); }
        .toggle-wrap input { cursor: pointer; accent-color: var(--accent); transform: scale(1.2); }

        /* Effect Preview Box */
        .effect-preview-box {
            width: 100%; aspect-ratio: 16/9; background-color: var(--bg-panel-light);
            border: 1px solid var(--border); border-radius: 4px; margin-bottom: 15px;
            position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .ep-layer {
            position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            font-size: 2rem; color: #fff; font-weight: bold; opacity: 0;
        }
        .ep-layer-a { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); opacity: 1; }
        .ep-layer-b { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }

        .effect-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

        .effect-btn {
            background-color: var(--bg-panel-light); border: 1px solid var(--border);
            color: var(--text-main); padding: 8px; border-radius: 4px; font-size: 0.75rem;
            cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .effect-btn:hover { border-color: var(--text-muted); }
        .effect-btn.selected { background-color: rgba(0, 212, 255, 0.1); border-color: var(--accent); color: var(--accent); }
        .effect-btn .eff-icon { font-size: 0.9rem; width: 16px; text-align: center; }
        .effect-btn .eff-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .effect-btn .fav-icon { color: var(--text-muted); font-size: 0.8rem; cursor: pointer; transition: color 0.2s; }
        .effect-btn .fav-icon:hover, .effect-btn.is-fav .fav-icon { color: #ffd700; }
        
        .category-label {
            grid-column: 1 / -1; font-size: 0.75rem; color: var(--text-muted);
            margin-top: 10px; margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 2px;
        }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); text-align: center; padding: 20px;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }

        /* AI / Project Tab Styles */
        textarea.ai-prompt {
            width: 100%; height: 100px; background: var(--bg-panel-light); border: 1px solid var(--border);
            color: var(--text-main); padding: 10px; border-radius: 4px; font-family: inherit; resize: none; margin-bottom: 10px;
        }
        textarea.ai-prompt:focus { outline: 1px solid var(--accent); }
        
        .btn-primary {
            width: 100%; padding: 10px; background: var(--accent); color: var(--bg-base);
            border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { background: var(--border); cursor: not-allowed; opacity: 0.7; }

        .btn-magic {
            background: var(--gradient-pro); color: white; border: none; width: 100%; padding: 12px;
            border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: opacity 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-magic:hover { opacity: 0.9; }

        .radio-group { display: flex; gap: 10px; }
        .radio-label {
            flex: 1; text-align: center; background: var(--bg-panel-light); border: 1px solid var(--border);
            padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
        }
        .radio-label:hover { border-color: var(--text-muted); }
        .radio-label.active { background: rgba(0,212,255,0.1); border-color: var(--accent); color: var(--accent); }
        .radio-label input { display: none; }

        /* Utility */
        .hidden { display: none !important; }
        .disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div><i class="fa-solid fa-film" style="margin-right: 10px;"></i> ProSlide <span style="font-size:0.7rem; color:var(--text-muted); font-weight:normal; margin-left:10px;">Timeline Edition</span></div>
    <span class="pro-badge"><i class="fa-solid fa-layer-group"></i> Layer Stack</span>
</header>

<div class="app-container">
    <!-- Left Panel -->
    <aside class="left-panel">
        <div class="panel-header">
            <span>Layers (Timeline)</span>
            <span id="slide-count">0</span>
        </div>
        <div class="upload-area" id="upload-area">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Drag & Drop images</p>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>
        <div class="slide-list" id="slide-list">
            <!-- Layers injected here -->
        </div>
    </aside>

    <!-- Center Panel -->
    <main class="center-panel">
        <div class="player-wrapper" id="player-wrapper">
            <div class="preview-container ratio-9-16" id="preview-container">
                <div class="empty-state" id="player-empty">
                    <i class="fa-regular fa-images"></i>
                    <p>No layers to display.<br>Upload images to stack.</p>
                </div>
                <!-- Layers generated dynamically by GSAP -->
                
                <!-- Edit Overlay -->
                <div id="edit-overlay" style="display: none; position: absolute; inset: 0; z-index: 50; cursor: move; border: 1px dashed rgba(255,255,255,0.3);">
                    <div id="scale-handle" style="position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; background: var(--bg-panel); border: 2px solid var(--accent); border-radius: 50%; cursor: nesw-resize; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.2s;" title="ドラッグして拡大・縮小">
                        <i class="fa-solid fa-up-right-and-down-left-from-center" style="font-size: 14px; color: var(--text-main); pointer-events: none;"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls" style="position:relative;">
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <button class="control-btn" id="btn-prev" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
            <button class="control-btn play-btn" id="btn-play" title="Play/Pause"><i class="fa-solid fa-play"></i></button>
            <button class="control-btn" id="btn-stop" title="Stop"><i class="fa-solid fa-stop"></i></button>
            <button class="control-btn" id="btn-next" title="Next"><i class="fa-solid fa-forward-step"></i></button>
            
            <div class="time-display" id="time-display">0.0s / 0.0s</div>
            
            <button class="control-btn" id="btn-loop" title="Toggle Loop"><i class="fa-solid fa-repeat"></i></button>
            <button class="control-btn" id="btn-fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        </div>
    </main>

    <!-- Right Panel -->
    <aside class="right-panel">
        <div class="panel-header tabs-header">
            <div class="tab-btn active" data-tab="tab-settings" title="Layer Settings"><i class="fa-solid fa-sliders"></i></div>
            <div class="tab-btn" data-tab="tab-project" title="Project Options"><i class="fa-solid fa-gear"></i></div>
        </div>

        <!-- Tab: Settings -->
        <div id="tab-settings" class="tab-content active">
            <div id="settings-area" class="disabled">

                <label class="toggle-wrap" style="margin-bottom: 15px;">
                    <div>
                        <div style="font-weight:bold; font-size:0.9rem; color:var(--text-main);">前の画像を残す (Stack)</div>
                        <div style="font-size:0.7rem;">OFFで切り替え、ONで上に重なります</div>
                    </div>
                    <input type="checkbox" id="input-keep-prev">
                </label>

                <div class="form-group" style="padding-bottom:10px; border-bottom:1px solid var(--border); margin-bottom:15px;">
                    <label>画像ズーム (Scale)</label>
                    <div class="range-wrapper">
                        <input type="range" id="input-scale" min="0.1" max="3" step="0.1" value="1">
                        <span class="val-display" id="val-scale">1.0x</span>
                    </div>
                    
                    <label style="margin-top:10px;">位置 X (左右)</label>
                    <div class="range-wrapper">
                        <input type="range" id="input-posx" min="-500" max="600" step="1" value="50">
                        <span class="val-display" id="val-posx">50%</span>
                    </div>
                    
                    <label style="margin-top:10px;">位置 Y (上下)</label>
                    <div class="range-wrapper">
                        <input type="range" id="input-posy" min="-500" max="600" step="1" value="50">
                        <span class="val-display" id="val-posy">50%</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>次の画像までの待機時間 (Duration)</label>
                    <div class="range-wrapper">
                        <input type="range" id="input-duration" min="0.5" max="30" step="0.5" value="3">
                        <span class="val-display" id="val-duration">3.0s</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>登場アニメーション時間 (Intro)</label>
                    <div class="range-wrapper">
                        <input type="range" id="input-transition" min="0.1" max="5" step="0.1" value="0.8">
                        <span class="val-display" id="val-transition">0.8s</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label style="margin-bottom:8px;">Intro Effect (登場エフェクト)</label>
                    <div class="effect-grid" id="effect-grid">
                        <!-- Effects injected here -->
                    </div>
                </div>
            </div>
            <div id="settings-empty" class="empty-state" style="display:none; height:200px;">
                <i class="fa-solid fa-arrow-pointer"></i>
                <p>Select a layer in timeline</p>
            </div>
        </div>

        <!-- Tab: Project Settings -->
        <div id="tab-project" class="tab-content">
            <button id="btn-magic-animate" class="btn-magic">
                <i class="fa-solid fa-wand-magic-sparkles"></i> マジックアニメーション適用
            </button>

            <div class="form-group">
                <label>アスペクト比</label>
                <div class="radio-group" id="ratio-group">
                    <label class="radio-label" data-ratio="16-9"><i class="fa-solid fa-display"></i><br>16:9</label>
                    <label class="radio-label" data-ratio="1-1"><i class="fa-solid fa-square"></i><br>1:1</label>
                    <label class="radio-label active" data-ratio="9-16"><i class="fa-solid fa-mobile-screen"></i><br>9:16</label>
                </div>
            </div>

            <div class="form-group">
                <label>画像フィッティング</label>
                <div class="radio-group" id="fit-group">
                    <label class="radio-label active" data-fit="contain">フィット</label>
                    <label class="radio-label" data-fit="cover">フィル</label>
                </div>
            </div>

            <div class="form-group" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                <label>動画エクスポート</label>
                <button id="btn-export-video" class="btn-primary" style="background:var(--accent); color:var(--bg-base);">
                    <i class="fa-solid fa-video"></i> 動画として保存 (.webm/.mp4)
                </button>
                <p style="font-size:0.7rem; color:var(--text-muted); margin-top:8px; line-height:1.4;">
                    ※PCブラウザ推奨。録画のために「このタブ」の共有を許可してください。<br>

// --- Resize Logic ---
let isResizing = false;
let startY, startHeight, resizingIndex;
let sortableInstance = null;

function initResize(e, index, el) {
    if(e.type !== 'touchstart') e.preventDefault();
    e.stopPropagation();
    isResizing = true;
    resizingIndex = index;
    startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    startHeight = el.offsetHeight;
    
    el.querySelector('.resize-handle').classList.add('active');
    
    if (sortableInstance) sortableInstance.option("disabled", true);
    
    document.addEventListener('mousemove', onResize);
    document.addEventListener('mouseup', stopResize);
    document.addEventListener('touchmove', onResize, {passive: false});
    document.addEventListener('touchend', stopResize);
}

function onResize(e) {
    if (!isResizing) return;
    if(e.type === 'touchmove') e.preventDefault();
    
    let currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    let diff = currentY - startY;
    let newHeight = startHeight + diff;
    
    // ベース高さ50px、1秒につき10px増加として計算
    let newDuration = (newHeight - 50) / 10;
    newDuration = Math.max(0.5, Math.min(30, newDuration));
    newDuration = Math.round(newDuration * 10) / 10;
    
    slides[resizingIndex].duration = newDuration;
    
    const item = slideListEl.children[resizingIndex];
    item.style.height = `${50 + newDuration * 10}px`;
    item.querySelector('.dur').innerHTML = `<i class="fa-regular fa-clock"></i> ${newDuration.toFixed(1)}s | ${effectsDef[slides[resizingIndex].effect]?.name || 'None'} <span style="color:var(--text-muted);font-size:0.7rem;">(${slides[resizingIndex].effectDuration.toFixed(1)}s)</span>`;
    
    if (resizingIndex === currentSlideIndex) {
        inputDuration.value = newDuration;
        valDuration.textContent = newDuration.toFixed(1) + 's';
    }
}

function stopResize() {
    if (!isResizing) return;
    isResizing = false;
    if (sortableInstance) sortableInstance.option("disabled", false);
    
    const item = slideListEl.children[resizingIndex];
    if(item) item.querySelector('.resize-handle').classList.remove('active');
    
    document.removeEventListener('mousemove', onResize);
    document.removeEventListener('mouseup', stopResize);
    document.removeEventListener('touchmove', onResize);
    document.removeEventListener('touchend', stopResize);
    
    saveToLocalStorage();
    buildTimeline();
    if(masterTimeline && currentSlideIndex >= 0) masterTimeline.seek(slideStartTimes[currentSlideIndex]);
}

let isResizingX = false;
let resizeStartX, startEffectDuration;

function initResizeX(e, index, el) {
    if(e.type !== 'touchstart') e.preventDefault();
    e.stopPropagation();
    isResizingX = true;
    resizingIndex = index;
    resizeStartX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    startEffectDuration = slides[index].effectDuration;
    
    el.querySelector('.resize-handle-x').classList.add('active');
    
    if (sortableInstance) sortableInstance.option("disabled", true);
    
    document.addEventListener('mousemove', onResizeX);
    document.addEventListener('mouseup', stopResizeX);
    document.addEventListener('touchmove', onResizeX, {passive: false});
    document.addEventListener('touchend', stopResizeX);
}

function onResizeX(e) {
    if (!isResizingX) return;
    if(e.type === 'touchmove') e.preventDefault();
    
    let currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    let diff = currentX - resizeStartX;
    
    // 20pxの移動で0.1秒変化
    let diffSec = diff / 200; 
    let newDuration = startEffectDuration + diffSec;
    
    newDuration = Math.max(0.1, Math.min(5.0, newDuration));
    newDuration = Math.round(newDuration * 10) / 10;
    
    slides[resizingIndex].effectDuration = newDuration;
    
    const item = slideListEl.children[resizingIndex];
    item.querySelector('.dur').innerHTML = `<i class="fa-regular fa-clock"></i> ${slides[resizingIndex].duration.toFixed(1)}s | ${effectsDef[slides[resizingIndex].effect]?.name || 'None'} <span style="color:#ffd700;font-size:0.7rem;">(${newDuration.toFixed(1)}s)</span>`;
    
    if (resizingIndex === currentSlideIndex) {
        inputTransition.value = newDuration;
        valTransition.textContent = newDuration.toFixed(1) + 's';
    }
}

function stopResizeX() {
    if (!isResizingX) return;
    isResizingX = false;
    if (sortableInstance) sortableInstance.option("disabled", false);
    
    const item = slideListEl.children[resizingIndex];
    if(item) {
        item.querySelector('.resize-handle-x').classList.remove('active');
        item.querySelector('.dur').innerHTML = `<i class="fa-regular fa-clock"></i> ${slides[resizingIndex].duration.toFixed(1)}s | ${effectsDef[slides[resizingIndex].effect]?.name || 'None'} <span style="color:var(--text-muted);font-size:0.7rem;">(${slides[resizingIndex].effectDuration.toFixed(1)}s)</span>`;
    }
    
    document.removeEventListener('mousemove', onResizeX);
    document.removeEventListener('mouseup', stopResizeX);
    document.removeEventListener('touchmove', onResizeX);
    document.removeEventListener('touchend', stopResizeX);
    
    saveToLocalStorage();
    buildTimeline();
    if(masterTimeline && currentSlideIndex >= 0) masterTimeline.seek(slideStartTimes[currentSlideIndex]);
}


// --- Initialization ---
function init() {
    loadFromLocalStorage();
    applyProjectSettings();
    buildEffectGrid();
    renderSlideList();
    buildTimeline();
    updateUI();
    setupEvents();
    if(slides.length > 0) selectSlide(0, true);
}

function generateId() { return Math.random().toString(36).substring(2, 9); }

function saveToLocalStorage() {
    try {
        localStorage.setItem('proslide_tl_data', JSON.stringify(slides));
        localStorage.setItem('proslide_project', JSON.stringify(projectSettings));
    } catch (e) { console.warn('LocalStorage limit exceeded.'); }
}

function loadFromLocalStorage() {
    const data = localStorage.getItem('proslide_tl_data');
    if (data) { 
        try { 
            slides = JSON.parse(data); 
            // マイグレーション
            slides.forEach(s => {
                if(s.url === undefined && s.originalUrl) s.url = s.originalUrl;
                if(s.keepPrev === undefined) s.keepPrev = false; // 標準をOFFに変更
            });
        } catch(e) { slides = []; } 
    }
    const proj = localStorage.getItem('proslide_project');
    if (proj) { try { projectSettings = Object.assign(projectSettings, JSON.parse(proj)); } catch(e) {} }
}

// --- Image Processing ---
function handleFiles(files) {
    Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            slides.push({
                id: generateId(),
                url: e.target.result, // そのまま利用。高速化・高画質維持
                duration: 2.0,
                effect: 'drop-bounce', // デフォルトエフェクト
                effectDuration: 1.0,
                scale: 1.0,
                posX: 50,
                posY: 50,
                keepPrev: false // 標準をOFFに変更
            });
            renderSlideList();
            saveToLocalStorage();
            buildTimeline();
            selectSlide(slides.length - 1);
        };
        reader.readAsDataURL(file);
    });
}

// --- Timeline Builder (The Core) ---
function buildTimeline() {
    if(masterTimeline) masterTimeline.kill();
    previewContainer.querySelectorAll('.slide-track').forEach(el => el.remove());
    
    slideStartTimes = [];
    totalDuration = 0;
    
    if (slides.length === 0) {
        playerEmpty.style.display = 'flex';
        return;
    }
    playerEmpty.style.display = 'none';

    masterTimeline = gsap.timeline({ 
        paused: true, 
        onUpdate: updateProgress,
        onComplete: () => {
            if(isLooping) masterTimeline.restart();
            else { isPlaying = false; updateUI(); }
        }
    });

    let currentTime = 0;

    slides.forEach((slide, i) => {
        // DOM Generation
        const track = document.createElement('div');
        track.className = 'slide-track';
        track.id = 'track-' + i;
        track.style.zIndex = i + 1; // 後のものが上になる
        
        const imgWrap = document.createElement('div');
        imgWrap.className = 'slide-image-wrap';
        imgWrap.style.backgroundImage = `url(${slide.url})`;
        
        // 中心座標基準の transform による絶対移動に変更
        imgWrap.style.backgroundPosition = `center`;
        imgWrap.style.backgroundSize = projectSettings.fit === 'cover' ? 'cover' : 'contain';
        imgWrap.style.transform = `translate(${slide.posX - 50}%, ${slide.posY - 50}%) scale(${slide.scale})`;
        
        track.appendChild(imgWrap);
        
        // 編集用オーバーレイの下に配置する
        previewContainer.insertBefore(track, editOverlay);

        slideStartTimes.push(currentTime);

        // Intro Animation
        const efDef = effectsDef[slide.effect];
        if(efDef) {
            masterTimeline.add( efDef.intro(track, imgWrap, slide.effectDuration), currentTime );
        } else {
            masterTimeline.set(track, {opacity: 1}, currentTime);
        }

        // Outro for previous slide if keepPrev is false
        if (!slide.keepPrev && i > 0) {
            const prevTrack = document.getElementById('track-' + (i-1));
            // Simple fade out or push out
            masterTimeline.to(prevTrack, {opacity: 0, duration: slide.effectDuration, ease:"power1.inOut"}, currentTime);
        }

        currentTime += slide.duration;
    });

    // Add a little padding at the end
    totalDuration = currentTime + 0.5;
    masterTimeline.to({}, {duration: 0.5}, currentTime); 
}

function updateProgress() {
    if(!masterTimeline) return;
    const time = masterTimeline.time();
    const progress = masterTimeline.progress();
    
    timeDisplay.textContent = `${time.toFixed(1)}s / ${totalDuration.toFixed(1)}s`;
    progressBar.style.width = `${progress * 100}%`;

    // 同期してリストのアクティブ状態を変える
    let activeIdx = 0;
    for(let i = 0; i < slideStartTimes.length; i++) {
        if(time >= slideStartTimes[i] - 0.1) activeIdx = i;
    }
    
    if(activeIdx !== currentSlideIndex && isPlaying) {
        currentSlideIndex = activeIdx;
        document.querySelectorAll('.slide-item').forEach((item, i) => item.classList.toggle('active', i === activeIdx));
        updateSettingsUI();
    }
}

progressContainer.addEventListener('click', (e) => {
    if(!masterTimeline) return;
    const rect = progressContainer.getBoundingClientRect();
    const p = (e.clientX - rect.left) / rect.width;
    masterTimeline.progress(p);
    updateProgress();
    // 再生中でなければ反映
    if(!isPlaying) {
        // Find closest index
        let activeIdx = 0;
        const time = masterTimeline.time();
        for(let i = 0; i < slideStartTimes.length; i++) {
            if(time >= slideStartTimes[i] - 0.1) activeIdx = i;
        }
        currentSlideIndex = activeIdx;
        document.querySelectorAll('.slide-item').forEach((item, i) => item.classList.toggle('active', i === activeIdx));
        updateSettingsUI();
    }
});


// --- UI Rendering ---
function renderSlideList() {
    slideListEl.innerHTML = '';
    slides.forEach((slide, index) => {
        const item = document.createElement('div');
        item.className = `slide-item ${index === currentSlideIndex ? 'active' : ''}`;
        item.dataset.index = index;
        
        item.style.height = `${50 + slide.duration * 10}px`;
        
        item.innerHTML = `
            <div class="slide-item-content">
                <i class="fa-solid fa-grip-vertical drag-handle"></i>
                <img src="${slide.url}" alt="slide">
                <div class="info">
                    <div class="name">Layer ${index + 1} ${slide.keepPrev ? '<span class="stack-badge">Stack</span>' : ''}</div>
                    <div class="dur"><i class="fa-regular fa-clock"></i> ${slide.duration.toFixed(1)}s | ${effectsDef[slide.effect]?.name || 'None'} <span style="color:var(--text-muted);font-size:0.7rem;">(${slide.effectDuration.toFixed(1)}s)</span></div>
                </div>
                <i class="fa-solid fa-trash delete-btn" title="Delete"></i>
            </div>
            <div class="resize-handle"><div class="resize-icon"></div></div>
            <div class="resize-handle-x"><div class="resize-icon-x"></div></div>
        `;

        item.addEventListener('click', (e) => {
            if(!e.target.closest('.delete-btn') && !e.target.closest('.drag-handle') && !e.target.closest('.resize-handle') && !e.target.closest('.resize-handle-x')) {
                selectSlide(index);
            }
        });

        item.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteSlide(index);
        });
        
        const handle = item.querySelector('.resize-handle');
        handle.addEventListener('mousedown', (e) => initResize(e, index, item));
        handle.addEventListener('touchstart', (e) => initResize(e, index, item), {passive: false});

        const handleX = item.querySelector('.resize-handle-x');
        handleX.addEventListener('mousedown', (e) => initResizeX(e, index, item));
        handleX.addEventListener('touchstart', (e) => initResizeX(e, index, item), {passive: false});

        slideListEl.appendChild(item);
    });

    slideCountEl.textContent = slides.length;
    updateUI();
}

function buildEffectGrid() {
    effectGrid.innerHTML = '';
    let currentCat = '';
    
    Object.keys(effectsDef).forEach(key => {
        const ef = effectsDef[key];
        
        if (ef.cat !== currentCat) {
            const catLabel = document.createElement('div');
            catLabel.className = 'category-label';
            catLabel.textContent = ef.cat;
            effectGrid.appendChild(catLabel);
            currentCat = ef.cat;
        }

        const btn = document.createElement('button');
        btn.className = 'effect-btn';
        btn.dataset.effect = key;
        btn.innerHTML = `<i class="fa-solid ${ef.icon} eff-icon"></i> <span class="eff-name">${ef.name}</span>`;
        
        btn.addEventListener('click', () => {
            if(currentSlideIndex >= 0) {
                slides[currentSlideIndex].effect = key;
                saveToLocalStorage();
                updateSettingsUI();
                renderSlideList();
                buildTimeline();
                masterTimeline.seek(slideStartTimes[currentSlideIndex]);
            }
        });

        effectGrid.appendChild(btn);
    });
}

function updateSettingsUI() {
    if (currentSlideIndex >= 0 && slides[currentSlideIndex]) {
        const slide = slides[currentSlideIndex];
        settingsArea.classList.remove('disabled');
        settingsEmpty.style.display = 'none';
        
        inputKeepPrev.checked = slide.keepPrev;

        inputDuration.value = slide.duration;
        valDuration.textContent = slide.duration.toFixed(1) + 's';
        inputTransition.value = slide.effectDuration;
        valTransition.textContent = slide.effectDuration.toFixed(1) + 's';
        
        inputScale.value = slide.scale;
        valScale.textContent = slide.scale.toFixed(1) + 'x';
        inputPosX.value = slide.posX;
        valPosX.textContent = slide.posX + '%';
        inputPosY.value = slide.posY;
        valPosY.textContent = slide.posY + '%';

        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.effect === slide.effect);
        });
    } else {
        settingsArea.classList.add('disabled');
        settingsEmpty.style.display = 'flex';
    }
}

function updateUI() {
    if (isPlaying) {
        btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
        if(editOverlay) editOverlay.style.display = 'none';
    } else {
        btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
        if(editOverlay) {
            updateEditOverlayPosition();
        }
    }
    btnLoop.classList.toggle('active', isLooping);
}

function applyProjectSettings() {
    previewContainer.className = `preview-container ratio-${projectSettings.ratio}`;
    document.querySelectorAll('#ratio-group .radio-label').forEach(l => l.classList.toggle('active', l.dataset.ratio === projectSettings.ratio));
    document.querySelectorAll('#fit-group .radio-label').forEach(l => l.classList.toggle('active', l.dataset.fit === projectSettings.fit));
    buildTimeline();
    if(masterTimeline && currentSlideIndex >= 0) masterTimeline.seek(slideStartTimes[currentSlideIndex]);
    updateEditOverlayPosition();
}

// --- Actions ---
function selectSlide(index, force=false) {
    if(!force && index === currentSlideIndex) return;
    if(index < 0 || index >= slides.length) return;
    if(isPlaying) togglePlay();

    currentSlideIndex = index;
    document.querySelectorAll('.slide-item').forEach((item, i) => item.classList.toggle('active', i === index));
    
    updateSettingsUI();
    updateUI();
    
    // タイムラインをシーク
    if(masterTimeline) {
        masterTimeline.seek(slideStartTimes[index]);
    }
}

function deleteSlide(index) {
    if(isPlaying) togglePlay();
    slides.splice(index, 1);
    saveToLocalStorage();
    
    if (slides.length === 0) currentSlideIndex = -1;
    else if (currentSlideIndex >= slides.length) currentSlideIndex = slides.length - 1;
    
    renderSlideList();
    buildTimeline();
    if(slides.length > 0 && currentSlideIndex >= 0) selectSlide(currentSlideIndex, true);
    else { updateUI(); updateSettingsUI(); }
}

function togglePlay() {
    if(slides.length === 0 || !masterTimeline) return;
    if(isPlaying) {
        masterTimeline.pause();
        isPlaying = false;
    } else {
        if(masterTimeline.progress() === 1) masterTimeline.restart();
        else masterTimeline.play();
        isPlaying = true;
    }
    updateUI();
}

function stopSlideshow() {
    if(!masterTimeline) return;
    masterTimeline.pause();
    masterTimeline.seek(0);
    isPlaying = false;
    selectSlide(0, true);
}

function manualNext() {
    if(slides.length <= 1) return;
    let nextIndex = currentSlideIndex + 1;
    if(nextIndex >= slides.length) nextIndex = 0;
    selectSlide(nextIndex);
}

function manualPrev() {
    if(slides.length <= 1) return;
    let prevIndex = currentSlideIndex - 1;
    if(prevIndex < 0) prevIndex = slides.length - 1;
    selectSlide(prevIndex);
}

// --- Settings Events ---
inputKeepPrev.addEventListener('change', (e) => {
    if(currentSlideIndex >= 0) {
        slides[currentSlideIndex].keepPrev = e.target.checked;
        saveToLocalStorage();
        renderSlideList();
        buildTimeline();
        masterTimeline.seek(slideStartTimes[currentSlideIndex]);
    }
});

inputDuration.addEventListener('input', (e) => {
    if(currentSlideIndex >= 0) {
        slides[currentSlideIndex].duration = parseFloat(e.target.value);
        valDuration.textContent = slides[currentSlideIndex].duration.toFixed(1) + 's';
        renderSlideList();
    }
});
inputDuration.addEventListener('change', () => {
    saveToLocalStorage();
    buildTimeline();
    masterTimeline.seek(slideStartTimes[currentSlideIndex]);
});

inputTransition.addEventListener('input', (e) => {
    if(currentSlideIndex >= 0) {
        slides[currentSlideIndex].effectDuration = parseFloat(e.target.value);
        valTransition.textContent = slides[currentSlideIndex].effectDuration.toFixed(1) + 's';
        const item = slideListEl.children[currentSlideIndex];
        if(item) item.querySelector('.dur').innerHTML = `<i class="fa-regular fa-clock"></i> ${slides[currentSlideIndex].duration.toFixed(1)}s | ${effectsDef[slides[currentSlideIndex].effect]?.name || 'None'} <span style="color:var(--text-muted);font-size:0.7rem;">(${slides[currentSlideIndex].effectDuration.toFixed(1)}s)</span>`;
    }
});
inputTransition.addEventListener('change', () => {
    saveToLocalStorage();
    buildTimeline();
    masterTimeline.seek(slideStartTimes[currentSlideIndex]);
});

function handleTransformChange(prop, valStr) {
    if(currentSlideIndex < 0) return;
    const slide = slides[currentSlideIndex];
    slide[prop] = parseFloat(valStr);
    
    if(prop === 'scale') valScale.textContent = slide[prop].toFixed(1) + 'x';
    if(prop === 'posX') valPosX.textContent = slide[prop] + '%';
    if(prop === 'posY') valPosY.textContent = slide[prop] + '%';

    // リアルタイム反映
    const track = document.getElementById('track-' + currentSlideIndex);
    if(track) {
        const imgWrap = track.querySelector('.slide-image-wrap');
        if(imgWrap) {
            imgWrap.style.transform = `translate(${slide.posX - 50}%, ${slide.posY - 50}%) scale(${slide.scale})`;
        }
    }
    if(!isPlaying) updateEditOverlayPosition();
}
inputScale.addEventListener('input', (e) => handleTransformChange('scale', e.target.value));
inputScale.addEventListener('change', () => saveToLocalStorage());
inputPosX.addEventListener('input', (e) => handleTransformChange('posX', e.target.value));
inputPosX.addEventListener('change', () => saveToLocalStorage());
inputPosY.addEventListener('input', (e) => handleTransformChange('posY', e.target.value));
inputPosY.addEventListener('change', () => saveToLocalStorage());


// --- Preview Drag Edit Events ---
let isDraggingPos = false;
let isDraggingScale = false;
let editStartX, editStartY;
let initialPosX, initialPosY, initialScale;

// 編集枠を画像にぴったり合わせる計算
function updateEditOverlayPosition() {
    if (currentSlideIndex < 0 || !slides[currentSlideIndex] || isPlaying) {
        if(editOverlay) editOverlay.style.display = 'none';
        return;
    }

    const slide = slides[currentSlideIndex];
    const img = new Image();
    img.onload = () => {
        if(currentSlideIndex < 0 || slides[currentSlideIndex].id !== slide.id) return;

        const cw = previewContainer.clientWidth;
        const ch = previewContainer.clientHeight;
        const iw = img.width;
        const ih = img.height;

        let ratio = projectSettings.fit === 'cover' ? Math.max(cw / iw, ch / ih) : Math.min(cw / iw, ch / ih);

        const baseW = iw * ratio;
        const baseH = ih * ratio;

        const moveX = cw * ((slide.posX - 50) / 100);
        const moveY = ch * ((slide.posY - 50) / 100);

        editOverlay.style.width = `${baseW}px`;
        editOverlay.style.height = `${baseH}px`;
        editOverlay.style.left = `${(cw - baseW) / 2}px`;
        editOverlay.style.top = `${(ch - baseH) / 2}px`;
        editOverlay.style.transformOrigin = `center center`;
        editOverlay.style.transform = `translate(${moveX}px, ${moveY}px) scale(${slide.scale})`;
        editOverlay.style.display = 'block';

        if(scaleHandle) {
            scaleHandle.style.transform = `scale(${1 / slide.scale})`;
        }
    };
    img.src = slide.url;
}

function getClientPos(e) {
    if(e.type.includes('touch')) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
}

function initEditDrag(e) {
    if(currentSlideIndex < 0 || isPlaying) return;
    
    const pos = getClientPos(e);
    editStartX = pos.x;
    editStartY = pos.y;
    
    const slide = slides[currentSlideIndex];
    initialPosX = slide.posX;
    initialPosY = slide.posY;
    initialScale = slide.scale;
    
    if (e.target === scaleHandle || e.target.closest('#scale-handle')) {
        isDraggingScale = true;
    } else {
        isDraggingPos = true;
    }
    
    if(e.type !== 'touchstart') e.preventDefault();
    
    document.addEventListener('mousemove', onEditDrag);
    document.addEventListener('mouseup', stopEditDrag);
    document.addEventListener('touchmove', onEditDrag, {passive: false});
    document.addEventListener('touchend', stopEditDrag);
}

function onEditDrag(e) {
    if (!isDraggingPos && !isDraggingScale) return;
    if(e.type === 'touchmove') e.preventDefault();
    
    const pos = getClientPos(e);
    let dx = pos.x - editStartX;
    let dy = pos.y - editStartY;
    
    if (isDraggingPos) {
        let rect = previewContainer.getBoundingClientRect();
        // コンテナサイズ基準のパーセント移動量
        let sensX = (dx / rect.width) * 100;
        let sensY = (dy / rect.height) * 100;
        
        let newPosX = initialPosX + sensX;
        let newPosY = initialPosY + sensY;
        
        newPosX = Math.max(-500, Math.min(600, Math.round(newPosX)));
        newPosY = Math.max(-500, Math.min(600, Math.round(newPosY)));
        
        handleTransformChange('posX', newPosX);
        handleTransformChange('posY', newPosY);
        
        inputPosX.value = newPosX;
        inputPosY.value = newPosY;
        
    } else if (isDraggingScale) {
        let diff = dx - dy;
        let newScale = initialScale + diff * 0.005;
        
        newScale = Math.max(0.1, Math.min(3.0, newScale));
        newScale = Math.round(newScale * 10) / 10;
        
        handleTransformChange('scale', newScale);
        inputScale.value = newScale;
    }
}

function stopEditDrag() {
    isDraggingPos = false;
    isDraggingScale = false;
    
    document.removeEventListener('mousemove', onEditDrag);
    document.removeEventListener('mouseup', stopEditDrag);
    document.removeEventListener('touchmove', onEditDrag);
    document.removeEventListener('touchmove', preventDefaultTouchMove, {passive: false});
    document.removeEventListener('touchend', stopEditDrag);
    
    saveToLocalStorage();
}

function preventDefaultTouchMove(e) {
    if (isDraggingPos || isDraggingScale) {
        e.preventDefault();
    }
}

// --- Event Listeners Setup ---
function setupEvents() {
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            tabContents.forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    btnMagicAnimate.addEventListener('click', () => {
        if(slides.length === 0) return;
        const keys = Object.keys(effectsDef);
        slides.forEach((slide, i) => {
            slide.effect = keys[Math.floor(Math.random() * keys.length)];
            slide.keepPrev = false; // マジックアニメーション時もOFFベースにする
        });
        saveToLocalStorage();
        renderSlideList();
        buildTimeline();
        updateSettingsUI();
        
        const originalHtml = btnMagicAnimate.innerHTML;
        btnMagicAnimate.innerHTML = '<i class="fa-solid fa-check"></i> 適用完了！';
        setTimeout(() => {
            btnMagicAnimate.innerHTML = originalHtml;
        }, 1000);

        selectSlide(0, true);
        if (!isPlaying) {
            togglePlay();
        } else {
            masterTimeline.play();
        }
    });

    document.querySelectorAll('#ratio-group .radio-label').forEach(label => {
        label.addEventListener('click', () => {
            if (projectSettings.ratio === label.dataset.ratio) return;
            projectSettings.ratio = label.dataset.ratio;
            saveToLocalStorage();
            applyProjectSettings();
        });
    });

    document.querySelectorAll('#fit-group .radio-label').forEach(label => {
        label.addEventListener('click', () => {
            if (projectSettings.fit === label.dataset.fit) return;
            projectSettings.fit = label.dataset.fit;
            saveToLocalStorage();
            applyProjectSettings();
        });
    });

    // 動画エクスポート処理
    btnExportVideo.addEventListener('click', () => {
        if (slides.length === 0 || !masterTimeline) {
            showMessage("保存するスライドを追加してください", "error");
            return;
        }

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
            showConfirmModal("モバイル端末での保存", "スマートフォンブラウザでは直接の動画保存機能がサポートされていません。<br><br>「OK」を押してフルスクリーン再生を開始し、<strong>OS標準の「画面録画」機能</strong>を使用して動画を保存してください。", () => {
                if (!document.fullscreenElement) {
                    previewContainer.requestFullscreen().then(() => {
                        setTimeout(() => togglePlay(), 500); // 少し待ってから再生
                    }).catch(e => console.error(e));
                }
            });
            return;
        }

        // --- 画面録画の例外処理 (iframe などで拒否される場合への対策) ---
        navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, audio: false })
            .then(stream => {
                const wasLooping = isLooping;
                isLooping = false; // 録画用にループを一時停止
                updateUI();

                let enterFullscreen = Promise.resolve();
                if (!document.fullscreenElement) {
                    enterFullscreen = previewContainer.requestFullscreen();
                }

                enterFullscreen.then(() => {
                    // フルスクリーン化のアニメーション完了を待機
                    setTimeout(() => {
                        let mimeType = 'video/webm;codecs=vp9';
                        if (MediaRecorder.isTypeSupported('video/mp4')) {
                            mimeType = 'video/mp4';
                        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
                            mimeType = 'video/webm;codecs=h264';
                        }

                        const recorder = new MediaRecorder(stream, { mimeType: mimeType });
                        const chunks = [];

                        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

                        recorder.onstop = () => {
                            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                            const blob = new Blob(chunks, { type: mimeType });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `proslide_reel.${ext}`;
                            a.click();
                            URL.revokeObjectURL(url);
                            
                            // 共有トラックを停止
                            stream.getTracks().forEach(track => track.stop());
                            
                            if (document.fullscreenElement) document.exitFullscreen();
                            
                            isLooping = wasLooping;
                            updateUI();
                            showMessage("動画の保存が完了しました！");
                        };

                        // 録画と再生を開始
                        recorder.start();
                        masterTimeline.restart();

                        // タイムライン完了時に録画を停止するようフック
                        const originalOnComplete = masterTimeline.eventCallback("onComplete");
                        masterTimeline.eventCallback("onComplete", () => {
                            if (recorder.state !== 'inactive') {
                                recorder.stop();
                            }
                            // コールバックを元に戻す
                            masterTimeline.eventCallback("onComplete", originalOnComplete);
                            if(originalOnComplete) originalOnComplete();
                        });
                    }, 1000);
                }).catch(err => {
                    console.error("Fullscreen error:", err);
                    stream.getTracks().forEach(track => track.stop());
                    showMessage("フルスクリーン表示に失敗しました", "error");
                });

            })
            .catch(err => {
                console.error("録画エラー:", err);
                
                // 権限エラーやIframeによるブロックの場合のフォールバック表示
                if (err.name === "NotAllowedError" || err.name === "SecurityError") {
                     showConfirmModal("画面録画の権限がありません", "このブラウザ環境（または埋め込み表示内）では、自動の動画保存機能がブロックされています。<br><br>「OK」を押してフルスクリーン再生を開始し、<strong>OSやブラウザ拡張機能の画面録画ツール</strong>を使用して手動で録画してください。", () => {
                        if (!document.fullscreenElement) {
                            previewContainer.requestFullscreen().then(() => {
                                setTimeout(() => togglePlay(), 500); // 少し待ってから再生
                            }).catch(e => console.error(e));
                        }
                    });
                } else {
                     showMessage("録画を開始できませんでした", "error");
                }
            });
    });

    btnPlay.addEventListener('click', togglePlay);
    btnStop.addEventListener('click', stopSlideshow);
    btnNext.addEventListener('click', manualNext);
    btnPrev.addEventListener('click', manualPrev);
    btnLoop.addEventListener('click', () => { isLooping = !isLooping; updateUI(); });
    btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) previewContainer.requestFullscreen().catch(e=>console.error(e));
        else document.exitFullscreen();
    });
    
    window.addEventListener('resize', updateEditOverlayPosition);

    // Preview Drag Events
    editOverlay.addEventListener('mousedown', initEditDrag);
    editOverlay.addEventListener('touchstart', initEditDrag, {passive: false});

    sortableInstance = new Sortable(slideListEl, {
        animation: 150, handle: '.drag-handle',
        onEnd: (evt) => {
            if(isPlaying) togglePlay();
            const item = slides.splice(evt.oldIndex, 1)[0];
            slides.splice(evt.newIndex, 0, item);
            
            if (currentSlideIndex === evt.oldIndex) currentSlideIndex = evt.newIndex;
            else if (currentSlideIndex > evt.oldIndex && currentSlideIndex <= evt.newIndex) currentSlideIndex--;
            else if (currentSlideIndex < evt.oldIndex && currentSlideIndex >= evt.newIndex) currentSlideIndex++;
            
            saveToLocalStorage();
            renderSlideList();
            buildTimeline();
            selectSlide(currentSlideIndex, true);
        }
    });

    document.addEventListener('keydown', (e) => {
        if(e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault(); togglePlay();
        }
        if(e.code === 'ArrowRight' && e.target.tagName !== 'TEXTAREA') manualNext();
        if(e.code === 'ArrowLeft' && e.target.tagName !== 'TEXTAREA') manualPrev();
    });
}

// Start app
window.onload = init;

</script>
</body>
</html>
