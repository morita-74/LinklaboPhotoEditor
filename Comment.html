const App = () => {
  // 初期値を「鶴」に設定
  const [prompt, setPrompt] = useState('鶴');
  const [generatedImages, setGeneratedImages] = useState([]);
  const [selectedIndex, setSelectedIndex] = useState(0);
  const [isLoading, setIsLoading] = useState(false);
  const [error, setError] = useState('');

  // ユーザーの入力に基づき、白地に黒のデザインを強制するスタイルを追加
  const enhancePrompt = (userInput) => {
    const styleKeywords = "minimalist black ink drawing on pure white background, high contrast line art, vector style, clean lines, sketch, monochrome, no colors, professional graphic design logo style";
    return `${styleKeywords}, ${userInput}`;
  };

  const handleGenerate = async () => {
    if (!prompt.trim()) return;

    setIsLoading(true);
    setError('');
    setGeneratedImages([]);
    setSelectedIndex(0);

    try {
      // システム指示に従い、環境からAPIキーを取得
      const apiKey = ""; 
      const fullPrompt = enhancePrompt(prompt);

      const response = await fetch(
        `/api/ai`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            instances: [
              { prompt: fullPrompt }
            ],
            parameters: {
              sampleCount: 3,
              aspectRatio: "1:1" 
            }
          }),
        }
      );

      if (!response.ok) {
        throw new Error('画像の生成に失敗しました。もう一度お試しください。');
      }

      const result = await response.json();
      
      if (result.predictions && result.predictions.length > 0) {
        const images = result.predictions.map(
          pred => `data:image/png;base64,${pred.bytesBase64Encoded}`
        );
        setGeneratedImages(images);
        setSelectedIndex(0);
      } else {
        throw new Error('画像データを受け取れませんでした。');
      }

    } catch (err) {
      console.error(err);
      setError(err.message || '予期せぬエラーが発生しました。');
    } finally {
      setIsLoading(false);
    }
  };

  // ダウンロード処理を改善
  const handleDownload = () => {
    if (generatedImages.length === 0) return;

    try {
      const dataUrl = generatedImages[selectedIndex];
      // Base64データをバイナリデータ(Blob)に変換してダウンロードURLを生成
      // これによりブラウザの互換性が向上します
      const bin = atob(dataUrl.split(',')[1]);
      const buffer = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        buffer[i] = bin.charCodeAt(i);
      }
      const blob = new Blob([buffer], { type: 'image/png' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = `monosketch-${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error('Download failed:', err);
      // フォールバック: 従来の方法
      const link = document.createElement('a');
      link.href = generatedImages[selectedIndex];
      link.download = `monosketch-${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  };

  return (
    <div className="min-h-screen bg-neutral-100 font-sans text-neutral-800 p-4 md:p-8">
      <div className="max-w-4xl mx-auto space-y-6">
        
        {/* Header */}
        <header className="flex items-center justify-between pb-6 border-b border-neutral-200">
          <div>
            <h1 className="text-3xl font-bold tracking-tight text-black flex items-center gap-2">
              <Wand2 className="w-8 h-8" />
              MonoSketch AI
            </h1>
            <p className="text-neutral-500 mt-1">
              コメントから白黒のデザインを生成するスタジオ
            </p>
          </div>
          <div className="hidden md:block text-xs bg-neutral-200 px-3 py-1 rounded-full">
            Powered by Imagen 4
          </div>
        </header>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
          
          {/* Controls Section */}
          <div className="space-y-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
              <label className="block text-sm font-medium mb-2 text-neutral-700">
                デザインのアイデアを入力
              </label>
              <textarea
                value={prompt}
                onChange={(e) => setPrompt(e.target.value)}
                placeholder="例：月、翼を広げた鷲、幾何学的な模様..."
                className="w-full h-32 p-4 rounded-xl border border-neutral-200 focus:border-black focus:ring-1 focus:ring-black outline-none resize-none transition-all bg-neutral-50"
              />
              <div className="mt-4 flex gap-3">
                <button
                  onClick={handleGenerate}
                  disabled={isLoading || !prompt.trim()}
                  className="flex-1 bg-black text-white px-6 py-3 rounded-xl font-medium hover:bg-neutral-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2 shadow-lg shadow-neutral-200/50"
                >
                  {isLoading ? (
                    <>
                      <Loader2 className="w-5 h-5 animate-spin" />
                      生成中...
                    </>
                  ) : (
                    <>
                      <Wand2 className="w-5 h-5" />
                      3パターン生成
                    </>
                  )}
                </button>
                <button
                  onClick={() => {
                    setPrompt('');
                    setGeneratedImages([]);
                    setSelectedIndex(0);
                  }}
                  disabled={isLoading || (!prompt && generatedImages.length === 0)}
                  className="px-4 py-3 rounded-xl border border-neutral-200 hover:bg-neutral-50 text-neutral-600 transition-colors"
                  title="クリア"
                >
                  <Eraser className="w-5 h-5" />
                </button>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
              <h3 className="font-medium mb-3 flex items-center gap-2">
                <ImageIcon className="w-4 h-4" />
                スタイルの特徴
              </h3>
              <ul className="text-sm text-neutral-600 space-y-2 list-disc list-inside">
                <li>純粋な白背景（#FFFFFF）</li>
                <li>高コントラストな黒インク（#000000）</li>
                <li>一度に3つのバリエーションを提案</li>
                <li>Nanobanana Proの代替としてImagen 4を使用</li>
              </ul>
            </div>
          </div>

          {/* Preview Section */}
          <div className="space-y-4">
            {/* Main Preview */}
            <div className="relative">
              <div className="aspect-square w-full bg-white rounded-2xl shadow-lg border border-neutral-200 overflow-hidden flex items-center justify-center relative group">
                
                {generatedImages.length > 0 ? (
                  <>
                    <img
                      src={generatedImages[selectedIndex]}
                      alt={`Generated Design ${selectedIndex + 1}`}
                      className="w-full h-full object-contain p-8 transition-transform duration-500"
                    />
                    <div className="absolute top-4 left-4 bg-black/10 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-black/70">
                      Preview {selectedIndex + 1} / {generatedImages.length}
                    </div>
                  </>
                ) : (
                  <div className="text-center p-8">
                    <div className="w-24 h-24 bg-neutral-100 rounded-full mx-auto flex items-center justify-center mb-4">
                      {isLoading ? (
                        <Loader2 className="w-10 h-10 text-neutral-400 animate-spin" />
                      ) : (
                        <ImageIcon className="w-10 h-10 text-neutral-300" />
                      )}
                    </div>
                    <p className="text-neutral-400 font-medium">
                      {isLoading ? '3つの案を描いています...' : 'ここにプレビューが表示されます'}
                    </p>
                  </div>
                )}

                {/* Action Overlay */}
                {generatedImages.length > 0 && !isLoading && (
                  <div className="absolute bottom-4 right-4 flex flex-col items-end gap-2">
                    <button
                      onClick={handleDownload}
                      className="bg-black text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg hover:bg-neutral-800 transition-transform active:scale-95 flex items-center gap-2"
                    >
                      <Download className="w-4 h-4" />
                      PNG保存
                    </button>
                  </div>
                )}
              </div>
              {generatedImages.length > 0 && (
                 <p className="text-right text-[10px] text-neutral-400 mt-1 px-1">
                   ※ボタンで保存できない場合は画像を長押ししてください
                 </p>
              )}
            </div>

            {/* Thumbnails */}
            {generatedImages.length > 0 && (
              <div className="grid grid-cols-3 gap-3">
                {generatedImages.map((img, idx) => (
                  <button
                    key={idx}
                    onClick={() => setSelectedIndex(idx)}
                    className={`
                      relative aspect-square rounded-xl overflow-hidden border-2 transition-all
                      ${selectedIndex === idx 
                        ? 'border-black ring-2 ring-black/10 shadow-md scale-105 z-10' 
                        : 'border-transparent hover:border-neutral-300 opacity-70 hover:opacity-100'}
                    `}
                  >
                    <img
                      src={img}
                      alt={`Thumbnail ${idx + 1}`}
                      className="w-full h-full object-contain bg-white p-2"
                    />
                    {selectedIndex === idx && (
                      <div className="absolute inset-0 bg-black/5 flex items-center justify-center">
                        <div className="bg-white rounded-full p-1 shadow-sm">
                          <Check className="w-4 h-4 text-black" />
                        </div>
                      </div>
                    )}
                  </button>
                ))}
              </div>
            )}
            
            {/* Error Message */}
            {error && (
              <div className="mt-4 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100">
                {error}
              </div>
            )}
            
            {/* Disclaimer */}
            <p className="text-center text-xs text-neutral-400 mt-4">
              ※ 生成される画像はAIによるものです。商用利用の際は各モデルの利用規約をご確認ください。
            </p>
          </div>
        </div>
      </div>
    </div>
  );
};

export default App;

    } catch (err) {
      console.error(err);
      setError(err.message || '予期せぬエラーが発生しました。');
    } finally {
      setIsLoading(false);
    }
  };

  // ダウンロード処理を改善
  const handleDownload = () => {
    if (generatedImages.length === 0) return;

    try {
      const dataUrl = generatedImages[selectedIndex];
      // Base64データをバイナリデータ(Blob)に変換してダウンロードURLを生成
      // これによりブラウザの互換性が向上します
      const bin = atob(dataUrl.split(',')[1]);
      const buffer = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        buffer[i] = bin.charCodeAt(i);
      }
      const blob = new Blob([buffer], { type: 'image/png' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = `monosketch-${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error('Download failed:', err);
      // フォールバック: 従来の方法
      const link = document.createElement('a');
      link.href = generatedImages[selectedIndex];
      link.download = `monosketch-${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  };

  return (
    <div className="min-h-screen bg-neutral-100 font-sans text-neutral-800 p-4 md:p-8">
      <div className="max-w-4xl mx-auto space-y-6">
        
        {/* Header */}
        <header className="flex items-center justify-between pb-6 border-b border-neutral-200">
          <div>
            <h1 className="text-3xl font-bold tracking-tight text-black flex items-center gap-2">
              <Wand2 className="w-8 h-8" />
              MonoSketch AI
            </h1>
            <p className="text-neutral-500 mt-1">
              コメントから白黒のデザインを生成するスタジオ
            </p>
          </div>
          <div className="hidden md:block text-xs bg-neutral-200 px-3 py-1 rounded-full">
            Powered by Imagen 4
          </div>
        </header>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
          
          {/* Controls Section */}
          <div className="space-y-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
              <label className="block text-sm font-medium mb-2 text-neutral-700">
                デザインのアイデアを入力
              </label>
              <textarea
                value={prompt}
                onChange={(e) => setPrompt(e.target.value)}
                placeholder="例：月、翼を広げた鷲、幾何学的な模様..."
                className="w-full h-32 p-4 rounded-xl border border-neutral-200 focus:border-black focus:ring-1 focus:ring-black outline-none resize-none transition-all bg-neutral-50"
              />
              <div className="mt-4 flex gap-3">
                <button
                  onClick={handleGenerate}
                  disabled={isLoading || !prompt.trim()}
                  className="flex-1 bg-black text-white px-6 py-3 rounded-xl font-medium hover:bg-neutral-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2 shadow-lg shadow-neutral-200/50"
                >
                  {isLoading ? (
                    <>
                      <Loader2 className="w-5 h-5 animate-spin" />
                      生成中...
                    </>
                  ) : (
                    <>
                      <Wand2 className="w-5 h-5" />
                      3パターン生成
                    </>
                  )}
                </button>
                <button
                  onClick={() => {
                    setPrompt('');
                    setGeneratedImages([]);
                    setSelectedIndex(0);
                  }}
                  disabled={isLoading || (!prompt && generatedImages.length === 0)}
                  className="px-4 py-3 rounded-xl border border-neutral-200 hover:bg-neutral-50 text-neutral-600 transition-colors"
                  title="クリア"
                >
                  <Eraser className="w-5 h-5" />
                </button>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
              <h3 className="font-medium mb-3 flex items-center gap-2">
                <ImageIcon className="w-4 h-4" />
                スタイルの特徴
              </h3>
              <ul className="text-sm text-neutral-600 space-y-2 list-disc list-inside">
                <li>純粋な白背景（#FFFFFF）</li>
                <li>高コントラストな黒インク（#000000）</li>
                <li>一度に3つのバリエーションを提案</li>
                <li>Nanobanana Proの代替としてImagen 4を使用</li>
              </ul>
            </div>
          </div>

          {/* Preview Section */}
          <div className="space-y-4">
            {/* Main Preview */}
            <div className="relative">
              <div className="aspect-square w-full bg-white rounded-2xl shadow-lg border border-neutral-200 overflow-hidden flex items-center justify-center relative group">
                
                {generatedImages.length > 0 ? (
                  <>
                    <img
                      src={generatedImages[selectedIndex]}
                      alt={`Generated Design ${selectedIndex + 1}`}
                      className="w-full h-full object-contain p-8 transition-transform duration-500"
                    />
                    <div className="absolute top-4 left-4 bg-black/10 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-black/70">
                      Preview {selectedIndex + 1} / {generatedImages.length}
                    </div>
                  </>
                ) : (
                  <div className="text-center p-8">
                    <div className="w-24 h-24 bg-neutral-100 rounded-full mx-auto flex items-center justify-center mb-4">
                      {isLoading ? (
                        <Loader2 className="w-10 h-10 text-neutral-400 animate-spin" />
                      ) : (
                        <ImageIcon className="w-10 h-10 text-neutral-300" />
                      )}
                    </div>
                    <p className="text-neutral-400 font-medium">
                      {isLoading ? '3つの案を描いています...' : 'ここにプレビューが表示されます'}
                    </p>
                  </div>
                )}

                {/* Action Overlay */}
                {generatedImages.length > 0 && !isLoading && (
                  <div className="absolute bottom-4 right-4 flex flex-col items-end gap-2">
                    <button
                      onClick={handleDownload}
                      className="bg-black text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg hover:bg-neutral-800 transition-transform active:scale-95 flex items-center gap-2"
                    >
                      <Download className="w-4 h-4" />
                      PNG保存
                    </button>
                  </div>
                )}
              </div>
              {generatedImages.length > 0 && (
                 <p className="text-right text-[10px] text-neutral-400 mt-1 px-1">
                   ※ボタンで保存できない場合は画像を長押ししてください
                 </p>
              )}
            </div>

            {/* Thumbnails */}
            {generatedImages.length > 0 && (
              <div className="grid grid-cols-3 gap-3">
                {generatedImages.map((img, idx) => (
                  <button
                    key={idx}
                    onClick={() => setSelectedIndex(idx)}
                    className={`
                      relative aspect-square rounded-xl overflow-hidden border-2 transition-all
                      ${selectedIndex === idx 
                        ? 'border-black ring-2 ring-black/10 shadow-md scale-105 z-10' 
                        : 'border-transparent hover:border-neutral-300 opacity-70 hover:opacity-100'}
                    `}
                  >
                    <img
                      src={img}
                      alt={`Thumbnail ${idx + 1}`}
                      className="w-full h-full object-contain bg-white p-2"
                    />
                    {selectedIndex === idx && (
                      <div className="absolute inset-0 bg-black/5 flex items-center justify-center">
                        <div className="bg-white rounded-full p-1 shadow-sm">
                          <Check className="w-4 h-4 text-black" />
                        </div>
                      </div>
                    )}
                  </button>
                ))}
              </div>
            )}
            
            {/* Error Message */}
            {error && (
              <div className="mt-4 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100">
                {error}
              </div>
            )}
            
            {/* Disclaimer */}
            <p className="text-center text-xs text-neutral-400 mt-4">
              ※ 生成される画像はAIによるものです。商用利用の際は各モデルの利用規約をご確認ください。
            </p>
          </div>
        </div>
      </div>
    </div>
  );
};

export default App;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
