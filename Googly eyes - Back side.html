const ImageDropzone = ({ label, image, onImageChange }) => {
  const [isDragging, setIsDragging] = useState(false);
  const fileInputRef = useRef(null);

  const handleDragOver = (e) => {
    e.preventDefault();
    setIsDragging(true);
  };

  const handleDragLeave = () => {
    setIsDragging(false);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      processFile(file);
    }
  };

  const handleClick = () => {
    fileInputRef.current.click();
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (file) {
      processFile(file);
    }
  };

  const processFile = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      // "data:image/png;base64,..." の形式をパース
      const fullData = e.target.result;
      const base64Data = fullData.split(',')[1];
      onImageChange({
        preview: fullData,
        base64: base64Data,
        mimeType: file.type
      });
    };
    reader.readAsDataURL(file);
  };

  return (
    <div className="flex flex-col items-center">
      <span className="mb-2 font-bold text-gray-700">{label}</span>
      <div
        className={`w-full max-w-xs aspect-square border-2 border-dashed rounded-xl flex flex-col items-center justify-center cursor-pointer transition-colors overflow-hidden relative ${
          isDragging ? 'border-blue-500 bg-blue-50' : 'border-gray-300 bg-gray-50 hover:bg-gray-100'
        }`}
        onDragOver={handleDragOver}
        onDragLeave={handleDragLeave}
        onDrop={handleDrop}
        onClick={handleClick}
      >
        <input
          type="file"
          accept="image/*"
          className="hidden"
          ref={fileInputRef}
          onChange={handleFileChange}
        />
        {image ? (
          <img src={image.preview} alt={label} className="w-full h-full object-contain p-2" />
        ) : (
          <div className="text-center p-4">
            <svg className="w-8 h-8 mx-auto text-gray-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p className="text-sm text-gray-500">タップまたは<br/>ドラッグ＆ドロップ</p>
          </div>
        )}
      </div>
      {image && (
        <button
          onClick={() => onImageChange(null)}
          className="mt-2 text-sm text-red-500 hover:text-red-700"
        >
          クリア
        </button>
      )}
    </div>
  );
};

function App() {
  const [image1, setImage1] = useState(null);
  const [originalImage, setOriginalImage] = useState(null);
  const [silhouetteImage, setSilhouetteImage] = useState(null);
  const [resultImage, setResultImage] = useState(null);
  const [isGenerating, setIsGenerating] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');

  const applyMask = async (generatedBase64, silhouetteDataUrl) => {
    return new Promise((resolve) => {
      const genImg = new Image();
      const silImg = new Image();
      
      genImg.onload = () => {
        silImg.onload = () => {
          const w = silImg.width;
          const h = silImg.height;
          
          // 1. シルエットのバウンディングボックスを取得
          const silCanvas = document.createElement('canvas');
          silCanvas.width = w; silCanvas.height = h;
          const silCtx = silCanvas.getContext('2d');
          silCtx.drawImage(silImg, 0, 0, w, h);
          const silData = silCtx.getImageData(0, 0, w, h).data;
          
          let silMinX = w, silMinY = h, silMaxX = 0, silMaxY = 0;
          const isBody = new Uint8Array(w * h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = y * w + x;
              // 黒(128未満)を本体とする
              if (silData[idx * 4] < 128) {
                isBody[idx] = 1;
                if (x < silMinX) silMinX = x;
                if (x > silMaxX) silMaxX = x;
                if (y < silMinY) silMinY = y;
                if (y > silMaxY) silMaxY = y;
              }
            }
          }

          // 2. 生成画像のバウンディングボックスを取得
          const genCanvas = document.createElement('canvas');
          const gw = genImg.width;
          const gh = genImg.height;
          genCanvas.width = gw; genCanvas.height = gh;
          const genCtx = genCanvas.getContext('2d');
          genCtx.fillStyle = 'white';
          genCtx.fillRect(0, 0, gw, gh);
          genCtx.drawImage(genImg, 0, 0, gw, gh);
          const genRawData = genCtx.getImageData(0, 0, gw, gh).data;

          let genMinX = gw, genMinY = gh, genMaxX = 0, genMaxY = 0;
          for (let y = 0; y < gh; y++) {
            for (let x = 0; x < gw; x++) {
              const idx4 = (y * gw + x) * 4;
              // 黒っぽい線(200未満)を見つける
              if (genRawData[idx4] < 200 && genRawData[idx4+1] < 200 && genRawData[idx4+2] < 200) {
                if (x < genMinX) genMinX = x;
                if (x > genMaxX) genMaxX = x;
                if (y < genMinY) genMinY = y;
                if (y > genMaxY) genMaxY = y;
              }
            }
          }

          // バウンディングボックスが無効な場合は全体を使用
          if (genMinX > genMaxX) {
            genMinX = 0; genMaxX = gw - 1; genMinY = 0; genMaxY = gh - 1;
          }
          if (silMinX > silMaxX) {
            silMinX = 0; silMaxX = w - 1; silMinY = 0; silMaxY = h - 1;
          }

          const genBBoxW = genMaxX - genMinX + 1;
          const genBBoxH = genMaxY - genMinY + 1;
          const silBBoxW = silMaxX - silMinX + 1;
          const silBBoxH = silMaxY - silMinY + 1;

          // 3. フィットさせて描画するキャンバスを作成
          const finalCanvas = document.createElement('canvas');
          finalCanvas.width = w;
          finalCanvas.height = h;
          const finalCtx = finalCanvas.getContext('2d');
          
          // 全体を白で塗りつぶす
          finalCtx.fillStyle = 'white';
          finalCtx.fillRect(0, 0, w, h);

          // 生成画像のうち描画されている部分(BBox)を、シルエットのBBoxに引き伸ばして描画
          finalCtx.drawImage(
            genImg, 
            genMinX, genMinY, genBBoxW, genBBoxH, // 切り出し元
            silMinX, silMinY, silBBoxW, silBBoxH  // 描画先
          );

          const finalData = finalCtx.getImageData(0, 0, w, h);

          const outlineThickness = 3; // 輪郭線の太さ

          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = y * w + x;
              const idx4 = idx * 4;

              if (isBody[idx] === 0) {
                // 背景部分は強制的に白
                finalData.data[idx4] = 255;
                finalData.data[idx4+1] = 255;
                finalData.data[idx4+2] = 255;
                finalData.data[idx4+3] = 255;
              } else {
                // 本体部分。周囲に背景があれば境界線として黒くする
                let isEdge = false;
                for (let dy = -outlineThickness; dy <= outlineThickness; dy++) {
                  for (let dx = -outlineThickness; dx <= outlineThickness; dx++) {
                    if (dx*dx + dy*dy <= outlineThickness*outlineThickness) {
                      const nx = x + dx;
                      const ny = y + dy;
                      if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        if (isBody[ny * w + nx] === 0) {
                          isEdge = true;
                          break;
                        }
                      } else {
                         isEdge = true;
                      }
                    }
                  }
                  if (isEdge) break;
                }

                if (isEdge) {
                  finalData.data[idx4] = 0;
                  finalData.data[idx4+1] = 0;
                  finalData.data[idx4+2] = 0;
                  finalData.data[idx4+3] = 255;
                }
              }
            }
          }
          
          finalCtx.putImageData(finalData, 0, 0);
          resolve(finalCanvas.toDataURL('image/jpeg', 1.0));
        };
        silImg.src = silhouetteDataUrl;
      };
      genImg.src = `data:image/jpeg;base64,${generatedBase64}`;
    });
  };

  const generateSilhouette = (srcDataUrl) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const w = img.width;
      const h = img.height;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // 左右反転
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0);

      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;
      
      const isBlack = (idx) => {
        const r = data[idx];
        const g = data[idx+1];
        const b = data[idx+2];
        const a = data[idx+3];
        // 透明または明るい色は白、それ以外を線とする
        return a > 128 && (r < 220 || g < 220 || b < 220);
      };

      const bgMap = new Uint8Array(w * h);
      const stackX = new Int32Array(w * h);
      const stackY = new Int32Array(w * h);
      let stackPtr = 0;

      const pushBg = (x, y) => {
        const idx = y * w + x;
        if (bgMap[idx] === 0) {
          bgMap[idx] = 1;
          stackX[stackPtr] = x;
          stackY[stackPtr] = y;
          stackPtr++;
        }
      };

      // 1. 外側背景のフラッドフィル
      for (let x = 0; x < w; x++) {
        if (!isBlack((x) * 4)) pushBg(x, 0);
        if (!isBlack(((h - 1) * w + x) * 4)) pushBg(x, h - 1);
      }
      for (let y = 0; y < h; y++) {
        if (!isBlack((y * w) * 4)) pushBg(0, y);
        if (!isBlack((y * w + w - 1) * 4)) pushBg(w - 1, y);
      }

      const dx = [1, -1, 0, 0];
      const dy = [0, 0, 1, -1];

      while (stackPtr > 0) {
        stackPtr--;
        const cx = stackX[stackPtr];
        const cy = stackY[stackPtr];

        for (let i = 0; i < 4; i++) {
          const nx = cx + dx[i];
          const ny = cy + dy[i];

          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            const idx = ny * w + nx;
            if (bgMap[idx] === 0 && !isBlack(idx * 4)) {
              pushBg(nx, ny);
            }
          }
        }
      }

      // 2. 完全なシルエット画像(黒ベタ)の再構築
      for (let i = 0; i < w * h; i++) {
        const idx = i * 4;
        
        if (bgMap[i] === 1) {
          // 背景は白
          data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255; data[idx+3] = 255;
        } else {
          // 内側はすべて真っ黒なシルエットにする
          data[idx] = 0; data[idx+1] = 0; data[idx+2] = 0; data[idx+3] = 255;
        }
      }

      ctx.putImageData(imageData, 0, 0);
      const resultBase64Url = canvas.toDataURL('image/jpeg', 1.0);
      const resultBase64 = resultBase64Url.split(',')[1];
      
      setSilhouetteImage({
        preview: resultBase64Url,
        base64: resultBase64,
        mimeType: 'image/jpeg'
      });
    };
    img.src = srcDataUrl;
  };

  const handleImage1Change = (imgData) => {
    setImage1(imgData);
    if (imgData) {
      generateSilhouette(imgData.preview);
    } else {
      setSilhouetteImage(null);
    }
  };

  const generateImage = async () => {
    if (!image1 || !silhouetteImage) {
      setErrorMsg('正面線画をセットしてください。');
      return;
    }

    setIsGenerating(true);
    setErrorMsg('');
    setResultImage(null);

    const apiKey = ""; // ランタイムで提供される
    const url = `/api/ai`;

    let prompt = `あなたはレーザー彫刻用データを作る画像職人AIです。
入力として以下の画像を提供します。
1枚目：正面線画
2枚目：シルエット（木材パーツの形を黒ベタで表したもの）`;

    if (originalImage) {
      prompt += `\n3枚目：元画像（キャラクターや動物の元の写真・イラスト）`;
    }

    prompt += `\n\nあなたの仕事は、1枚目の正面線画から「後ろ姿」を推測し、2枚目のシルエットの【黒い部分の内側】に「後ろ姿の白黒線画」を描くことです。

【特に重要な指示】
- しっぽ: 1枚目の正面線画に描かれている「しっぽの向き、曲がり方、位置、長さ」を完全に踏襲して後ろ姿を描いてください。2枚目のシルエットもしっぽの形に合わせて作られているため、シルエットの出っ張り部分にピッタリとしっぽを配置してください。`;

    if (originalImage) {
      prompt += `\n- 柄・模様: 3枚目の元画像と、1枚目の正面線画に描かれている柄や模様をしっかりと参考にし、後ろ姿として自然になるように柄を反映させてください。`;
    } else {
      prompt += `\n- 柄・模様: 1枚目の正面線画に描かれている柄や模様をしっかりと参考にし、後ろ姿として自然になるように柄を反映させてください。`;
    }

    prompt += `\n\n守るべきルール:
- キャンバスの形（シルエット）を一切変更しない
- 黒いシルエットからはみ出さずに後ろ姿を描くこと
- 頭・耳・体のボリューム感などは、1枚目の正面線画と整合性を持たせる
- 背景は完全に白、線は太めでくっきりした黒一色のみ
- グレー・塗り・影は絶対に使わないこと`;

    const parts = [
      { text: prompt },
      { inlineData: { mimeType: image1.mimeType, data: image1.base64 } },
      { inlineData: { mimeType: silhouetteImage.mimeType, data: silhouetteImage.base64 } }
    ];

    if (originalImage) {
      parts.push({ inlineData: { mimeType: originalImage.mimeType, data: originalImage.base64 } });
    }

    const payload = {
      contents: [
        {
          parts: parts
        }
      ],
      generationConfig: {
        responseModalities: ['TEXT', 'IMAGE']
      }
    };

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const delays = [1000, 2000, 4000, 8000, 16000];
    let success = false;

    for (let i = 0; i < 6; i++) {
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        const base64Img = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

        if (base64Img) {
          const maskedImage = await applyMask(base64Img, silhouetteImage.preview);
          setResultImage(maskedImage);
          success = true;
          break;
        } else {
          throw new Error('画像データが取得できませんでした。');
        }
      } catch (err) {
        if (i < 5) {
          await sleep(delays[i]);
        } else {
          setErrorMsg('画像の生成に失敗しました。時間をおいて再試行してください。');
        }
      }
    }
    
    setIsGenerating(false);
  };

  return (
    <div className="min-h-screen bg-gray-100 p-4 md:p-8 font-sans">
      <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-10">
        <h1 className="text-2xl md:text-3xl font-extrabold text-center text-gray-800 mb-8 tracking-tight">
          両面レーザー彫刻 後ろ姿ジェネレーター
        </h1>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <ImageDropzone 
            label="1: 正面線画(必須)" 
            image={image1} 
            onImageChange={handleImage1Change} 
          />
          <ImageDropzone 
            label="2: 元画像(任意・柄参考)" 
            image={originalImage} 
            onImageChange={setOriginalImage} 
          />
          <SilhouettePreview image={silhouetteImage} />
        </div>

        {errorMsg && (
          <div className="mb-6 p-4 bg-red-50 text-red-600 rounded-lg text-center font-medium">
            {errorMsg}
          </div>
        )}

        <div className="flex justify-center mb-10">
          <button
            onClick={generateImage}
            disabled={isGenerating || !image1 || !silhouetteImage}
            className={`px-8 py-4 rounded-full font-bold text-lg shadow-md transition-all ${
              isGenerating || !image1 || !silhouetteImage
                ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                : 'bg-black text-white hover:bg-gray-800 hover:shadow-lg transform hover:-translate-y-1'
            }`}
          >
            {isGenerating ? (
              <span className="flex items-center">
                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                AIで後ろ姿を生成中...
              </span>
            ) : (
              '後ろ姿を生成する'
            )}
          </button>
        </div>

        {resultImage && (
          <div className="border-t pt-8">
            <h2 className="text-xl font-bold text-center text-gray-800 mb-4">生成結果</h2>
            <div className="flex justify-center">
              <div className="w-full max-w-md bg-gray-50 p-4 rounded-xl border">
                <img src={resultImage} alt="生成された後ろ姿" className="w-full h-auto object-contain" />
              </div>
            </div>
            <div className="mt-6 flex justify-center">
               <a 
                  href={resultImage} 
                  download="back-design.jpg"
                  className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors"
                >
                  画像を保存
               </a>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
