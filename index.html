    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

                    <!-- 画像がない場合のフォールバック -->
                    <div class="hidden">
                        <h1 class="text-xl font-bold tracking-tight text-slate-800">Linklabo APP</h1>
                        <p class="text-xs text-slate-500">想いをカタチにするレーザー加工専門店</p>
                    </div>
                     <!-- 画像がある場合もテキストを表示したい場合は調整 -->
                    <div class="block md:hidden lg:block"> <!-- 必要に応じて表示制御 -->

                        <p class="text-xs text-slate-500">想いをカタチにするレーザー加工専門店</p>
                    </div>
                </div>

                <!-- 検索バー -->

                    <div class="relative flex-grow">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">

                        </div>
                        <input type="text" id="searchInput" 
                               class="block w-full pl-10 pr-3 py-2 border border-slate-200 rounded-lg leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out" 
                               placeholder="アプリ名、キーワードで検索...">
                    </div>
                    <!-- 設定ボタン -->
                    <button onclick="toggleEditMode()" id="editModeBtn" class="p-2 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-100 transition-colors" title="カテゴリー編集モード">
                        <i class="ph ph-gear text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 編集モード時のツールバー -->
        <div id="editToolbar" class="hidden bg-amber-50 border-b border-amber-200 py-2 px-4">
            <div class="max-w-7xl auto flex justify-between items-center text-amber-800 text-sm">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-pencil-simple"></i>
                    <span class="font-bold">編集モード中:</span>
                    <span>カテゴリー名の変更や、カードの移動ができます。</span>
                </div>
                <button onclick="resetAllData()" class="text-xs underline hover:text-red-600">初期設定に戻す</button>
            </div>
        </div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                    <!-- JSでボタンを生成 -->
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- お気に入り（メイン）セクション -->
        <section id="favoritesSection" class="mb-12 hidden fade-in">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">

                </div>
            </div>
            <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- JSで描画 -->
            </div>
        </section>

            <h2 id="currentViewTitle" class="text-lg font-bold text-slate-700 flex items-center gap-2">
                <i class="ph ph-squares-four text-slate-400"></i>
                <span>アプリ一覧</span>
            </h2>
            <div id="resultCount" class="text-sm text-slate-500"></div>
        </div>

        <!-- ライブラリ（一覧表示エリア） -->
        <div id="libraryContainer" class="fade-in min-h-[300px]">
            <!-- JSで描画 -->
        </div>

    </main>

                icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`,
                keywords: "キョロ目, 正面, キャラクター, 目"
            },
            {
                id: "kyorome_back",
                title: "キョロ目 後ろ姿",
                desc: "キョロ目の後ろ姿デザイン作成アシスト",
                url: "https://gemini.google.com/share/dcdb316af71b",
                initialCategory: "design_tools",
                colorTheme: "indigo",
                icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`,
                keywords: "キョロ目, 後ろ姿, キャラクター, 目"
            },
            {
                id: "color_conversion",
                title: "絵のカラー変換",
                desc: "絵やイラストのカラーをAIで変換・調整",
                url: "https://gemini.google.com/share/09bb06e725ae",
                initialCategory: "image_processing",
                colorTheme: "pink",
                icon: `<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.53-.21-1.04-.58-1.41-.37-.38-.58-.89-.58-1.42 0-1.1.9-2 2-2h1.5c2.76 0 5-2.24 5-5 0-4.42-4.48-8-10-8zm-4 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3-4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3 4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>`,
                keywords: "カラー, 変換, 色, color"
            },
            {
                id: "insta_cover",
                title: "インスタ カバー生成",
                desc: "Instagram用のカバー画像をAIで生成",
                url: "https://gemini.google.com/share/37c3ea8e6418",
                initialCategory: "design_tools",
                colorTheme: "rose",
                icon: `<rect width="16" height="16" x="4" y="4" rx="4"/><circle cx="12" cy="12" r="3"/><path d="M16.5 7.5v.01"/>`,
                keywords: "インスタ, Instagram, カバー, sns"
            },
            {
                id: "tool_drawing_maker",
                title: "道具描画メーカー",
                desc: "様々な道具のイラストをAIで生成します",
                url: "https://gemini.google.com/share/61568d3d441a",
                initialCategory: "design_tools",
                colorTheme: "amber",
                icon: `<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>`,
                keywords: "道具, 描画, ツール, メーカー, tool"
            },
            {
                id: "mercari_copywriter",
                title: "メルカリコピーライター",
                desc: "メルカリでの出品説明文をAIが作成",
                url: "https://gemini.google.com/share/2b195212a9bc",
                initialCategory: "business_tools",
                colorTheme: "red",
                icon: `<path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />`,
                keywords: "メルカリ, 出品, コピー, フリマ"
            },
            {
                id: "mystery_mansion",
                title: "AI 神秘の館",
                desc: "神秘的なデザインや世界観のアイデアをAIが生成します",
                url: "https://gemini.google.com/share/3ab133dac4d3",
                initialCategory: "design_tools",
                colorTheme: "violet",
                icon: `<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/>`,
                keywords: "神秘, 館, デザイン, mystery"
            },
            {
                id: "lineart_charm",
                title: "AI 線画チャームメーカー",
                desc: "線画からオリジナルチャームのデザインを作成します",
                url: "https://gemini.google.com/share/c8333052ec20",
                initialCategory: "design_tools",
                colorTheme: "teal",
                icon: `<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>`,
                keywords: "線画, チャーム, アクセサリー, メーカー"
            }
        ];

        // --- 2. 状態管理 ---
        let state = {
            searchQuery: "",
            filterCategory: "all",
            favorites: [],
            isEditMode: false,
            customCategoryLabels: {},
            customAppCategories: {}
        };

        const favoritesSection = document.getElementById('favoritesSection');
        const favoritesGrid = document.getElementById('favoritesGrid');
        const libraryContainer = document.getElementById('libraryContainer');
        const searchInput = document.getElementById('searchInput');
        const resultCount = document.getElementById('resultCount');
        const categoryNav = document.getElementById('categoryNav');
        const currentViewTitle = document.getElementById('currentViewTitle');
        const editModeBtn = document.getElementById('editModeBtn');
        const editToolbar = document.getElementById('editToolbar');

        // --- 4. ヘルパー関数 ---
        const getCategoryLabel = (catId) => {
            return state.customCategoryLabels[catId] || defaultCategories[catId] || catId;
        };

        const getAppCategory = (app) => {
            return state.customAppCategories[app.id] || app.initialCategory;
        };

        const getColorClasses = (color) => {
            const map = {
                blue:   { bg: 'bg-blue-600', text: 'text-blue-600', hoverText: 'group-hover:text-blue-700', border: 'bg-blue-600' },
                indigo: { bg: 'bg-indigo-600', text: 'text-indigo-600', hoverText: 'group-hover:text-indigo-700', border: 'bg-indigo-600' },
                purple: { bg: 'bg-purple-600', text: 'text-purple-600', hoverText: 'group-hover:text-purple-700', border: 'bg-purple-600' },
                emerald:{ bg: 'bg-emerald-600', text: 'text-emerald-600', hoverText: 'group-hover:text-emerald-700', border: 'bg-emerald-600' },
                pink:   { bg: 'bg-pink-600', text: 'text-pink-600', hoverText: 'group-hover:text-pink-700', border: 'bg-pink-600' },
                cyan:   { bg: 'bg-cyan-700', text: 'text-cyan-700', hoverText: 'group-hover:text-cyan-800', border: 'bg-cyan-700' },
                orange: { bg: 'bg-orange-500', text: 'text-orange-500', hoverText: 'group-hover:text-orange-600', border: 'bg-orange-500' },
                lime:   { bg: 'bg-lime-600', text: 'text-lime-600', hoverText: 'group-hover:text-lime-700', border: 'bg-lime-600' },
                rose:   { bg: 'bg-rose-500', text: 'text-rose-500', hoverText: 'group-hover:text-rose-600', border: 'bg-rose-500' },
                teal:   { bg: 'bg-teal-600', text: 'text-teal-600', hoverText: 'group-hover:text-teal-700', border: 'bg-teal-600' },
                amber:  { bg: 'bg-amber-500', text: 'text-amber-600', hoverText: 'group-hover:text-amber-600', border: 'bg-amber-500' },
                fuchsia:{ bg: 'bg-fuchsia-600', text: 'text-fuchsia-600', hoverText: 'group-hover:text-fuchsia-700', border: 'bg-fuchsia-600' },
                red:    { bg: 'bg-red-600', text: 'text-red-600', hoverText: 'group-hover:text-red-700', border: 'bg-red-600' },
                violet: { bg: 'bg-violet-600', text: 'text-violet-600', hoverText: 'group-hover:text-violet-700', border: 'bg-violet-600' },
                sky:    { bg: 'bg-sky-500', text: 'text-sky-500', hoverText: 'group-hover:text-sky-600', border: 'bg-sky-500' },
                slate:  { bg: 'bg-slate-600', text: 'text-slate-600', hoverText: 'group-hover:text-slate-700', border: 'bg-slate-600' },
            };
            return map[color] || map['blue'];
        };

        const createCardHTML = (app) => {
            const colors = getColorClasses(app.colorTheme);
            const isFav = state.favorites.includes(app.id);
            const starClass = isFav ? "ph-fill ph-star text-yellow-400" : "ph ph-star text-slate-300 hover:text-yellow-400";
            const currentCat = getAppCategory(app);

            let editControl = "";
            if (state.isEditMode) {
                const options = Object.keys(defaultCategories).map(catId => {
                    const label = getCategoryLabel(catId);
                    const selected = catId === currentCat ? "selected" : "";
                    return `<option value="${catId}" ${selected}>${label}</option>`;
                }).join('');

                editControl = `
                    <div class="mt-3 pt-3 border-t border-slate-100" onclick="event.preventDefault()">
                        <label class="text-xs text-slate-400 block mb-1">カテゴリー移動:</label>
                        <select onchange="changeAppCategory('${app.id}', this.value)" 
                                class="w-full text-xs p-1.5 border border-slate-200 rounded bg-slate-50 text-slate-700 focus:outline-none focus:border-blue-500">
                            ${options}
                        </select>
                    </div>
                `;
            }

            return `
            <div class="group relative bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 border border-slate-100 flex flex-col h-full">
                <div class="absolute left-0 top-0 bottom-0 w-2 ${colors.border} group-hover:w-3 transition-all duration-300 rounded-l-2xl"></div>
                <button onclick="toggleFavorite('${app.id}')" class="absolute top-4 right-4 z-10 p-1 rounded-full hover:bg-slate-50 transition-colors" title="${isFav ? 'お気に入りから削除' : 'お気に入りに追加'}">
                    <i class="${starClass} text-xl transition-colors"></i>
                </button>
                <a href="${app.url}" target="_blank" class="flex-grow p-6 pl-8 block no-underline flex flex-col">
                    <div class="flex-grow">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="${colors.bg} bg-opacity-10 p-2.5 rounded-full ${colors.text} group-hover:scale-110 transition-all duration-300">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    ${app.icon}
                                </svg>
                            </div>
                            <span class="text-xs font-bold text-slate-400 tracking-wider uppercase truncate">${app.id.replace('_', ' ')}</span>
                        </div>
                        <h2 class="text-xl font-bold text-slate-800 ${colors.hoverText} transition-colors line-clamp-1">${app.title}</h2>
                        <p class="text-sm text-slate-500 mt-2 line-clamp-2">${app.desc}</p>
                    </div>
                    ${editControl}
                </a>
            </div>
            `;
        };

        const renderNav = () => {
            const activeCategories = ["all", ...defaultCategoryOrder];
            categoryNav.innerHTML = activeCategories.map(cat => {
                const isAll = cat === 'all';
                let label = isAll ? "すべて表示" : getCategoryLabel(cat);
                const isActive = state.filterCategory === cat;
                const activeClass = isActive 
                    ? "bg-slate-800 text-white shadow-md" 
                    : "bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800";
                
                return `
                <button onclick="setFilter('${cat}')" 
                    class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 whitespace-nowrap ${activeClass}">
                    ${label}
                </button>`;
            }).join('');
        };

        const render = () => {
            const query = state.searchQuery.toLowerCase().trim();
            const processedApps = defaultAppsData.map(app => ({
                ...app,
                currentCategory: getAppCategory(app),
                categoryLabel: getCategoryLabel(getAppCategory(app))
            }));

            let filteredApps = processedApps;
            if (state.filterCategory !== 'all') {
                filteredApps = filteredApps.filter(app => app.currentCategory === state.filterCategory);
                const currentLabel = getCategoryLabel(state.filterCategory);
                currentViewTitle.innerHTML = `<i class="ph ph-folder text-slate-400"></i><span>${currentLabel}</span>`;
            } else {
                currentViewTitle.innerHTML = `<i class="ph ph-squares-four text-slate-400"></i><span>アプリ一覧</span>`;
            }

            if (query) {
                filteredApps = filteredApps.filter(app => {
                    const searchStr = `${app.title} ${app.desc} ${app.keywords} ${app.categoryLabel}`.toLowerCase();
                    return searchStr.includes(query);
                });
            }

            resultCount.textContent = `${filteredApps.length} アプリ`;

            const favApps = processedApps.filter(app => state.favorites.includes(app.id));
            let visibleFavApps = favApps;
            if(query) {
                visibleFavApps = favApps.filter(app => filteredApps.find(fa => fa.id === app.id));
            }
            if (visibleFavApps.length > 0 && !state.isEditMode) { 
                favoritesSection.classList.remove('hidden');
                favoritesGrid.innerHTML = visibleFavApps.map(app => createCardHTML(app)).join('');
            } else {
                favoritesSection.classList.add('hidden');
            }

            libraryContainer.innerHTML = '';
            
            if (filteredApps.length === 0) {
                libraryContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                        <i class="ph ph-magnifying-glass text-4xl mb-3"></i>
                        <p>該当するアプリが見つかりません</p>
                    </div>`;
                renderNav();
                updateEditUI();
                return;
            }

            if (state.filterCategory === 'all' && !query) {
                defaultCategoryOrder.forEach(catKey => {
                    const catApps = filteredApps.filter(app => app.currentCategory === catKey);
                    if (catApps.length === 0 && !state.isEditMode) return;
                    const catLabel = getCategoryLabel(catKey);

                    let headerContent;
                    if (state.isEditMode) {
                        headerContent = `
                            <div class="flex items-center gap-2 w-full max-w-md">
                                <i class="ph-fill ph-pencil-simple text-amber-500"></i>
                                <input type="text" value="${catLabel}" 
                                    onchange="updateCategoryLabel('${catKey}', this.value)"
                                    class="flex-grow border-b-2 border-amber-300 bg-amber-50 px-2 py-1 text-lg font-bold text-slate-700 focus:outline-none focus:border-amber-500"
                                    placeholder="カテゴリー名を入力">
                            </div>
                        `;
                    } else {
                        headerContent = `
                            <span class="text-lg font-bold text-slate-600">${catLabel}</span>
                            <span class="text-xs font-normal text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">${catApps.length}</span>
                        `;
                    }

                    const section = document.createElement('div');
                    section.className = 'mb-10';
                    section.innerHTML = `
                        <div class="mb-4 pl-3 border-l-4 ${state.isEditMode ? 'border-amber-400' : 'border-slate-300'} flex items-center gap-2 h-10">
                            ${headerContent}
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${catApps.length > 0 ? catApps.map(app => createCardHTML(app)).join('') : '<p class="text-sm text-slate-400 col-span-3 italic pl-2">このカテゴリーにはアプリがありません</p>'}
                        </div>
                    `;
                    libraryContainer.appendChild(section);
                });
            } else {
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';
                grid.innerHTML = filteredApps.map(app => createCardHTML(app)).join('');
                libraryContainer.appendChild(grid);
            }

            renderNav();
            updateEditUI();
        };

        const updateEditUI = () => {
            if (state.isEditMode) {
                editModeBtn.classList.add('bg-amber-100', 'text-amber-600', 'border-amber-300');
                editToolbar.classList.remove('hidden');
                document.body.classList.add('border-4', 'border-amber-400', 'min-h-screen');
            } else {
                editModeBtn.classList.remove('bg-amber-100', 'text-amber-600', 'border-amber-300');
                editToolbar.classList.add('hidden');
                document.body.classList.remove('border-4', 'border-amber-400', 'min-h-screen');
            }
        };

        const saveState = () => {
            localStorage.setItem('linklabo_favorites', JSON.stringify(state.favorites));
            localStorage.setItem('linklabo_custom_labels', JSON.stringify(state.customCategoryLabels));
            localStorage.setItem('linklabo_app_cats', JSON.stringify(state.customAppCategories));
        };

        window.toggleFavorite = (id) => {
            if (event) event.preventDefault();
            if (state.favorites.includes(id)) {
                state.favorites = state.favorites.filter(favId => favId !== id);
            } else {
                state.favorites.push(id);
            }
            saveState();
            render();
        };

        window.setFilter = (category) => {
            state.filterCategory = category;
            render();
        };

        window.resetView = () => {
            state.filterCategory = 'all';
            state.searchQuery = '';
            searchInput.value = '';
            render();
        };

        window.toggleEditMode = () => {
            state.isEditMode = !state.isEditMode;
            if (state.isEditMode) {
                state.filterCategory = 'all';
            }
            render();
        };

        window.updateCategoryLabel = (catId, newLabel) => {
            if (!newLabel.trim()) return;
            state.customCategoryLabels[catId] = newLabel;
            saveState();
            render();
        };

        window.changeAppCategory = (appId, newCatId) => {
            state.customAppCategories[appId] = newCatId;
            saveState();
            render();
        };

        window.resetAllData = () => {
            if(confirm("すべての設定（カテゴリー名、移動、お気に入り）を初期状態に戻しますか？")) {
                localStorage.removeItem('linklabo_favorites');
                localStorage.removeItem('linklabo_custom_labels');
                localStorage.removeItem('linklabo_app_cats');
                location.reload();
            }
        };

        searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            render();
        });

        const init = () => {
            const savedFavorites = localStorage.getItem('linklabo_favorites');
            const savedLabels = localStorage.getItem('linklabo_custom_labels');
            const savedAppCats = localStorage.getItem('linklabo_app_cats');

            if (savedFavorites) {
                state.favorites = JSON.parse(savedFavorites);
            } else {
                state.favorites = ['processing', 'ai_translate']; 
            }

            if (savedLabels) state.customCategoryLabels = JSON.parse(savedLabels);
            if (savedAppCats) state.customAppCategories = JSON.parse(savedAppCats);

            render();
        };

        init();
    </script>
</body>
</html>
