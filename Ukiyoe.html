<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App - Linklabo AI Tool</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    const icon = lucide.icons[name];
                    if (icon) {
                        lucide.createIcons({
                            icons: { [name]: icon },
                            nameAttr: 'data-lucide',
                            attrs: { 'stroke-width': 2, width: size, height: size, class: className }
                        });
                    }
                }
            }, [name, size, className]);
            return <i ref={ref} data-lucide={name.toLowerCase()} className={className} style={ { width: size, height: size, display: 'inline-block' } }></i>;
        };

        const Lucide = {
            UploadCloud: (props) => <Icon name="UploadCloud" {...props} />,
            ImagePlus: (props) => <Icon name="ImagePlus" {...props} />,
            Save: (props) => <Icon name="Save" {...props} />,
            RefreshCw: (props) => <Icon name="RefreshCw" {...props} />,
            Loader2: (props) => <Icon name="Loader2" {...props} />,
            Sparkles: (props) => <Icon name="Sparkles" {...props} />,
            X: (props) => <Icon name="X" {...props} />,
            MessageSquare: (props) => <Icon name="MessageSquare" {...props} />,
            Pencil: (props) => <Icon name="Pencil" {...props} />,
            Upload: (props) => <Icon name="Upload" {...props} />,
            Download: (props) => <Icon name="Download" {...props} />,
            Trash2: (props) => <Icon name="Trash2" {...props} />,
            Edit: (props) => <Icon name="Edit" {...props} />,
            RefreshCw: (props) => <Icon name="RefreshCw" {...props} />,
            Search: (props) => <Icon name="Search" {...props} />,
        };

                const { UploadCloud, ImagePlus, Save, RefreshCw, Loader2, Sparkles, X, MessageSquare, Pencil, Upload, Download, Trash2, Edit, Search } = Lucide;

        // Main code
        
// --- SVG Icons ---
const IconUpload = () => <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
const IconSquare = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>;
const IconCircle = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/></svg>;
const IconDownload = () => <svg className="w-4 h-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
const IconEdit = () => <svg className="w-4 h-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
const IconTrash = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
const IconLoader = () => <svg className="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;

const apiKey = ""; // ランタイムで提供されます

function App() {
  const [sourceImage, setSourceImage] = useState(null); // Base64
  const [prompt, setPrompt] = useState("");
  const [artStyle, setArtStyle] = useState("ukiyoe");
  const [shape, setShape] = useState("square"); // 'square' | 'circle'
  const [size, setSize] = useState(512);
  const [aspectRatio, setAspectRatio] = useState("1:1");
  const [isMonochrome, setIsMonochrome] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [results, setResults] = useState([]); // { url: string, error?: string }[]
  const [isDragging, setIsDragging] = useState(false);
  const [globalError, setGlobalError] = useState("");
  const fileInputRef = useRef(null);

  // --- API Fetch with Retry ---
  const fetchWithRetry = async (url, options, retries = 5) => {
    const delays = [1000, 2000, 4000, 8000, 16000];
    for (let i = 0; i < retries; i++) {
      try {
        const res = await fetch(url, options);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `API Error: ${res.status}`);
        }
        return await res.json();
      } catch (e) {
        if (i === retries - 1) throw e;
        await new Promise(resolve => setTimeout(resolve, delays[i]));
      }
    }
  };

  // --- Image Generation Logic ---
  const generateSingleImage = async () => {
    const STYLES = {
      ukiyoe: "浮世絵、伝統的な木版画スタイル、文字なし。 ",
      suibokuga: "水墨画、伝統的な墨絵スタイル、白黒、文字なし。 ",
      rinpa: "琳派スタイル、金箔背景、装飾的な日本画、文字なし。 ",
      yamatoe: "大和絵、古典的な日本の絵巻物スタイル、文字なし。 "
    };
    const basePrompt = STYLES[artStyle] || STYLES.ukiyoe;
    const monoPrompt = isMonochrome ? "白黒、モノクロ、グレースケール、無彩色。 " : "";
    const fullPrompt = basePrompt + monoPrompt + prompt;

    if (sourceImage) {
      // Image-to-Image (gemini-2.5-flash-image-preview)
      const url = "/api/ai";
      const base64Data = sourceImage.split(',')[1];
      const mimeType = sourceImage.split(',')[0].split(':')[1].split(';')[0];
      
      const payload = {
        contents: [{
          role: "user",
          parts: [
            { text: fullPrompt },
            { inlineData: { mimeType, data: base64Data } }
          ]
        }],
        generationConfig: { responseModalities: ['IMAGE'] }
      };

      const data = await fetchWithRetry(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const base64Out = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
      if (!base64Out) throw new Error("画像が生成されませんでした。");
      return `data:image/jpeg;base64,${base64Out}`;
      
    } else {
      // Text-to-Image (imagen-4.0-generate-001)
      const url = "/api/ai";
      const payload = {
        instances: { prompt: fullPrompt },
        parameters: { 
          sampleCount: 1,
          aspectRatio: aspectRatio
        }
      };

      const data = await fetchWithRetry(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const base64Out = data.predictions?.[0]?.bytesBase64Encoded;
      if (!base64Out) throw new Error("画像が生成されませんでした。");
      return `data:image/jpeg;base64,${base64Out}`;
    }
  };

  const handleGenerate = async () => {
    if (!prompt && !sourceImage) {
      setGlobalError("プロンプトまたは参照画像を入力してください。");
      return;
    }
    setGlobalError("");
    setIsGenerating(true);
    setResults([null, null, null]); // プレースホルダーを3つ用意

    const promises = [1, 2, 3].map(async (_, index) => {
      try {
        const url = await generateSingleImage();
        setResults(prev => {
          const newRes = [...prev];
          newRes[index] = { url };
          return newRes;
        });
      } catch (error) {
        setResults(prev => {
          const newRes = [...prev];
          newRes[index] = { error: "生成失敗" };
          return newRes;
        });
      }
    });

    await Promise.allSettled(promises);
    setIsGenerating(false);
  };

  // --- File Upload & Drag-and-Drop ---
  const handleFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => setSourceImage(e.target.result);
    reader.readAsDataURL(file);
  };

  const onDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
  const onDragLeave = () => setIsDragging(false);
  const onDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  };

  // --- Action Handlers ---
  const handleReEdit = (imgUrl) => {
    setSourceImage(imgUrl);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const downloadImage = (imgSrc) => {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = size;
      let h = size;
      if (aspectRatio === "16:9") { h = size * 9 / 16; }
      else if (aspectRatio === "9:16") { w = size * 9 / 16; }
      else if (aspectRatio === "4:3") { h = size * 3 / 4; }
      else if (aspectRatio === "3:4") { w = size * 3 / 4; }
      
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      
      // 背景を白で塗りつぶす（透過画像対策）
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);

      if (shape === 'circle') {
        ctx.beginPath();
        ctx.arc(w/2, h/2, Math.min(w, h)/2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
      }
      
      ctx.drawImage(img, 0, 0, w, h);
      
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/jpeg", 0.9);
      a.download = `ukiyoe_${Date.now()}.jpg`;
      a.click();
    };
    img.src = imgSrc;
  };

  return (
    <div className="min-h-screen bg-[#f4f1ea] text-[#2c3e50] font-serif selection:bg-[#c24a4a] selection:text-white">
      <header className="bg-[#2c3e50] text-[#f4f1ea] p-4 shadow-md flex items-center justify-between">
        <h1 className="text-xl md:text-2xl font-bold tracking-widest">日本の伝統絵画メーカー</h1>
      </header>

      <main className="max-w-6xl mx-auto p-4 flex flex-col md:flex-row gap-6">
        
        {/* --- 左側：入力エリア --- */}
        <section className="w-full md:w-1/3 bg-white p-6 rounded-lg shadow-sm border border-[#e0dac8]">
          <h2 className="text-lg font-bold mb-4 border-b-2 border-[#c24a4a] inline-block pb-1">設定</h2>

          {/* 画風（スタイル）の選択 */}
          <div className="mb-6">
            <label className="block text-sm font-semibold mb-2">画風</label>
            <select
              value={artStyle}
              onChange={(e) => setArtStyle(e.target.value)}
              className="w-full border border-[#d0c9b8] rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#c24a4a] bg-[#faf8f5]"
            >
              <option value="ukiyoe">浮世絵</option>
              <option value="suibokuga">水墨画</option>
              <option value="rinpa">琳派（金箔・装飾的）</option>
              <option value="yamatoe">大和絵（絵巻物風）</option>
            </select>
          </div>

          {/* アスペクト比と白黒 */}
          <div className="grid grid-cols-2 gap-4 mb-6">
            <div>
              <label className="block text-sm font-semibold mb-2">アスペクト比</label>
              <select
                value={aspectRatio}
                onChange={(e) => setAspectRatio(e.target.value)}
                className="w-full border border-[#d0c9b8] rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#c24a4a] bg-[#faf8f5]"
              >
                <option value="1:1">1:1 (正方形)</option>
                <option value="16:9">16:9 (横長)</option>
                <option value="9:16">9:16 (縦長)</option>
                <option value="4:3">4:3 (横長)</option>
                <option value="3:4">3:4 (縦長)</option>
              </select>
            </div>
            <div className="flex flex-col justify-end pb-2">
              <label className="flex items-center cursor-pointer">
                <input
                  type="checkbox"
                  checked={isMonochrome}
                  onChange={(e) => setIsMonochrome(e.target.checked)}
                  className="w-4 h-4 text-[#c24a4a] bg-gray-100 border-gray-300 rounded focus:ring-[#c24a4a]"
                />
                <span className="ml-2 text-sm font-semibold">白黒で出力</span>
              </label>
            </div>
          </div>

          {/* ドラッグ＆ドロップ / 画像アップロード */}
          <div className="mb-6">
            <label className="block text-sm font-semibold mb-2">参照画像 (任意)</label>
            <div 
              onDragOver={onDragOver}
              onDragLeave={onDragLeave}
              onDrop={onDrop}
              onClick={() => !sourceImage && fileInputRef.current?.click()}
              className={`border-2 border-dashed rounded-lg p-4 text-center cursor-pointer transition-colors
                ${isDragging ? 'border-[#c24a4a] bg-[#fff5f5]' : 'border-[#d0c9b8] hover:bg-[#faf8f5]'}
                ${sourceImage ? 'p-2 border-solid' : 'py-10'}
              `}
            >
              {sourceImage ? (
                <div className="relative group">
                  <img src={sourceImage} alt="参照" className="max-h-48 mx-auto rounded" />
                  <button 
                    onClick={(e) => { e.stopPropagation(); setSourceImage(null); }}
                    className="absolute top-2 right-2 bg-white/80 p-1 rounded-full text-red-600 hover:bg-white shadow"
                  >
                    <IconTrash />
                  </button>
                </div>
              ) : (
                <div className="flex flex-col items-center text-[#8e8775]">
                  <IconUpload />
                  <p className="mt-2 text-sm">ドラッグ＆ドロップ<br/>またはクリックしてアップロード</p>
                </div>
              )}
              <input 
                type="file" 
                ref={fileInputRef} 
                onChange={(e) => handleFile(e.target.files[0])} 
                className="hidden" 
                accept="image/*"
              />
            </div>
          </div>

          {/* コメント・プロンプト入力 */}
          <div className="mb-6">
            <label className="block text-sm font-semibold mb-2">コメント・指示内容</label>
            <textarea
              value={prompt}
              onChange={(e) => setPrompt(e.target.value)}
              placeholder="例：富士山を背景に、着物を着た猫"
              className="w-full border border-[#d0c9b8] rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-[#c24a4a] bg-[#faf8f5] resize-none h-24"
            />
          </div>

          {/* 形状とサイズ */}
          <div className="grid grid-cols-2 gap-4 mb-8">
            <div>
              <label className="block text-sm font-semibold mb-2">出力の形</label>
              <div className="flex gap-2">
                <button 
                  onClick={() => setShape("square")}
                  className={`flex-1 flex justify-center py-2 border rounded-md transition-colors ${shape === 'square' ? 'bg-[#2c3e50] text-white border-[#2c3e50]' : 'border-[#d0c9b8] text-[#555]'}`}
                >
                  <IconSquare />
                </button>
                <button 
                  onClick={() => setShape("circle")}
                  className={`flex-1 flex justify-center py-2 border rounded-md transition-colors ${shape === 'circle' ? 'bg-[#2c3e50] text-white border-[#2c3e50]' : 'border-[#d0c9b8] text-[#555]'}`}
                >
                  <IconCircle />
                </button>
              </div>
            </div>
            <div>
              <label className="block text-sm font-semibold mb-2">サイズ (px)</label>
              <input 
                type="number" 
                value={size}
                onChange={(e) => setSize(Number(e.target.value))}
                min="256" max="1024" step="64"
                className="w-full border border-[#d0c9b8] rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#c24a4a] bg-[#faf8f5]"
              />
            </div>
          </div>

          {globalError && <p className="text-[#c24a4a] text-sm mb-4">{globalError}</p>}

          <button
            onClick={handleGenerate}
            disabled={isGenerating}
            className="w-full bg-[#c24a4a] hover:bg-[#a93e3e] text-white font-bold py-3 px-4 rounded-md transition-colors flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
          >
            {isGenerating ? (
              <><span className="mr-2 animate-spin"><IconLoader /></span> 生成中...</>
            ) : "画像を生成する"}
          </button>
        </section>

        {/* --- 右側：プレビューエリア --- */}
        <section className="w-full md:w-2/3 bg-white p-6 rounded-lg shadow-sm border border-[#e0dac8] flex flex-col">
          <h2 className="text-lg font-bold mb-4 border-b-2 border-[#2c3e50] inline-block pb-1">生成結果 (3案)</h2>
          
          <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            {[0, 1, 2].map((i) => {
              const res = results[i];
              const isPlaceholder = !res && !isGenerating;
              const isLoading = !res && isGenerating;

              let aspectClass = "aspect-square";
              if (aspectRatio === "16:9") aspectClass = "aspect-video";
              if (aspectRatio === "9:16") aspectClass = "aspect-[9/16]";
              if (aspectRatio === "4:3") aspectClass = "aspect-[4/3]";
              if (aspectRatio === "3:4") aspectClass = "aspect-[3/4]";

              return (
                <div key={i} className="flex flex-col border border-[#e0dac8] rounded-lg p-3 bg-[#faf8f5]">
                  <div className={`flex-1 flex items-center justify-center bg-gray-100 rounded-md overflow-hidden relative border border-gray-200 ${aspectClass}`}>
                    {isPlaceholder && <span className="text-gray-400 text-sm">未生成</span>}
                    {isLoading && <IconLoader className="w-8 h-8 text-[#c24a4a] animate-spin" />}
                    {res?.error && <span className="text-[#c24a4a] text-sm">{res.error}</span>}
                    {res?.url && (
                      <img 
                        src={res.url} 
                        alt={`生成画像 ${i+1}`} 
                        className={`w-full h-full object-contain transition-all duration-300 ${shape === 'circle' ? 'rounded-full scale-95' : 'rounded-none'}`} 
                      />
                    )}
                  </div>
                  
                  {/* アクションボタン */}
                  <div className="mt-3 flex gap-2">
                    <button 
                      onClick={() => handleReEdit(res.url)}
                      disabled={!res?.url}
                      className="flex-1 flex items-center justify-center py-2 text-xs font-semibold rounded bg-[#2c3e50] text-white hover:bg-[#1a252f] disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                    >
                      <IconEdit /> 再編集
                    </button>
                    <button 
                      onClick={() => downloadImage(res.url)}
                      disabled={!res?.url}
                      className="flex-1 flex items-center justify-center py-2 text-xs font-semibold rounded bg-white border border-[#2c3e50] text-[#2c3e50] hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                    >
                      <IconDownload /> 保存
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </section>

      </main>
    </div>
  );
};

;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
