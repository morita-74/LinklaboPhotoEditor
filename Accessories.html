<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Laser Craft Designer - Linklabo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-800 selection:bg-orange-200">

    <header class="bg-white border-b border-neutral-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='index.html'">
                <i data-lucide="sparkles" class="w-6 h-6 text-orange-600"></i>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-600 to-amber-500">
                    AI Laser Craft Designer
                </h1>
            </div>
            <div class="text-xs font-medium px-3 py-1 bg-orange-100 text-orange-700 rounded-full">
                Powered by Linklabo AI
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Inputs -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- 1. Reference Images -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-neutral-100">
                    <h2 class="font-bold mb-3 flex items-center gap-2 text-neutral-700">
                        <i data-lucide="image" class="w-4 h-4"></i>
                        素材・パーツ画像 (必須)
                    </h2>
                    <div id="drop-zone" class="border-2 border-dashed border-neutral-300 rounded-xl p-6 text-center transition-colors hover:border-orange-400 hover:bg-orange-50 cursor-pointer">
                        <input type="file" id="file-input" multiple accept="image/*" class="hidden">
                        <i data-lucide="upload" class="w-8 h-8 text-neutral-400 mx-auto mb-2"></i>
                        <p class="text-sm text-neutral-500">
                            ここに画像をドロップ<br/>
                            <span class="text-xs opacity-70">またはクリックして選択</span>
                        </p>
                    </div>

                    <div id="uploaded-images-container" class="mt-4 space-y-3">
                        <!-- Uploaded images will be injected here -->
                    </div>
                </div>

                <!-- 2. Settings -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-neutral-100 space-y-4">
                    
                    <!-- Material Selection -->
                    <div>
                        <label class="block text-sm font-bold text-neutral-700 mb-2 flex items-center gap-2">
                            <i data-lucide="component" class="w-4 h-4"></i>
                            主材質（マテリアル）
                        </label>
                        <select id="material-select" class="w-full p-2.5 bg-neutral-50 border border-neutral-200 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all">
                            <option>写真の素材 (元の質感を維持)</option>
                            <option selected>木材 (MDF/合板)</option>
                            <option>透明アクリル</option>
                            <option>カラーアクリル</option>
                            <option>皮革 (レザー)</option>
                            <option>ステンレス/金属</option>
                            <option>フェルト</option>
                            <option>厚紙/カードボード</option>
                        </select>
                        <p id="material-hint" class="text-xs text-neutral-400 mt-1">※レーザー彫刻と切断（焦げ目あり）を反映します</p>
                    </div>

                    <!-- Cut Amount Selection -->
                    <div id="cut-amount-section">
                        <label class="block text-sm font-bold text-neutral-700 mb-2 flex items-center gap-2">
                            <i data-lucide="scissors" class="w-4 h-4"></i>
                            切断（カット）の量・複雑さ
                        </label>
                        <div class="flex bg-neutral-100 p-1 rounded-lg" id="cut-amount-group">
                            <button data-value="なし" class="flex-1 py-2 text-sm rounded-md transition-all text-neutral-500 hover:text-neutral-700">なし</button>
                            <button data-value="少ない" class="flex-1 py-2 text-sm rounded-md transition-all text-neutral-500 hover:text-neutral-700">少ない</button>
                            <button data-value="普通" class="flex-1 py-2 text-sm rounded-md transition-all bg-white text-orange-600 shadow-sm font-bold">普通</button>
                            <button data-value="多い" class="flex-1 py-2 text-sm rounded-md transition-all text-neutral-500 hover:text-neutral-700">多い</button>
                        </div>
                        <p class="text-xs text-neutral-400 mt-1">※抜き加工や透かし彫りの量を調整します</p>
                    </div>

                    <!-- Size Input -->
                    <div>
                        <label class="block text-sm font-bold text-neutral-700 mb-2 flex items-center gap-2">
                            <i data-lucide="ruler" class="w-4 h-4"></i>
                            写真内のパーツサイズ（基準）
                        </label>
                        <input type="text" id="size-input" placeholder="例：直径2mmの石, 幅50mmの板" class="w-full p-2.5 bg-neutral-50 border border-neutral-200 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all placeholder:text-neutral-400 text-sm">
                        <p class="text-xs text-neutral-400 mt-1">※「2mm」など小さい値を入力すると、AIはそれを小さなアクセントとして扱います</p>
                    </div>

                    <!-- Type Selection -->
                    <div>
                        <label class="block text-sm font-bold text-neutral-700 mb-2">アイテムの種類</label>
                        <select id="accessory-type-select" class="w-full p-2.5 bg-neutral-50 border border-neutral-200 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all">
                            <option selected>キーホルダー</option>
                            <option>ピアス/イヤリング</option>
                            <option>コースター</option>
                            <option>ネックレス</option>
                            <option>ブローチ</option>
                            <option>スタンド/ディスプレイ</option>
                            <option>オーナメント</option>
                            <option>その他</option>
                        </select>
                    </div>

                    <!-- Style Selection -->
                    <div>
                        <label class="block text-sm font-bold text-neutral-700 mb-2">スタイル・雰囲気</label>
                        <div class="flex flex-wrap gap-2" id="style-group">
                            <button data-value="ナチュラル" class="text-sm px-3 py-1.5 rounded-full border transition-all bg-orange-600 text-white border-orange-600 shadow-sm">ナチュラル</button>
                            <button data-value="幾何学的" class="text-sm px-3 py-1.5 rounded-full border transition-all bg-white text-neutral-600 border-neutral-200 hover:border-orange-300">幾何学的</button>
                            <button data-value="和風" class="text-sm px-3 py-1.5 rounded-full border transition-all bg-white text-neutral-600 border-neutral-200 hover:border-orange-300">和風</button>
                            <button data-value="北欧風" class="text-sm px-3 py-1.5 rounded-full border transition-all bg-white text-neutral-600 border-neutral-200 hover:border-orange-300">北欧風</button>
                            <button data-value="アンティーク" class="text-sm px-3 py-1.5 rounded-full border transition-all bg-white text-neutral-600 border-neutral-200 hover:border-orange-300">アンティーク</button>
                            <button data-value="ポップ" class="text-sm px-3 py-1.5 rounded-full border transition-all bg-white text-neutral-600 border-neutral-200 hover:border-orange-300">ポップ</button>
                            <button data-value="サイバーパンク" class="text-sm px-3 py-1.5 rounded-full border transition-all bg-white text-neutral-600 border-neutral-200 hover:border-orange-300">サイバーパンク</button>
                        </div>
                    </div>

                    <!-- Comment -->
                    <div>
                        <label class="block text-sm font-bold text-neutral-700 mb-2">加工指示・コメント</label>
                        <textarea id="user-comment" placeholder="例：ロゴを中央に深く彫刻して、周りを透かし彫りにする..." class="w-full p-3 bg-neutral-50 border border-neutral-200 rounded-lg h-24 resize-none focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all placeholder:text-neutral-400 text-sm"></textarea>
                    </div>
                </div>

                <button id="generate-btn" class="w-full py-4 rounded-xl font-bold text-white shadow-lg shadow-orange-200 flex items-center justify-center gap-2 transition-all transform active:scale-95 bg-gradient-to-r from-orange-600 to-amber-600 hover:shadow-orange-300">
                    <i data-lucide="wand-2" class="w-5 h-5"></i>
                    デザインを生成 (3案)
                </button>

                <div id="error-message" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-start gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i>
                    <span id="error-text"></span>
                </div>

            </div>

            <!-- Right Column: Results -->
            <div class="lg:col-span-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-100 min-h-[600px]">
                    <h2 class="font-bold text-xl mb-6 text-neutral-800 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i>
                        生成結果ギャラリー
                    </h2>

                    <div id="results-placeholder" class="h-[500px] flex flex-col items-center justify-center text-neutral-400 border-2 border-dashed border-neutral-100 rounded-xl bg-neutral-50">
                        <div class="text-center" id="idle-view">
                            <div class="w-20 h-20 bg-neutral-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="image" class="w-10 h-10 text-neutral-300"></i>
                            </div>
                            <p>左側のパネルから素材を追加・設定して<br/>「デザインを生成」を押してください</p>
                        </div>
                        <div class="text-center space-y-4 hidden" id="loading-view">
                            <div class="w-16 h-16 border-4 border-orange-200 border-t-orange-600 rounded-full animate-spin mx-auto"></div>
                            <p class="animate-pulse font-medium text-orange-600">AIがレーザー加工データを考案中...</p>
                            <p class="text-xs text-neutral-500" id="loading-details"></p>
                        </div>
                    </div>

                    <div id="results-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Result cards will be injected here -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- State Management ---
        let uploadedImages = [];
        let currentCutAmount = '普通';
        let currentStyle = 'ナチュラル';

        // --- DOM Elements ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const uploadedImagesContainer = document.getElementById('uploaded-images-container');
        const materialSelect = document.getElementById('material-select');
        const cutAmountSection = document.getElementById('cut-amount-section');
        const cutAmountGroup = document.getElementById('cut-amount-group');
        const styleGroup = document.getElementById('style-group');
        const generateBtn = document.getElementById('generate-btn');
        const resultsPlaceholder = document.getElementById('results-placeholder');
        const resultsGrid = document.getElementById('results-grid');
        const idleView = document.getElementById('idle-view');
        const loadingView = document.getElementById('loading-view');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        // --- Initialization ---
        lucide.createIcons();

        // --- Event Listeners ---
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => processFiles(Array.from(e.target.files));
        
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('bg-orange-50', 'border-orange-400'); };
        dropZone.ondragleave = () => { dropZone.classList.remove('bg-orange-50', 'border-orange-400'); };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-orange-50', 'border-orange-400');
            processFiles(Array.from(e.dataTransfer.files));
        };

        materialSelect.onchange = (e) => {
            const val = e.target.value;
            const isWood = val.includes('木材');
            cutAmountSection.style.display = isWood ? 'block' : 'none';
            document.getElementById('material-hint').innerText = isWood ? '※レーザー彫刻と切断（焦げ目あり）を反映します' : '※表面へのレーザー彫刻加工を反映します';
        };

        cutAmountGroup.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON') return;
            currentCutAmount = e.target.dataset.value;
            Array.from(cutAmountGroup.children).forEach(btn => {
                btn.className = "flex-1 py-2 text-sm rounded-md transition-all text-neutral-500 hover:text-neutral-700";
            });
            e.target.className = "flex-1 py-2 text-sm rounded-md transition-all bg-white text-orange-600 shadow-sm font-bold";
        };

        styleGroup.onclick = (e) => {
            if (e.target.tagName !== 'BUTTON') return;
            currentStyle = e.target.dataset.value;
            Array.from(styleGroup.children).forEach(btn => {
                btn.className = "text-sm px-3 py-1.5 rounded-full border transition-all bg-white text-neutral-600 border-neutral-200 hover:border-orange-300";
            });
            e.target.className = "text-sm px-3 py-1.5 rounded-full border transition-all bg-orange-600 text-white border-orange-600 shadow-sm";
        };

        generateBtn.onclick = generateImages;

        // --- Functions ---
        function processFiles(files) {
            const validFiles = files.filter(file => file.type.startsWith('image/'));
            validFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const id = Date.now() + Math.random();
                    uploadedImages.push({ id, src: e.target.result, count: 1 });
                    renderUploadedImages();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderUploadedImages() {
            uploadedImagesContainer.innerHTML = uploadedImages.map((img, idx) => `
                <div class="flex items-center gap-3 bg-neutral-50 p-2 rounded-lg border border-neutral-200">
                    <div class="w-16 h-16 shrink-0 bg-white rounded-md overflow-hidden border border-neutral-100">
                        <img src="${img.src}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-bold text-neutral-600">パーツ ${idx + 1}</span>
                            <button onclick="removeImage(${img.id})" class="text-neutral-400 hover:text-red-500">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-neutral-500">数量:</span>
                            <div class="flex items-center bg-white border border-neutral-200 rounded-md">
                                <button onclick="updateCount(${img.id}, -1)" class="p-1 hover:bg-neutral-100 text-neutral-600"><i data-lucide="minus" class="w-3 h-3"></i></button>
                                <span class="w-8 text-center text-sm font-medium">${img.count}</span>
                                <button onclick="updateCount(${img.id}, 1)" class="p-1 hover:bg-neutral-100 text-neutral-600"><i data-lucide="plus" class="w-3 h-3"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.removeImage = (id) => {
            uploadedImages = uploadedImages.filter(img => img.id !== id);
            renderUploadedImages();
        };

        window.updateCount = (id, change) => {
            uploadedImages = uploadedImages.map(img => {
                if (img.id === id) img.count = Math.max(1, img.count + change);
                return img;
            });
            renderUploadedImages();
        };

        async function generateImages() {
            if (uploadedImages.length === 0 && !document.getElementById('user-comment').value) {
                showError('画像またはコメントを入力してください。');
                return;
            }

            setLoading(true);
            errorMessage.classList.add('hidden');
            resultsGrid.innerHTML = '';

            const material = materialSelect.value;
            const size = document.getElementById('size-input').value;
            const accessoryType = document.getElementById('accessory-type-select').value;
            const userComment = document.getElementById('user-comment').value;

            // Prompt building logic (simplified from existing React code but same core)
            let basePrompt = `Design a SMALL, HANDHELD object suitable for laser cutter fabrication. Item Type: ${accessoryType}. Main Material: ${material}. Style: ${currentStyle}. `;
            if (material.includes('木材')) basePrompt += `Cut Complexity: ${currentCutAmount}. `;
            if (size) basePrompt += `Scale: Component size is ${size}. The base object should be 80-90% of the surface area. `;
            if (userComment) basePrompt += `User Request: ${userComment}. `;
            
            basePrompt += "Look: Product photography, showing the WHOLE object, studio lighting, white background. ";

            try {
                const results = [];
                // We'll call our internal API 3 times to get 3 variations (or one call if the API handles it)
                // For simplicity and since our API currently handles one generation, we call it in a loop
                for (let i = 0; i < 3; i++) {
                    const res = await fetch('/api/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: `${basePrompt} Variation ${i+1}: Unique arrangement.`,
                            image: uploadedImages[0]?.src.split(',')[1] // Just the first image for now, or could combine
                        })
                    });

                    const data = await res.json();
                    if (data.image) results.push(`data:image/png;base64,${data.image}`);
                }

                if (results.length === 0) throw new Error("画像を生成できませんでした。");
                renderResults(results);
            } catch (err) {
                showError('生成中にエラーが発生しました: ' + err.message);
            } finally {
                setLoading(false);
            }
        }

        function renderResults(results) {
            resultsPlaceholder.classList.add('hidden');
            resultsGrid.classList.remove('hidden');
            resultsGrid.innerHTML = results.map((src, idx) => `
                <div class="group relative bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 border border-neutral-100">
                    <div class="aspect-[3/4] overflow-hidden bg-neutral-100">
                        <img src="${src}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    </div>
                    <div class="p-4">
                        <button onclick="downloadImage('${src}', ${idx+1})" class="w-full py-2 text-sm font-medium text-neutral-600 bg-neutral-50 hover:bg-neutral-100 rounded-lg border border-neutral-200">保存する</button>
                    </div>
                </div>
            `).join('');
        }

        window.downloadImage = (src, idx) => {
            const link = document.createElement('a');
            link.href = src;
            link.download = `laser-design-${idx}.png`;
            link.click();
        };

        function setLoading(loading) {
            generateBtn.disabled = loading;
            idleView.classList.toggle('hidden', loading);
            loadingView.classList.toggle('hidden', !loading);
            if (loading) {
                document.getElementById('loading-details').innerText = `材質: ${materialSelect.value} / 案を生成中...`;
            } else {
                generateBtn.classList.remove('bg-neutral-400');
            }
        }

        function showError(msg) {
            errorMessage.classList.remove('hidden');
            errorText.innerText = msg;
        }
    </script>
</body>
</html>
